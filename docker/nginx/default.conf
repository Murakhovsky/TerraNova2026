map $http_x_forwarded_proto $cos_https {
    default $https;
    https on;
}

map $http_x_forwarded_proto $cos_request_scheme {
    default $scheme;
    https https;
}

map $http_x_forwarded_proto $cos_server_port {
    default $server_port;
    https 443;
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.php?_url=$uri&$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";

        # The public host nginx terminates TLS and forwards the original scheme.
        # PHP must see HTTPS=on for secure cookies, canonical URLs and redirects.
        fastcgi_param HTTPS $cos_https;
        fastcgi_param REQUEST_SCHEME $cos_request_scheme;
        fastcgi_param SERVER_PORT $cos_server_port;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;

        fastcgi_pass php:9000;
        fastcgi_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|webp|ico|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
