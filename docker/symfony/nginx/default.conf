resolver 127.0.0.11 valid=5s ipv6=off;

upstream cos_php_backend {
    zone cos_php_backend 64k;
    server php:9000 resolve;
}

upstream cos_mercure_backend {
    zone cos_mercure_backend 64k;
    server mercure:80 resolve;
}

map $http_x_forwarded_proto $cos_fastcgi_https {
    default off;
    https on;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/symfony/public;
    client_max_body_size 220m;

    location ^~ /uploads/spatial/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /build/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /img/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /sw.js {
        try_files $uri =404;
        default_type application/javascript;
        access_log off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /offline.html {
        try_files $uri =404;
        default_type text/html;
        access_log off;
        expires 5m;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /icons/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /.well-known/mercure {
        proxy_pass http://cos_mercure_backend/.well-known/mercure;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        add_header X-Accel-Buffering "no" always;
    }

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/symfony/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/symfony/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $cos_fastcgi_https;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_pass cos_php_backend;
        fastcgi_read_timeout 60s;
    }
}
