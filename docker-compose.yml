name: cos

services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      COS_ORGANIZATION_ID: ${COS_ORGANIZATION_ID:-default}
      LLM_ENDPOINT: ${LLM_ENDPOINT:-}
      LLM_TOKEN: ${LLM_TOKEN:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-http}
      AGENT_INPUT_RETENTION_DAYS: ${AGENT_INPUT_RETENTION_DAYS:-30}
      CRM_WEBHOOK_SECRET_DEFAULT_AIDA: ${CRM_WEBHOOK_SECRET_DEFAULT_AIDA:-}
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - frontend
      - backend

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: ["php", "app/bootstrap_cli.php", "worker", "run"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      COS_ORGANIZATION_ID: ${COS_ORGANIZATION_ID:-default}
      LLM_ENDPOINT: ${LLM_ENDPOINT:-}
      LLM_TOKEN: ${LLM_TOKEN:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-http}
      AGENT_INPUT_RETENTION_DAYS: ${AGENT_INPUT_RETENTION_DAYS:-30}
      CRM_WEBHOOK_SECRET_DEFAULT_AIDA: ${CRM_WEBHOOK_SECRET_DEFAULT_AIDA:-}
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: "no"
    command: ["php", "app/bootstrap_cli.php", "migration", "up"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      COS_ORGANIZATION_ID: ${COS_ORGANIZATION_ID:-default}
      LLM_ENDPOINT: ${LLM_ENDPOINT:-}
      LLM_TOKEN: ${LLM_TOKEN:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-http}
      AGENT_INPUT_RETENTION_DAYS: ${AGENT_INPUT_RETENTION_DAYS:-30}
      CRM_WEBHOOK_SECRET_DEFAULT_AIDA: ${CRM_WEBHOOK_SECRET_DEFAULT_AIDA:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

volumes:
  mysql_data:

networks:
  frontend:
  backend:
    internal: true
