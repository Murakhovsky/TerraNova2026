name: cos

x-app-environment: &app-environment
  APP_ENV: prod
  APP_DEBUG: "0"
  APP_SECRET: ${SYMFONY_APP_SECRET}
  COS_ORGANIZATION_ID: ${COS_ORGANIZATION_ID:-default}
  COS_SALES_AUTOMATION_SCHEDULER_ENABLED: ${COS_SALES_AUTOMATION_SCHEDULER_ENABLED:-1}
  COS_AGENT_LLM_MODE: ${COS_AGENT_LLM_MODE:-http}
  DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?serverVersion=8.4.0&charset=utf8mb4"
  REDIS_URL: redis://redis:6379
  MESSENGER_TRANSPORT_DSN: redis://redis:6379/cos_async
  MESSENGER_FAILED_TRANSPORT_DSN: redis://redis:6379/cos_failed
  LLM_ENDPOINT: ${LLM_ENDPOINT:-}
  LLM_TOKEN: ${LLM_TOKEN:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-http}
  WAVE6_CRM_WEBHOOK_SECRET: ${WAVE6_CRM_WEBHOOK_SECRET:-}
  SPATIAL_MAX_UPLOAD_BYTES: ${SPATIAL_MAX_UPLOAD_BYTES:-209715200}
  SPATIAL_JWT_SECRET: ${SPATIAL_JWT_SECRET}
  SPATIAL_JWT_TTL: ${SPATIAL_JWT_TTL:-28800}
  SPATIAL_BLENDER_BINARY: ${SPATIAL_BLENDER_BINARY:-}
  SPATIAL_GLTF_TRANSFORM_BINARY: ${SPATIAL_GLTF_TRANSFORM_BINARY:-}
  N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
  N8N_OUTBOUND_URL: ${N8N_OUTBOUND_URL:-}
  N8N_OUTBOUND_SECRET: ${N8N_OUTBOUND_SECRET:-}
  GROWTH_ENGAGEMENT_WEBHOOK_SECRET: ${GROWTH_ENGAGEMENT_WEBHOOK_SECRET:-}
  GROWTH_ENGAGEMENT_WEBHOOK_MAX_CLOCK_SKEW: ${GROWTH_ENGAGEMENT_WEBHOOK_MAX_CLOCK_SKEW:-300}
  COS_GROWTH_OUTREACH_DAILY_LIMIT: ${COS_GROWTH_OUTREACH_DAILY_LIMIT:-50}
  COS_GROWTH_OUTREACH_CONTACT_COOLDOWN_HOURS: ${COS_GROWTH_OUTREACH_CONTACT_COOLDOWN_HOURS:-24}
  APP_URL: ${APP_URL:-http://127.0.0.1:8081}
  MERCURE_URL: http://mercure/.well-known/mercure
  MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-${APP_URL:-http://127.0.0.1:8081}/.well-known/mercure}
  MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-${SYMFONY_APP_SECRET}}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-}

services:
  nginx:
    build:
      context: .
      dockerfile: docker/symfony/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
      mercure:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - spatial_uploads:/var/www/html/symfony/public/uploads/spatial:ro
      - symfony_assets:/var/www/html/symfony/public/assets:ro
    networks: [frontend]

  php:
    image: cos-symfony-php:local
    build:
      context: .
      dockerfile: docker/symfony/php/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      MESSENGER_CONSUMER_NAME: http
    command: ["sh", "-c", "rm -rf public/assets/* && php bin/console asset-map:compile && exec php-fpm"]
    volumes:
      - symfony_sessions:/var/www/html/symfony/var/sessions
      - symfony_assets:/var/www/html/symfony/public/assets
      - spatial_uploads:/var/www/html/public/uploads/spatial
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [frontend, backend]

  worker:
    image: cos-symfony-php:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["php","bin/console","messenger:consume","async","--keepalive=5","--time-limit=3600","--memory-limit=256M","--failure-limit=1"]
    environment:
      <<: *app-environment
      MESSENGER_CONSUMER_NAME: ${SYMFONY_MESSENGER_CONSUMER_NAME:-worker-1}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [backend]

  kernel-worker:
    image: cos-symfony-php:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["php","bin/console","cos:kernel:worker","--runtime-seconds=3600","--idle-milliseconds=250"]
    environment:
      <<: *app-environment
      MESSENGER_CONSUMER_NAME: kernel-worker-1
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [backend]

  spatial-worker:
    image: cos-symfony-php:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["sh","-c","while true; do php bin/console cos:spatial:process --limit=10; sleep 10; done"]
    environment:
      <<: *app-environment
      MESSENGER_CONSUMER_NAME: spatial-worker-1
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    volumes:
      - spatial_uploads:/var/www/html/public/uploads/spatial
    networks: [backend]

  integration-worker:
    image: cos-symfony-php:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["sh","-c","while true; do php bin/console cos:integration:n8n:process --schedule-content --limit=25; sleep 60; done"]
    environment:
      <<: *app-environment
      MESSENGER_CONSUMER_NAME: integration-worker-1
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [backend]

  telegram-worker:
    image: cos-symfony-php:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["sh","-c","while true; do php bin/console cos:telegram:process --schedule --limit=50; sleep 60; done"]
    environment:
      <<: *app-environment
      MESSENGER_CONSUMER_NAME: telegram-worker-1
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [backend]

  scheduler:
    image: cos-symfony-php:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["php","bin/console","messenger:consume","scheduler_cos","--time-limit=3600","--memory-limit=128M","--failure-limit=1"]
    environment:
      <<: *app-environment
      MESSENGER_CONSUMER_NAME: scheduler-1
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [backend]

  mercure:
    image: dunglas/mercure:v0.24.2
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-${SYMFONY_APP_SECRET}}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-${SYMFONY_APP_SECRET}}
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/mercure/health/ready"]
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [frontend, backend]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --log-bin-trust-function-creators=1
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

volumes:
  mysql_data:
  redis_data:
  symfony_sessions:
  symfony_assets:
  spatial_uploads:
  mercure_data:
  mercure_config:

networks:
  frontend:
  backend:
    internal: true
