name: cos

x-app-environment: &app-environment
  APP_ENV: prod
  APP_DEBUG: "0"
  APP_SECRET: ${SYMFONY_APP_SECRET}
  COS_ORGANIZATION_ID: ${COS_ORGANIZATION_ID:-default}
  COS_SALES_AUTOMATION_SCHEDULER_ENABLED: ${COS_SALES_AUTOMATION_SCHEDULER_ENABLED:-1}
  COS_AGENT_LLM_MODE: ${COS_AGENT_LLM_MODE:-http}
  DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?serverVersion=8.4.0&charset=utf8mb4"
  REDIS_URL: redis://redis:6379
  MESSENGER_TRANSPORT_DSN: redis://redis:6379/cos_async
  MESSENGER_FAILED_TRANSPORT_DSN: redis://redis:6379/cos_failed
  MESSENGER_ENGINEERING_TRANSPORT_DSN: redis://redis:6379/cos_engineering
  MESSENGER_ENGINEERING_IMMEDIATE_TRANSPORT_DSN: redis://redis:6379/cos_engineering_immediate
  LLM_ENDPOINT: ${LLM_ENDPOINT:-}
  LLM_TOKEN: ${LLM_TOKEN:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-http}
  COS_SECRET_MASTER_KEY: ${COS_SECRET_MASTER_KEY:-}
  COS_SECRET_MASTER_KEY_ID: ${COS_SECRET_MASTER_KEY_ID:-env-v1}
  COS_ENGINEERING_MANAGER_MODEL: ${COS_ENGINEERING_MANAGER_MODEL:-}
  COS_ENGINEERING_ARCHITECT_MODEL: ${COS_ENGINEERING_ARCHITECT_MODEL:-}
  COS_ENGINEERING_DEVELOPER_MODEL: ${COS_ENGINEERING_DEVELOPER_MODEL:-}
  COS_ENGINEERING_REVIEWER_MODEL: ${COS_ENGINEERING_REVIEWER_MODEL:-}
  COS_ENGINEERING_QA_MODEL: ${COS_ENGINEERING_QA_MODEL:-}
  WAVE6_CRM_WEBHOOK_SECRET: ${WAVE6_CRM_WEBHOOK_SECRET:-}
  SPATIAL_MAX_UPLOAD_BYTES: ${SPATIAL_MAX_UPLOAD_BYTES:-209715200}
  SPATIAL_JWT_SECRET: ${SPATIAL_JWT_SECRET}
  SPATIAL_JWT_TTL: ${SPATIAL_JWT_TTL:-28800}
  SPATIAL_BLENDER_BINARY: ${SPATIAL_BLENDER_BINARY:-}
  SPATIAL_GLTF_TRANSFORM_BINARY: ${SPATIAL_GLTF_TRANSFORM_BINARY:-}
  COS_CM_POOL_SUBSCRIPTIONS_SCHEDULER_ENABLED: ${COS_CM_POOL_SUBSCRIPTIONS_SCHEDULER_ENABLED:-0}
  COS_CM_POOL_SUBSCRIPTIONS_ACTOR_ID: ${COS_CM_POOL_SUBSCRIPTIONS_ACTOR_ID:-0}
  COS_CM_POOL_SUBSCRIPTIONS_INTERVAL_MINUTES: ${COS_CM_POOL_SUBSCRIPTIONS_INTERVAL_MINUTES:-15}
  COS_CM_BSTOCKS_OPPORTUNITY_ENABLED: ${COS_CM_BSTOCKS_OPPORTUNITY_ENABLED:-0}
  COS_CM_POOL_PRODUCTION_ARMED: ${COS_CM_POOL_PRODUCTION_ARMED:-0}
  COS_CM_INSTRUMENT_TRUST_SWEEPER_ENABLED: ${COS_CM_INSTRUMENT_TRUST_SWEEPER_ENABLED:-0}
  COS_CM_STREAM_OPS_MONITOR_ENABLED: ${COS_CM_STREAM_OPS_MONITOR_ENABLED:-0}
  COS_CM_L2_FENCED_ENABLED: ${COS_CM_L2_FENCED_ENABLED:-0}
  COS_CM_DERIVATIVES_LIFECYCLE_ENABLED: ${COS_CM_DERIVATIVES_LIFECYCLE_ENABLED:-0}
  COS_CM_STREAMING_BYBIT_DERIVATIVES_ENABLED: ${COS_CM_STREAMING_BYBIT_DERIVATIVES_ENABLED:-0}
  COS_CM_STREAM_FAILOVER_DRILL_ARMED: ${COS_CM_STREAM_FAILOVER_DRILL_ARMED:-0}
  COS_CM_STREAMING_MULTI_FLEET_ENABLED: ${COS_CM_STREAMING_MULTI_FLEET_ENABLED:-0}
  COS_CM_STREAMING_BINANCE_SPOT_BATCH_PILOT: ${COS_CM_STREAMING_BINANCE_SPOT_BATCH_PILOT:-0}
  COS_CM_STREAMING_MASSIVE_STOCKS_PILOT: ${COS_CM_STREAMING_MASSIVE_STOCKS_PILOT:-0}
  N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
  N8N_OUTBOUND_URL: ${N8N_OUTBOUND_URL:-}
  N8N_OUTBOUND_SECRET: ${N8N_OUTBOUND_SECRET:-}
  FOS_L2_ENABLED: ${FOS_L2_ENABLED:-0}
  FOS_L2_ALERT_ENABLED: ${FOS_L2_ALERT_ENABLED:-0}
  FOS_L2_ALERT_EMAIL: ${FOS_L2_ALERT_EMAIL:-}
  FOS_L2_ALERT_LOCALE: ${FOS_L2_ALERT_LOCALE:-uk}
  GROWTH_ENGAGEMENT_WEBHOOK_SECRET: ${GROWTH_ENGAGEMENT_WEBHOOK_SECRET:-}
  GROWTH_ENGAGEMENT_WEBHOOK_MAX_CLOCK_SKEW: ${GROWTH_ENGAGEMENT_WEBHOOK_MAX_CLOCK_SKEW:-300}
  GROWTH_ENGAGEMENT_RESPONSE_WEBHOOK_SECRET: ${GROWTH_ENGAGEMENT_RESPONSE_WEBHOOK_SECRET:-}
  GROWTH_ENGAGEMENT_RESPONSE_WEBHOOK_MAX_CLOCK_SKEW: ${GROWTH_ENGAGEMENT_RESPONSE_WEBHOOK_MAX_CLOCK_SKEW:-300}
  COS_GROWTH_OUTREACH_DAILY_LIMIT: ${COS_GROWTH_OUTREACH_DAILY_LIMIT:-50}
  COS_GROWTH_OUTREACH_EMAIL_DAILY_LIMIT: ${COS_GROWTH_OUTREACH_EMAIL_DAILY_LIMIT:-50}
  COS_GROWTH_OUTREACH_LINKEDIN_DAILY_LIMIT: ${COS_GROWTH_OUTREACH_LINKEDIN_DAILY_LIMIT:-50}
  COS_GROWTH_OUTREACH_PHONE_DAILY_LIMIT: ${COS_GROWTH_OUTREACH_PHONE_DAILY_LIMIT:-50}
  COS_GROWTH_OUTREACH_CONTACT_COOLDOWN_HOURS: ${COS_GROWTH_OUTREACH_CONTACT_COOLDOWN_HOURS:-24}
  COS_GROWTH_AUTONOMY_SCHEDULER_ENABLED: ${COS_GROWTH_AUTONOMY_SCHEDULER_ENABLED:-0}
  COS_GROWTH_AUTONOMY_SCHEDULER_INTERVAL_MINUTES: ${COS_GROWTH_AUTONOMY_SCHEDULER_INTERVAL_MINUTES:-5}
  COS_GROWTH_AUTONOMY_SCHEDULER_ACTOR_ID: ${COS_GROWTH_AUTONOMY_SCHEDULER_ACTOR_ID:-0}
  COS_GROWTH_AUTONOMY_SCHEDULER_ORGANIZATION_LIMIT: ${COS_GROWTH_AUTONOMY_SCHEDULER_ORGANIZATION_LIMIT:-500}
  COS_GROWTH_AUTONOMY_SCHEDULER_RECOMMENDATION_LIMIT: ${COS_GROWTH_AUTONOMY_SCHEDULER_RECOMMENDATION_LIMIT:-100}
  COS_GROWTH_CONTENT_SCHEDULER_ENABLED: ${COS_GROWTH_CONTENT_SCHEDULER_ENABLED:-0}
  COS_GROWTH_CONTENT_SCHEDULER_INTERVAL_MINUTES: ${COS_GROWTH_CONTENT_SCHEDULER_INTERVAL_MINUTES:-5}
  COS_GROWTH_CONTENT_SCHEDULER_ACTOR_ID: ${COS_GROWTH_CONTENT_SCHEDULER_ACTOR_ID:-0}
  COS_GROWTH_CONTENT_SCHEDULER_ORGANIZATION_LIMIT: ${COS_GROWTH_CONTENT_SCHEDULER_ORGANIZATION_LIMIT:-500}
  COS_GROWTH_CONTENT_SCHEDULER_DRAFT_LIMIT: ${COS_GROWTH_CONTENT_SCHEDULER_DRAFT_LIMIT:-20}
  COS_GROWTH_SEQUENCE_SCHEDULER_ENABLED: ${COS_GROWTH_SEQUENCE_SCHEDULER_ENABLED:-0}
  COS_GROWTH_SEQUENCE_SCHEDULER_INTERVAL_MINUTES: ${COS_GROWTH_SEQUENCE_SCHEDULER_INTERVAL_MINUTES:-15}
  COS_GROWTH_SEQUENCE_SCHEDULER_ACTOR_ID: ${COS_GROWTH_SEQUENCE_SCHEDULER_ACTOR_ID:-0}
  COS_GROWTH_SEQUENCE_SCHEDULER_ORGANIZATION_LIMIT: ${COS_GROWTH_SEQUENCE_SCHEDULER_ORGANIZATION_LIMIT:-500}
  COS_GROWTH_MARKET_SCHEDULER_ENABLED: ${COS_GROWTH_MARKET_SCHEDULER_ENABLED:-0}
  COS_GROWTH_MARKET_SCHEDULER_INTERVAL_MINUTES: ${COS_GROWTH_MARKET_SCHEDULER_INTERVAL_MINUTES:-60}
  COS_GROWTH_MARKET_SCHEDULER_ACTOR_ID: ${COS_GROWTH_MARKET_SCHEDULER_ACTOR_ID:-0}
  COS_GROWTH_MARKET_SCHEDULER_UNIVERSE_LIMIT: ${COS_GROWTH_MARKET_SCHEDULER_UNIVERSE_LIMIT:-200}
  COS_GROWTH_MARKET_SCHEDULER_ACCOUNT_LIMIT: ${COS_GROWTH_MARKET_SCHEDULER_ACCOUNT_LIMIT:-100}
  COS_CM_INSTRUMENT_POOL_AUTO_PROPOSE_ENABLED: ${COS_CM_INSTRUMENT_POOL_AUTO_PROPOSE_ENABLED:-0}
  COS_CM_INSTRUMENT_POOL_SCHEDULER_ENABLED: ${COS_CM_INSTRUMENT_POOL_SCHEDULER_ENABLED:-0}
  COS_CM_INSTRUMENT_POOL_SCHEDULER_INTERVAL_MINUTES: ${COS_CM_INSTRUMENT_POOL_SCHEDULER_INTERVAL_MINUTES:-15}
  COS_CM_INSTRUMENT_POOL_SCHEDULER_TARGETS_JSON: "${COS_CM_INSTRUMENT_POOL_SCHEDULER_TARGETS_JSON:-[]}"
  COS_CM_INSTRUMENT_POOL_SCHEDULER_ACTOR_ID: ${COS_CM_INSTRUMENT_POOL_SCHEDULER_ACTOR_ID:-0}
  COS_ENGINEERING_AUTONOMY_SCHEDULER_ENABLED: ${COS_ENGINEERING_AUTONOMY_SCHEDULER_ENABLED:-0}
  COS_ENGINEERING_AUTONOMY_SCHEDULER_INTERVAL_MINUTES: ${COS_ENGINEERING_AUTONOMY_SCHEDULER_INTERVAL_MINUTES:-2}
  COS_ENGINEERING_DOMAIN_AUTONOMY_SCHEDULER_ENABLED: ${COS_ENGINEERING_DOMAIN_AUTONOMY_SCHEDULER_ENABLED:-0}
  COS_ENGINEERING_DOMAIN_AUTONOMY_SCHEDULER_INTERVAL_MINUTES: ${COS_ENGINEERING_DOMAIN_AUTONOMY_SCHEDULER_INTERVAL_MINUTES:-3}
  COS_ENGINEERING_RUNTIME_WATCHDOG_ENABLED: ${COS_ENGINEERING_RUNTIME_WATCHDOG_ENABLED:-1}
  COS_ENGINEERING_RUNTIME_WATCHDOG_INTERVAL_MINUTES: ${COS_ENGINEERING_RUNTIME_WATCHDOG_INTERVAL_MINUTES:-2}
  COS_ENGINEERING_RUNTIME_STALE_SECONDS: ${COS_ENGINEERING_RUNTIME_STALE_SECONDS:-600}
  COS_ENGINEERING_RUNTIME_STALLED_SECONDS: ${COS_ENGINEERING_RUNTIME_STALLED_SECONDS:-1800}
  COS_LLM_PRICING_JSON: ${COS_LLM_PRICING_JSON:-}
  APP_URL: ${APP_URL:-http://127.0.0.1:8081}
  MERCURE_URL: http://mercure/.well-known/mercure
  MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-${APP_URL:-http://127.0.0.1:8081}/.well-known/mercure}
  MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-${SYMFONY_APP_SECRET}}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-}

services:
  nginx:
    image: ${COS_NGINX_IMAGE:-cos-nginx:latest}
    build:
      context: .
      dockerfile: docker/symfony/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
      mercure:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - spatial_uploads:/var/www/html/symfony/public/uploads/spatial:ro
      - symfony_assets:/var/www/html/symfony/public/assets:ro
    networks: [frontend]

  php:
    image: ${COS_PHP_IMAGE:-cos-symfony-php:local}
    build:
      context: .
      dockerfile: docker/symfony/php/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      MESSENGER_CONSUMER_NAME: http
      # Personal admin-only OpenCode bridge is injected only into the HTTP PHP process.
      # Worker/cron/agent containers do not receive the OpenCode password.
      COS_OPENCODE_ENABLED: ${COS_OPENCODE_ENABLED:-0}
      COS_OPENCODE_ENDPOINT: ${COS_OPENCODE_ENDPOINT:-http://127.0.0.1:4096}
      COS_OPENCODE_ALLOWED_HOST: ${COS_OPENCODE_ALLOWED_HOST:-127.0.0.1}
      COS_OPENCODE_SERVER_USERNAME: ${COS_OPENCODE_SERVER_USERNAME:-opencode}
      COS_OPENCODE_SERVER_PASSWORD: ${COS_OPENCODE_SERVER_PASSWORD:-}
      COS_OPENCODE_ALLOWED_ORGANIZATION_ID: ${COS_OPENCODE_ALLOWED_ORGANIZATION_ID:-}
      COS_OPENCODE_ALLOWED_ACTOR_ID: ${COS_OPENCODE_ALLOWED_ACTOR_ID:-}
      COS_ENGINEERING_GITHUB_REPOSITORY: ${COS_ENGINEERING_GITHUB_REPOSITORY:-}
      COS_ENGINEERING_GITHUB_TOKEN: ${COS_ENGINEERING_GITHUB_TOKEN:-}
      COS_ENGINEERING_GITHUB_BASE_BRANCH: ${COS_ENGINEERING_GITHUB_BASE_BRANCH:-main}
    command: ["sh", "-c", "rm -rf public/assets/* && php bin/console asset-map:compile && exec php-fpm"]
    volumes:
      - symfony_sessions:/var/www/html/symfony/var/sessions
      - experience_qa_evidence:/var/www/html/symfony/var/experience/qa
      - symfony_assets:/var/www/html/symfony/public/assets
      - spatial_uploads:/var/www/html/public/uploads/spatial
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [frontend, backend]

  worker:
    image: ${COS_PHP_IMAGE:-cos-symfony-php:local}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["php","bin/console","messenger:consume","async","--keepalive=5","--time-limit=3600","--memory-limit=256M","--failure-limit=1"]
    environment:
      <<: *app-environment
      MESSENGER_CONSUMER_NAME: ${SYMFONY_MESSENGER_CONSUMER_NAME:-worker-1}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [backend]

  engineering-worker:
    image: ${COS_PHP_IMAGE:-cos-symfony-php:local}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["php","bin/console","messenger:consume","engineering","--keepalive=5","--time-limit=3600","--memory-limit=512M","--failure-limit=1"]
    environment:
      <<: *app-environment
      MESSENGER_CONSUMER_NAME: engineering-worker-1
      COS_ENGINEERING_GITHUB_REPOSITORY: ${COS_ENGINEERING_GITHUB_REPOSITORY:-}
      COS_ENGINEERING_GITHUB_TOKEN: ${COS_ENGINEERING_GITHUB_TOKEN:-}
      COS_ENGINEERING_GITHUB_BASE_BRANCH: ${COS_ENGINEERING_GITHUB_BASE_BRANCH:-main}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [frontend, backend]

  engineering-immediate-worker:
    image: ${COS_PHP_IMAGE:-cos-symfony-php:local}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["php","bin/console","messenger:consume","engineering_immediate","--keepalive=5","--time-limit=3600","--memory-limit=512M","--failure-limit=1"]
    environment:
      <<: *app-environment
      MESSENGER_CONSUMER_NAME: engineering-immediate-worker-1
      COS_ENGINEERING_GITHUB_REPOSITORY: ${COS_ENGINEERING_GITHUB_REPOSITORY:-}
      COS_ENGINEERING_GITHUB_TOKEN: ${COS_ENGINEERING_GITHUB_TOKEN:-}
      COS_ENGINEERING_GITHUB_BASE_BRANCH: ${COS_ENGINEERING_GITHUB_BASE_BRANCH:-main}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [frontend, backend]

  kernel-worker:
    image: ${COS_PHP_IMAGE:-cos-symfony-php:local}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["php","bin/console","cos:kernel:worker","--runtime-seconds=3600","--idle-milliseconds=250"]
    environment:
      <<: *app-environment
      MESSENGER_CONSUMER_NAME: kernel-worker-1
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [backend]

  # OFF by default. Explicit profile only; never enables market streaming.
  cm-stream-sweeper:
    profiles: [cm-stream-sweeper]
    image: ${COS_PHP_IMAGE:-cos-symfony-php:local}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["sh", "-ec", "while true; do php bin/console cos:capital-markets:market-data:stream:sweep-expired --limit=100; sleep 60; done"]
    environment:
      <<: *app-environment
      COS_CM_STREAM_SWEEPER_ENABLED: "1"
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [backend]

  # OFF by default. Separate 5-minute tenant-scoped rollback watchdog.
  # Does not create feeds, grant credentials, or enable live trading.
  cm-pool-watchdog:
    profiles: [cm-pool-watchdog]
    image: ${COS_PHP_IMAGE:-cos-symfony-php:local}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: 192m
    cpus: "0.25"
    command:
      - sh
      - -ec
      - |
        test -n "$COS_CM_POOL_WATCHDOG_ORGANIZATION"
        case "$COS_CM_POOL_WATCHDOG_ACTOR_ID" in
          ''|0|*[!0-9]*) echo "Invalid watchdog actor"; exit 1 ;;
        esac
        while true; do
          php bin/console cos:capital-markets:pool:production watchdog \
            --organization="$COS_CM_POOL_WATCHDOG_ORGANIZATION" \
            --actor="$COS_CM_POOL_WATCHDOG_ACTOR_ID"
          sleep 300
        done
    environment:
      <<: *app-environment
      COS_CM_POOL_WATCHDOG_ORGANIZATION: ${COS_CM_POOL_WATCHDOG_ORGANIZATION:-}
      COS_CM_POOL_WATCHDOG_ACTOR_ID: ${COS_CM_POOL_WATCHDOG_ACTOR_ID:-0}
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [backend]

  # OFF by default; one tenant + one source per bounded sweeper.
  # OFF by default: explicit per-tenant, pre-approved source fleet only.
  cm-stream-fleet:
    profiles: [cm-stream-fleet]
    image: ${COS_PHP_IMAGE:-cos-symfony-php:local}
    restart: on-failure:3
    init: true
    stop_grace_period: 45s
    mem_limit: 2048m
    cpus: "2.0"
    command:
      - sh
      - -ec
      - |
        test -n "$COS_CM_FLEET_ORGANIZATION"
        test -n "$COS_CM_FLEET_SOURCES"
        case "$COS_CM_FLEET_ACTOR" in
          ''|0|*[!0-9]*) echo "Invalid fleet operator"; exit 1 ;;
        esac
        php bin/console cos:capital-markets:market-data:stream:multi-fleet \
          "$COS_CM_FLEET_ORGANIZATION" "$COS_CM_FLEET_ACTOR" \
          --sources="$COS_CM_FLEET_SOURCES" --max-workers=16 \
          --seconds=0 --execute
    environment:
      <<: *app-environment
      COS_CM_STREAMING_MULTI_FLEET_ENABLED: "1"
      COS_CM_FLEET_ORGANIZATION: ${COS_CM_FLEET_ORGANIZATION:-}
      COS_CM_FLEET_ACTOR: ${COS_CM_FLEET_ACTOR:-0}
      COS_CM_FLEET_SOURCES: ${COS_CM_FLEET_SOURCES:-}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [backend]

  cm-instrument-trust-sweeper:
    profiles: [cm-instrument-trust-sweeper]
    image: ${COS_PHP_IMAGE:-cos-symfony-php:local}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: 192m
    cpus: "0.25"
    command:
      - sh
      - -ec
      - |
        test -n "$COS_CM_TRUST_SWEEP_ORGANIZATION"
        test -n "$COS_CM_TRUST_SWEEP_SOURCE"
        case "$COS_CM_TRUST_SWEEP_ACTOR" in
          ''|0|*[!0-9]*) echo "Invalid symbol trust operator"; exit 1 ;;
        esac
        while true; do
          php bin/console cos:capital-markets:market-data:stream:instrument-trust sweep \
            "$COS_CM_TRUST_SWEEP_ORGANIZATION" "$COS_CM_TRUST_SWEEP_ACTOR" \
            --source="$COS_CM_TRUST_SWEEP_SOURCE" --stale-seconds=120 --limit=500
          sleep 60
        done
    environment:
      <<: *app-environment
      COS_CM_INSTRUMENT_TRUST_SWEEPER_ENABLED: "1"
      COS_CM_TRUST_SWEEP_ORGANIZATION: ${COS_CM_TRUST_SWEEP_ORGANIZATION:-}
      COS_CM_TRUST_SWEEP_SOURCE: ${COS_CM_TRUST_SWEEP_SOURCE:-}
      COS_CM_TRUST_SWEEP_ACTOR: ${COS_CM_TRUST_SWEEP_ACTOR:-0}
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [backend]

  # Explicit opt-in: 60-second tenant/source incident supervision.
  # Uses only Platform Notification -> durable outbox. No raw provider data in alerts.
  cm-stream-ops-monitor:
    profiles: [cm-stream-ops-monitor]
    image: ${COS_PHP_IMAGE:-cos-symfony-php:local}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: 192m
    cpus: "0.25"
    command:
      - sh
      - -ec
      - |
        test -n "$COS_CM_STREAM_OPS_ORGANIZATION"
        test -n "$COS_CM_STREAM_OPS_SOURCE"
        test -n "$COS_CM_STREAM_OPS_ALERT_EMAIL"
        case "$COS_CM_STREAM_OPS_ACTOR" in
          ''|0|*[!0-9]*) echo "Invalid operations actor"; exit 1 ;;
        esac
        while true; do
          php bin/console cos:capital-markets:market-data:stream:incidents scan \
            "$COS_CM_STREAM_OPS_ORGANIZATION" "$COS_CM_STREAM_OPS_ACTOR" \
            --source="$COS_CM_STREAM_OPS_SOURCE" \
            --alert-email="$COS_CM_STREAM_OPS_ALERT_EMAIL"
          sleep 60
        done
    environment:
      <<: *app-environment
      COS_CM_STREAM_OPS_MONITOR_ENABLED: "1"
      COS_CM_STREAM_OPS_ORGANIZATION: ${COS_CM_STREAM_OPS_ORGANIZATION:-}
      COS_CM_STREAM_OPS_SOURCE: ${COS_CM_STREAM_OPS_SOURCE:-}
      COS_CM_STREAM_OPS_ACTOR: ${COS_CM_STREAM_OPS_ACTOR:-0}
      COS_CM_STREAM_OPS_ALERT_EMAIL: ${COS_CM_STREAM_OPS_ALERT_EMAIL:-}
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [backend]

  # P1 Bybit contract status is checked by authoritative REST; no trades.
  cm-derivatives-lifecycle:
    profiles: [cm-derivatives-lifecycle]
    image: ${COS_PHP_IMAGE:-cos-symfony-php:local}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 192m
    cpus: "0.25"
    command:
      - sh
      - -ec
      - |
        test -n "$COS_CM_DERIVATIVES_ORG"
        test -n "$COS_CM_DERIVATIVES_SOURCE"
        case "$COS_CM_DERIVATIVES_ACTOR" in
          ''|0|*[!0-9]*) echo "Invalid derivatives operator"; exit 1 ;;
        esac
        while true; do
          php bin/console cos:capital-markets:market-data:derivatives:lifecycle \
            poll "$COS_CM_DERIVATIVES_ORG" "$COS_CM_DERIVATIVES_SOURCE" \
            "$COS_CM_DERIVATIVES_ACTOR"
          php bin/console cos:capital-markets:market-data:derivatives:lifecycle \
            sweep "$COS_CM_DERIVATIVES_ORG" "$COS_CM_DERIVATIVES_SOURCE" \
            "$COS_CM_DERIVATIVES_ACTOR" --stale-seconds=120
          sleep 60
        done
    environment:
      <<: *app-environment
      COS_CM_DERIVATIVES_LIFECYCLE_ENABLED: "1"
      COS_CM_DERIVATIVES_ORG: ${COS_CM_DERIVATIVES_ORG:-}
      COS_CM_DERIVATIVES_SOURCE: ${COS_CM_DERIVATIVES_SOURCE:-}
      COS_CM_DERIVATIVES_ACTOR: ${COS_CM_DERIVATIVES_ACTOR:-0}
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [frontend, backend]

  # Opt-in one-source / one-contract WS worker; source lease rejects duplicates.
  cm-derivatives-stream:
    profiles: [cm-derivatives-stream]
    image: ${COS_PHP_IMAGE:-cos-symfony-php:local}
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: 256m
    cpus: "0.5"
    command:
      - sh
      - -ec
      - |
        test -n "$COS_CM_DERIVATIVES_ORG"
        test -n "$COS_CM_DERIVATIVES_SOURCE"
        exec php bin/console cos:capital-markets:market-data:stream:bybit-derivatives \
          "$COS_CM_DERIVATIVES_ORG" "$COS_CM_DERIVATIVES_SOURCE" --seconds=0
    environment:
      <<: *app-environment
      COS_CM_STREAMING_BYBIT_DERIVATIVES_ENABLED: "1"
      COS_CM_DERIVATIVES_ORG: ${COS_CM_DERIVATIVES_ORG:-}
      COS_CM_DERIVATIVES_SOURCE: ${COS_CM_DERIVATIVES_SOURCE:-}
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [frontend, backend]

  spatial-worker:
    image: ${COS_PHP_IMAGE:-cos-symfony-php:local}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["sh","-c","while true; do php bin/console cos:spatial:process --limit=10; sleep 10; done"]
    environment:
      <<: *app-environment
      MESSENGER_CONSUMER_NAME: spatial-worker-1
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    volumes:
      - spatial_uploads:/var/www/html/public/uploads/spatial
    networks: [backend]

  # Public market-data ingress; opt-in. The application image owns Symfony CLI;
  # Compose provides process restart, stop signalling and internet egress.
  # Run: docker compose --profile l2 up -d l2-stream
  l2-stream:
    image: ${COS_PHP_IMAGE:-cos-symfony-php:local}
    build:
      context: .
      dockerfile: docker/symfony/php/Dockerfile
    profiles: ["l2"]
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    command:
      - php
      - bin/console
      - cos:capital-markets:l2:stream
      - "--organization=${FOS_L2_ORGANIZATION:-}"
      - "--source=${FOS_L2_SOURCE_ID:-}"
      - "--venue=${FOS_L2_VENUE:-}"
      - "--symbol=${FOS_L2_SYMBOL:-}"
      - "--base=${FOS_L2_BASE:-}"
      - "--quote=${FOS_L2_QUOTE:-}"
      - "--depth=${FOS_L2_DEPTH:-50}"
      - "--message-budget=${FOS_L2_MESSAGE_BUDGET:-1000000}"
      - "--max-attempts=${FOS_L2_MAX_ATTEMPTS:-20}"
      - "--stale-seconds=${FOS_L2_STALE_SECONDS:-30}"
    environment:
      <<: *app-environment
      MESSENGER_CONSUMER_NAME: l2-stream-1
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    # backend is internal-only; frontend is essential for outgoing public WSS/HTTPS.
    networks: [frontend, backend]

  integration-worker:
    image: ${COS_PHP_IMAGE:-cos-symfony-php:local}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["sh","-c","while true; do php bin/console cos:integration:n8n:process --schedule-content --limit=25; sleep 60; done"]
    environment:
      <<: *app-environment
      MESSENGER_CONSUMER_NAME: integration-worker-1
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [backend]

  telegram-worker:
    image: ${COS_PHP_IMAGE:-cos-symfony-php:local}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["sh","-c","while true; do php bin/console cos:telegram:process --schedule --limit=50; sleep 60; done"]
    environment:
      <<: *app-environment
      MESSENGER_CONSUMER_NAME: telegram-worker-1
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [backend]

  scheduler:
    image: ${COS_PHP_IMAGE:-cos-symfony-php:local}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["php","bin/console","messenger:consume","scheduler_cos","--time-limit=3600","--memory-limit=128M","--failure-limit=1"]
    environment:
      <<: *app-environment
      MESSENGER_CONSUMER_NAME: scheduler-1
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [backend]

  mercure:
    image: dunglas/mercure:v0.24.2
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-${SYMFONY_APP_SECRET}}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-${SYMFONY_APP_SECRET}}
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/mercure/health/ready"]
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [frontend, backend]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --log-bin-trust-function-creators=1
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

volumes:
  mysql_data:
  redis_data:
  symfony_sessions:
  experience_qa_evidence:
  symfony_assets:
  spatial_uploads:
  mercure_data:
  mercure_config:

networks:
  frontend:
  backend:
    internal: true
