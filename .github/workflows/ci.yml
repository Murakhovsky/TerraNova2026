name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'symfony/src/**'
      - 'symfony/config/**'
      - 'resources/experience/**'
      - 'tests/**'
      - 'bin/verify'
      - 'bin/ci/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: phpstan:2.2.16
      - name: Install Symfony dependencies
        working-directory: symfony
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHPStan Engineering
        run: phpstan analyse --no-progress --memory-limit=1G --level=0 --autoload-file=symfony/vendor/autoload.php symfony/src/Engineering

  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          find app symfony/src tests/architecture tests/unit -type f -name '*.php' ! -path 'tests/history/*' -print0 | xargs -0 -n1 php -l
      - name: Validate CI timing implementation
        run: python3 -m py_compile bin/ci/step_timings.py
      - name: Current contracts and unit behavior
        run: bash bin/verify fast
      - name: Kernel Tool canonical retry contract
        run: php tests/unit/workflow_kernel_tool_safe_retry.php
      - name: Capital Markets streaming core, reconnect and Binance protocol acceptance
        run: |
          php tests/unit/capital_markets_streaming_recovery_gate.php
          php tests/unit/capital_markets_streaming_supervision.php
          php tests/unit/capital_markets_streaming_session_coordinator.php
          php tests/unit/capital_markets_streaming_reconnect_runner.php
          php tests/unit/capital_markets_binance_spot_bbo_protocol.php
          php tests/unit/capital_markets_binance_spot_multi_bbo_protocol.php
          php tests/unit/capital_markets_bstocks_opportunity_evidence_gate.php
          php tests/architecture/capital_markets_bstocks_scheduler_opportunity_contract.php
          php tests/unit/capital_markets_instrument_pool_catalog_audit.php
          php tests/unit/capital_markets_instrument_pool_lifecycle_review.php
          php tests/unit/capital_markets_per_instrument_stream_trust.php
          php tests/unit/capital_markets_multi_symbol_300_planner.php
          php tests/architecture/capital_markets_multisymbol_per_instrument_contract.php
          php tests/unit/capital_markets_provider_expansion_replay_scaling.php
          php tests/architecture/capital_markets_provider_replay_scaling_contract.php
          php tests/unit/capital_markets_bybit_derivative_ws.php
          php tests/architecture/capital_markets_l2_derivatives_p1_contract.php
          php tests/unit/capital_markets_stream_provider_ops_alerts.php
          php tests/architecture/capital_markets_live_provider_ops_contract.php
          php tests/unit/capital_markets_pool_production_soak.php
          php tests/unit/capital_markets_pool_issuer_e4.php
          php tests/architecture/capital_markets_pool_production_contract.php
          php tests/architecture/capital_markets_integrated_authority_contract.php
          php tests/architecture/locale_static_module_execution_contract.php
          php tests/unit/engineering_domain_context_compression.php
