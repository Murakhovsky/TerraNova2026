name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'symfony/src/**'
      - 'symfony/config/**'
      - 'resources/experience/**'
      - 'tests/**'
      - 'bin/verify'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: phpstan:2.2.16
      - name: Install Symfony dependencies
        working-directory: symfony
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHPStan Engineering
        run: phpstan analyse --no-progress --memory-limit=1G --level=0 --autoload-file=symfony/vendor/autoload.php symfony/src/Engineering

  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          find app symfony/src tests/architecture tests/unit -type f -name '*.php' ! -path 'tests/history/*' -print0 | xargs -0 -n1 php -l
      - name: Current contracts and unit behavior
        run: bash bin/verify fast
      - name: Capital Markets streaming core, reconnect and Binance protocol acceptance
        run: |
          php tests/unit/capital_markets_streaming_recovery_gate.php
          php tests/unit/capital_markets_streaming_supervision.php
          php tests/unit/capital_markets_streaming_session_coordinator.php
          php tests/unit/capital_markets_streaming_reconnect_runner.php
          php tests/unit/capital_markets_binance_spot_bbo_protocol.php
          php tests/unit/capital_markets_bybit_spot_bbo_protocol.php
          php tests/unit/capital_markets_bybit_linear_bbo_protocol.php
          php tests/unit/capital_markets_kraken_spot_ticker_protocol.php
          php tests/unit/capital_markets_massive_stocks_ws_protocol.php
          php tests/unit/capital_markets_binance_usdm_bbo_protocol.php
          php tests/architecture/capital_markets_stream_runner_contract.php
          php tests/architecture/capital_markets_binance_spot_streaming_contract.php
          php tests/architecture/capital_markets_streaming_core_contract.php
          php tests/architecture/capital_markets_stream_expired_sweeper_contract.php
          php tests/architecture/capital_markets_stream_all_provider_sweeper_contract.php
          php tests/architecture/capital_markets_stream_sweeper_profile_contract.php
          php tests/architecture/capital_markets_rest_stream_writer_gate_contract.php
          php tests/unit/capital_markets_market_intelligence_polling.php
          php tests/architecture/capital_markets_bybit_spot_streaming_contract.php
          php tests/architecture/capital_markets_bybit_linear_streaming_contract.php
          php tests/architecture/capital_markets_kraken_streaming_contract.php
          php tests/architecture/capital_markets_massive_stocks_ws_contract.php
          php tests/architecture/capital_markets_binance_usdm_streaming_contract.php
