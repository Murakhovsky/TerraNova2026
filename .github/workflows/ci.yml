name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'symfony/src/**'
      - 'symfony/config/**'
      - 'resources/experience/**'
      - 'tests/**'
      - 'bin/verify'
      - 'bin/ci/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: phpstan:2.2.16
      - name: Install Symfony dependencies
        working-directory: symfony
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHPStan Engineering
        run: phpstan analyse --no-progress --memory-limit=1G --level=0 --autoload-file=symfony/vendor/autoload.php symfony/src/Engineering

  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          find app symfony/src tests/architecture tests/unit -type f -name '*.php' ! -path 'tests/history/*' -print0 | xargs -0 -n1 php -l
      - name: Validate CI timing implementation
        run: python3 -m py_compile bin/ci/step_timings.py
      - name: Current contracts and unit behavior
        run: bash bin/verify fast
      - name: Canonical Capability Library contract
        run: php tests/architecture/cos_canonical_capability_library_contract.php
      - name: Capability contract pinning, schema output and drift regression
        run: php tests/unit/cos_capability_contract_snapshot.php
      - name: Goal Plan capability pinning and replay safety
        run: php tests/unit/cos_goal_capability_pinning.php
      - name: Goal Capability immutable execution authority
        run: php tests/architecture/cos_goal_capability_pin_authority.php
      - name: Golden 50 governed Action output contracts
        run: php tests/unit/cos_golden50_governed_action_output.php
      - name: Capability receipt and Goal preflight safety contracts
        run: php tests/architecture/cos_capability_receipt_preflight_contract.php
      - name: Capability Library operator interface and read-only contract API
        run: php tests/architecture/cos_capability_catalog_experience.php
      - name: Capability history must remain read-only to Goal execution
        run: php tests/architecture/cos_capability_version_archive_no_execution.php
      - name: Immutable Capability contract release archive regression
        run: php tests/unit/cos_capability_immutable_archive.php
      - name: Validate release freeze report without writing to the checkout
        run: php bin/cos-capability-release-freeze.php > /tmp/cos-capability-release-freeze.json
      - name: Build and verify candidate frozen Capability snapshots (CI checkout only)
        run: |
          php bin/cos-capability-release-freeze.php --write > /tmp/cos-capability-freeze-review.json
          php bin/cos-capability-release-freeze.php --check > /tmp/cos-capability-freeze-verified.json
      - name: Publish UNRELEASED Capability snapshot candidates for code review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cos-capability-unreleased-frozen-candidates
          path: |
            resources/contracts/history
            /tmp/cos-capability-freeze-review.json
            /tmp/cos-capability-freeze-verified.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Complete Capability Library definition coverage and binding collisions
        run: php tests/unit/cos_capability_full_domain_coverage.php
      - name: Capability manifest/schema census and fully classified legacy inventory
        run: php bin/cos-capability-census.php --strict --require-classified > /tmp/cos-capability-census.json
      - name: Export canonical Capability coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cos-capability-definition-coverage
          path: /tmp/cos-capability-census.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Canonical Property capability input validation
        run: php tests/unit/canonical_capability_property_input_validation.php
      - name: Canonical Capability Gateway invocation boundaries
        run: php tests/unit/canonical_capability_gateway.php
      - name: Property Bulk Intake approval and execution contract
        run: php tests/architecture/property_bulk_intake_workflow_contract.php
      - name: Property Bulk CSV import validation
        run: php tests/unit/property_bulk_csv_reader.php
      - name: Property Bulk Intake fail-closed normalization
        run: php tests/unit/property_bulk_intake_normalization.php
      - name: AI and CRON intent signature and review admission
        run: php tests/unit/cos_automation_intent_security.php
      - name: Kernel Tool canonical retry contract
        run: php tests/unit/workflow_kernel_tool_safe_retry.php
      - name: Capital Markets streaming core, reconnect and Binance protocol acceptance
        run: |
          php tests/unit/capital_markets_streaming_recovery_gate.php
          php tests/unit/capital_markets_streaming_supervision.php
          php tests/unit/capital_markets_streaming_session_coordinator.php
          php tests/unit/capital_markets_streaming_reconnect_runner.php
          php tests/unit/capital_markets_binance_spot_bbo_protocol.php
          php tests/unit/capital_markets_binance_spot_multi_bbo_protocol.php
          php tests/unit/capital_markets_bstocks_opportunity_evidence_gate.php
          php tests/architecture/capital_markets_bstocks_scheduler_opportunity_contract.php
          php tests/unit/capital_markets_instrument_pool_catalog_audit.php
          php tests/unit/capital_markets_instrument_pool_lifecycle_review.php
          php tests/unit/capital_markets_per_instrument_stream_trust.php
          php tests/unit/capital_markets_multi_symbol_300_planner.php
          php tests/architecture/capital_markets_multisymbol_per_instrument_contract.php
          php tests/unit/capital_markets_provider_expansion_replay_scaling.php
          php tests/architecture/capital_markets_provider_replay_scaling_contract.php
          php tests/unit/capital_markets_bybit_derivative_ws.php
          php tests/architecture/capital_markets_l2_derivatives_p1_contract.php
          php tests/unit/capital_markets_stream_provider_ops_alerts.php
          php tests/architecture/capital_markets_live_provider_ops_contract.php
          php tests/unit/capital_markets_pool_production_soak.php
          php tests/unit/capital_markets_pool_issuer_e4.php
          php tests/architecture/capital_markets_pool_production_contract.php
          php tests/architecture/capital_markets_integrated_authority_contract.php
          php tests/architecture/locale_static_module_execution_contract.php
          php tests/unit/engineering_domain_context_compression.php
          php tests/unit/capital_markets_tokenized_equity_backtest.php
          php tests/architecture/legacy_p1_canonical_consolidation.php
          php tests/architecture/engineering_agent_run_order.php
          php tests/architecture/experience_v1_canonical_ux_registry.php
          php tests/unit/capital_markets_instrument_pool_schedule_targets.php
          php tests/architecture/capital_markets_instrument_pool_scheduler_contract.php
          php tests/architecture/capital_markets_instrument_pool_approval_contract.php
          php tests/unit/capital_markets_streaming_operations_alerts.php
          php tests/architecture/capital_markets_instrument_pool_snapshot_contract.php
          php tests/architecture/capital_markets_binance_spot_multi_streaming_contract.php
          php tests/architecture/capital_markets_streaming_operations_contract.php
          php tests/architecture/capital_markets_streaming_workspace_contract.php
          php tests/unit/capital_markets_bybit_spot_bbo_protocol.php
          php tests/unit/capital_markets_bybit_linear_bbo_protocol.php
          php tests/unit/capital_markets_kraken_spot_ticker_protocol.php
          php tests/unit/capital_markets_massive_stocks_ws_protocol.php
          php tests/unit/capital_markets_massive_multi_nbbo_protocol.php
          php tests/unit/capital_markets_binance_usdm_bbo_protocol.php
          php tests/architecture/capital_markets_stream_runner_contract.php
          php tests/architecture/capital_markets_binance_spot_streaming_contract.php
          php tests/architecture/capital_markets_streaming_core_contract.php
          php tests/architecture/capital_markets_stream_expired_sweeper_contract.php
          php tests/architecture/capital_markets_stream_all_provider_sweeper_contract.php
          php tests/architecture/capital_markets_stream_sweeper_profile_contract.php
          php tests/architecture/capital_markets_rest_stream_writer_gate_contract.php
          php tests/unit/capital_markets_market_intelligence_polling.php
          php tests/architecture/capital_markets_bybit_spot_streaming_contract.php
          php tests/architecture/capital_markets_bybit_linear_streaming_contract.php
          php tests/architecture/capital_markets_kraken_streaming_contract.php
          php tests/architecture/capital_markets_massive_stocks_ws_contract.php
          php tests/architecture/capital_markets_massive_multi_nbbo_contract.php
          php tests/architecture/capital_markets_binance_usdm_streaming_contract.php
