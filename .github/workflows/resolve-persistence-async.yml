name: Resolve persistence async scheduler dependencies

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/resolve-persistence-async.yml'
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: redis
          tools: composer:v2
      - name: Resolve packages
        working-directory: symfony
        run: >
          composer require
          doctrine/doctrine-bundle
          doctrine/orm
          doctrine/doctrine-migrations-bundle
          symfony/redis-messenger:7.4.*
          symfony/scheduler:7.4.*
          --no-interaction --no-install
      - name: Emit composer files
        working-directory: symfony
        run: |
          echo '---BEGIN-COMPOSER-JSON---'
          cat composer.json
          echo '---END-COMPOSER-JSON---'
          echo '---BEGIN-COMPOSER-LOCK---'
          cat composer.lock
          echo '---END-COMPOSER-LOCK---'
