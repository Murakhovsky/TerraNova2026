name: COS Visualization V0.1-V0.5.5

on:
  push:
    branches: [main]
    paths:
      - 'app/Kernel/Visualization/**'
      - 'app/Kernel/Module/CrossDomainContract.php'
      - 'app/Kernel/Module/ModuleContributions.php'
      - 'app/Kernel/Module/Contract/Bootstrap*ProvidingModuleInterface.php'
      - 'app/Domains/Sales/module.php'
      - 'app/Domains/Property/module.php'
      - 'app/Domains/Sales/Bootstrap/SalesDomainModule.php'
      - 'app/Infrastructure/Visualization/**'
      - 'app/Interfaces/Web/Visualization/**'
      - 'app/Interfaces/Web/View/visualization/**'
      - 'symfony/src/Web/Visualization/ArchitectureExplorerController.php'
      - 'app/Kernel/Visualization/Graph/GraphMapperInterface.php'
      - 'app/Interfaces/Web/Navigation/FrontendNavigation.php'
      - 'app/Interfaces/Web/Module.php'
      - 'app/Bootstrap/KernelServices.php'
      - 'app/Bootstrap/VisualizationServices.php'
      - 'app/config/services_kernel.php'
      - 'symfony/src/Command/ArchitectureGraphSmokeCommand.php'
      - 'symfony/src/Infrastructure/Visualization/ArchitectureGraphProviderFactory.php'
      - 'symfony/config/services.yaml'
      - 'tests/architecture/symfony_workspace_ssr_cutover.php'
      - 'deploy/dev.sh'
      - 'frontend/entrypoints/cos-architecture-explorer.js'
      - 'frontend/features/cos/architecture-explorer.*'
      - 'vite.config.js'
      - 'tests/unit/visualization_*.php'
      - 'tests/architecture/visualization_*.php'
      - 'tests/architecture/cross_domain_dependency_audit.php'
      - 'resources/processes/**'
      - 'docs/.vitepress/process-registry.mjs'
      - 'docs/.vitepress/generate-runtime-evidence.php'
      - 'docs/.vitepress/process-runtime-evidence.mjs'
      - 'docs/.vitepress/check-processes.mjs'
      - 'docs/.vitepress/generate-business-process-reference.mjs'
      - 'docs/.vitepress/documentation-contracts.mjs'
      - 'docs/02-workflows/business-process-modeling.md'
      - 'docs/09-development/adding-a-workflow.md'
      - 'docs/12-reference/business-processes.md'
      - 'docs/03-architecture/visualization-v0.4.2.md'
      - 'docs/03-architecture/visualization-v0.5.md'
      - '.github/workflows/visualization.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/Kernel/Visualization/**'
      - 'app/Kernel/Module/CrossDomainContract.php'
      - 'app/Kernel/Module/ModuleContributions.php'
      - 'app/Kernel/Module/Contract/Bootstrap*ProvidingModuleInterface.php'
      - 'app/Domains/Sales/module.php'
      - 'app/Domains/Property/module.php'
      - 'app/Domains/Sales/Bootstrap/SalesDomainModule.php'
      - 'app/Infrastructure/Visualization/**'
      - 'app/Interfaces/Web/Visualization/**'
      - 'app/Interfaces/Web/View/visualization/**'
      - 'symfony/src/Web/Visualization/ArchitectureExplorerController.php'
      - 'app/Kernel/Visualization/Graph/GraphMapperInterface.php'
      - 'app/Interfaces/Web/Navigation/FrontendNavigation.php'
      - 'app/Interfaces/Web/Module.php'
      - 'app/Bootstrap/KernelServices.php'
      - 'app/Bootstrap/VisualizationServices.php'
      - 'app/config/services_kernel.php'
      - 'symfony/src/Command/ArchitectureGraphSmokeCommand.php'
      - 'symfony/src/Infrastructure/Visualization/ArchitectureGraphProviderFactory.php'
      - 'symfony/config/services.yaml'
      - 'tests/architecture/symfony_workspace_ssr_cutover.php'
      - 'deploy/dev.sh'
      - 'frontend/entrypoints/cos-architecture-explorer.js'
      - 'frontend/features/cos/architecture-explorer.*'
      - 'vite.config.js'
      - 'tests/unit/visualization_*.php'
      - 'tests/architecture/visualization_*.php'
      - 'tests/architecture/cross_domain_dependency_audit.php'
      - 'resources/processes/**'
      - 'docs/.vitepress/process-registry.mjs'
      - 'docs/.vitepress/generate-runtime-evidence.php'
      - 'docs/.vitepress/process-runtime-evidence.mjs'
      - 'docs/.vitepress/check-processes.mjs'
      - 'docs/.vitepress/generate-business-process-reference.mjs'
      - 'docs/.vitepress/documentation-contracts.mjs'
      - 'docs/02-workflows/business-process-modeling.md'
      - 'docs/09-development/adding-a-workflow.md'
      - 'docs/12-reference/business-processes.md'
      - 'docs/03-architecture/visualization-v0.4.2.md'
      - 'docs/03-architecture/visualization-v0.5.md'
      - '.github/workflows/visualization.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - name: Visualization architecture boundary
        run: |
          php tests/architecture/visualization_v02.php
          php tests/architecture/visualization_v03.php
          php tests/architecture/visualization_v04.php
          php tests/architecture/visualization_v041.php
          php tests/architecture/visualization_v042.php
          php tests/architecture/visualization_v05.php
          php tests/architecture/visualization_v053.php
          php tests/architecture/visualization_v055.php
          php tests/architecture/symfony_workspace_ssr_cutover.php
          php tests/architecture/cross_domain_dependency_audit.php
      - name: Visualization graph invariants
        run: |
          php tests/unit/visualization_graph_foundation.php
          php tests/unit/visualization_architecture_graph.php
          php tests/unit/visualization_cytoscape_mapper.php
          php tests/unit/visualization_architecture_projections.php
          php tests/unit/visualization_cross_domain_contracts.php
          php tests/unit/visualization_fallback_graph_provider.php
          php tests/unit/visualization_graph_health.php
      - name: Process runtime evidence
        run: |
          php docs/.vitepress/generate-runtime-evidence.php > /tmp/cos-runtime-evidence.json
          php -r '$d=json_decode(file_get_contents("/tmp/cos-runtime-evidence.json"), true, 512, JSON_THROW_ON_ERROR); if (($d["schema_version"] ?? null) !== 1) exit(1);'
          node docs/.vitepress/check-processes.mjs
      - name: Frontend build
        run: npm run build
      - name: PHP syntax
        run: |
          find app/Kernel/Visualization app/Infrastructure/Visualization app/Interfaces/Web/Visualization -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l app/Kernel/Module/CrossDomainContract.php
          php -l app/Kernel/Module/ModuleContributions.php
          php -l app/Kernel/Module/Contract/BootstrapRuleProvidingModuleInterface.php
          php -l app/Kernel/Module/Contract/BootstrapPolicyProvidingModuleInterface.php
          php -l app/Domains/Sales/Bootstrap/SalesDomainModule.php
          php -l app/Domains/Sales/module.php
          php -l app/Domains/Property/module.php
          php -l app/Bootstrap/VisualizationServices.php
          php -l symfony/src/Web/Visualization/ArchitectureExplorerController.php
          php -l app/Kernel/Visualization/Graph/GraphMapperInterface.php
          php -l app/Interfaces/Web/Navigation/FrontendNavigation.php
          php -l app/Interfaces/Web/Module.php
          php -l symfony/src/Command/ArchitectureGraphSmokeCommand.php
          php -l symfony/src/Infrastructure/Visualization/ArchitectureGraphProviderFactory.php
          php -l docs/.vitepress/generate-runtime-evidence.php
          php -l tests/architecture/visualization_v02.php
          php -l tests/architecture/visualization_v03.php
          php -l tests/architecture/visualization_v04.php
          php -l tests/architecture/visualization_v041.php
          php -l tests/architecture/visualization_v042.php
          php -l tests/architecture/visualization_v05.php
          php -l tests/architecture/visualization_v053.php
          php -l tests/architecture/visualization_v055.php
          php -l tests/architecture/cross_domain_dependency_audit.php
          php -l tests/unit/visualization_graph_foundation.php
          php -l tests/unit/visualization_architecture_graph.php
          php -l tests/unit/visualization_cytoscape_mapper.php
          php -l tests/unit/visualization_architecture_projections.php
          php -l tests/unit/visualization_cross_domain_contracts.php
          php -l tests/unit/visualization_fallback_graph_provider.php
          php -l tests/unit/visualization_graph_health.php
