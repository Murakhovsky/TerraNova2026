name: Sales Diagnostics Foundation

on:
  push:
    branches: [main, migration/symfony, migration/sales-diagnostics-foundation]
    paths:
      - 'app/Domains/Sales/Diagnostics/**'
      - 'app/Domains/Diagnostic/Evaluation/SalesEvaluationRunner.php'
      - 'tests/unit/sales_diagnostics_foundation.php'
      - 'tests/architecture/sales_diagnostics_boundaries.php'
      - 'docs/architecture/SALES_DIAGNOSTICS.md'
      - '.github/workflows/sales-diagnostics.yml'
  pull_request:
    branches: [main, migration/symfony]
    paths:
      - 'app/Domains/Sales/Diagnostics/**'
      - 'app/Domains/Diagnostic/Evaluation/SalesEvaluationRunner.php'
      - 'tests/unit/sales_diagnostics_foundation.php'
      - 'tests/architecture/sales_diagnostics_boundaries.php'
      - 'docs/architecture/SALES_DIAGNOSTICS.md'
      - '.github/workflows/sales-diagnostics.yml'
  workflow_dispatch:

jobs:
  methodology-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php tests/architecture/sales_diagnostics_boundaries.php
      - run: php tests/unit/sales_diagnostics_foundation.php
      - run: find app/Domains/Sales/Diagnostics -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -l app/Domains/Diagnostic/Evaluation/SalesEvaluationRunner.php
