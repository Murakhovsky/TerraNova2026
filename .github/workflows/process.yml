      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci

      - name: Process architecture boundary
        run: |
          php tests/architecture/process_v01.php
          php tests/architecture/growth_v020_runtime.php
          php tests/architecture/growth_v030_intelligence.php
