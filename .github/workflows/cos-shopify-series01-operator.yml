name: COS Shopify SERIES01 supervised connection
on:
  workflow_dispatch:
    inputs:
      organization:
        description: 'Exact existing COS tenant ID'
        required: true
        type: string
        default: default
      operation:
        description: 'preflight/provision/pull/status/candidates/order/order-sandbox'
        required: true
        type: choice
        default: preflight
        options: [preflight, provision, status, pull, candidates, order, order-sandbox]
      connection_id:
        description: '32-char connection ID for pull/status/candidates/order'
        type: string
        required: false
      order_gid:
        description: 'Exact gid://shopify/Order/123 for read-only order evidence'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: cos-shopify-series01-${{ inputs.organization }}
  cancel-in-progress: false
jobs:
  operator:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: AWS TN2026
    timeout-minutes: 8
    env:
      ORG: ${{ inputs.organization }}
      ACTION: ${{ inputs.operation }}
      CONNECTION: ${{ inputs.connection_id }}
      ORDER_GID: ${{ inputs.order_gid }}
      DEV_HOST: ${{ secrets.DEV_HOST }}
      DEV_USER: ${{ secrets.DEV_USER }}
      DEV_PORT: ${{ secrets.DEV_PORT }}
      DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
    steps:
      - name: Input contract
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$ORG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,39}$ ]] || exit 2
          case "$ACTION" in
            preflight|provision) [[ -z "$CONNECTION" && -z "$ORDER_GID" ]] || exit 2 ;;
            pull|status|candidates) [[ "$CONNECTION" =~ ^[a-f0-9]{32}$ && -z "$ORDER_GID" ]] || exit 2 ;;
            order|order-sandbox) [[ "$CONNECTION" =~ ^[a-f0-9]{32}$ && "$ORDER_GID" =~ ^gid://shopify/Order/[1-9][0-9]{0,18}$ ]] || exit 2 ;;
            *) exit 2 ;;
          esac
          for n in DEV_HOST DEV_USER DEV_PORT DEV_SSH_KEY; do
            [[ -n "${!n:-}" ]] || { echo "Missing $n"; exit 2; }
          done
          [[ "$DEV_PORT" =~ ^[0-9]{1,5}$ ]] || exit 2
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEV_SSH_KEY" > "$HOME/.ssh/cos_series01_key"
          chmod 600 "$HOME/.ssh/cos_series01_key"
          ssh-keyscan -T 10 -p "$DEV_PORT" -H "$DEV_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Execute exact supervised COS Shopify command
        shell: bash
        run: |
          set -Eeuo pipefail
          cmd=(sudo -n bash /opt/cos/bin/shopify-series01-operator.sh "$ORG" "$ACTION")
          if [[ -n "$CONNECTION" ]]; then cmd+=("$CONNECTION"); fi
          if [[ -n "$ORDER_GID" ]]; then cmd+=("$ORDER_GID"); fi
          printf -v remote_command '%q ' "${cmd[@]}"
          ssh -T -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/cos_series01_key" -p "$DEV_PORT" \
            "$DEV_USER@$DEV_HOST" "$remote_command"
