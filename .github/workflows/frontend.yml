name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'symfony/assets/**'
      - 'symfony/templates/**'
      - 'public/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/browser/**'
      - 'tests/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:frontend
      - name: Browser test syntax
        run: find tests/browser -maxdepth 1 -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
