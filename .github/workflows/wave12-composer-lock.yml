name: Wave 12 Composer Lock

on:
  push:
    branches: [feat/web-experience-runtime]
    paths:
      - 'symfony/composer.json'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-experience-runtime
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Resolve canonical Symfony runtime dependencies
        run: composer update --working-dir=symfony --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add symfony/composer.lock
          if git diff --cached --quiet; then
            echo "composer.lock is already current."
            exit 0
          fi
          git commit -m "Wave 12.1: lock Symfony UX runtime dependencies"
          git push origin HEAD:feat/web-experience-runtime
