name: WEB V0.13 Explicit Routing and 404 Closure

on:
  push:
    branches: [main]
    paths:
      - 'app/config/services_web.php'
      - 'app/Interfaces/Web/Module.php'
      - 'app/Interfaces/Web/Controller/ErrorController.php'
      - 'app/Interfaces/Web/Routing/**'
      - 'symfony/config/routes.yaml'
      - 'symfony/config/services.yaml'
      - 'symfony/src/Web/Spatial/**'
      - 'symfony/src/Web/Seo/**'
      - 'symfony/src/Web/Content/**'
      - 'symfony/src/Web/PublicEdge/**'
      - 'tests/architecture/frontend_routes.php'
      - 'tests/architecture/robots_symfony_cutover.php'
      - 'tests/architecture/sitemap_symfony_cutover.php'
      - 'tests/architecture/blog_guide_symfony_cutover.php'
      - 'tests/architecture/public_edge_symfony_cutover.php'
      - 'tests/architecture/web_v013_explicit_routing.php'
      - 'docs/architecture/web-v0.13.md'
      - '.github/workflows/web-v013.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/config/services_web.php'
      - 'app/Interfaces/Web/Module.php'
      - 'app/Interfaces/Web/Controller/ErrorController.php'
      - 'app/Interfaces/Web/Routing/**'
      - 'symfony/config/routes.yaml'
      - 'symfony/config/services.yaml'
      - 'symfony/src/Web/Spatial/**'
      - 'symfony/src/Web/Seo/**'
      - 'symfony/src/Web/Content/**'
      - 'symfony/src/Web/PublicEdge/**'
      - 'tests/architecture/frontend_routes.php'
      - 'tests/architecture/robots_symfony_cutover.php'
      - 'tests/architecture/sitemap_symfony_cutover.php'
      - 'tests/architecture/blog_guide_symfony_cutover.php'
      - 'tests/architecture/public_edge_symfony_cutover.php'
      - 'tests/architecture/web_v013_explicit_routing.php'
      - 'docs/architecture/web-v0.13.md'
      - '.github/workflows/web-v013.yml'

jobs:
  explicit-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: composer install --no-interaction --prefer-dist
      - name: PHP lint
        run: |
          php -l app/config/services_web.php
          php -l app/Interfaces/Web/Module.php
          php -l app/Interfaces/Web/Controller/ErrorController.php
          php -l app/Interfaces/Web/Routing/CoreWebRoutes.php
          php -l symfony/src/Web/Spatial/SpatialPageController.php
          php -l symfony/src/Web/Seo/RobotsController.php
          php -l symfony/src/Web/Seo/SitemapController.php
          php -l symfony/src/Web/Content/PublicContentPageController.php
          php -l symfony/src/Web/PublicEdge/PublicEdgeController.php
          php -l tests/architecture/robots_symfony_cutover.php
          php -l tests/architecture/sitemap_symfony_cutover.php
          php -l tests/architecture/blog_guide_symfony_cutover.php
          php -l tests/architecture/public_edge_symfony_cutover.php
          php -l tests/architecture/web_v013_explicit_routing.php
      - name: Routing regression gates
        run: |
          php tests/architecture/frontend_routes.php
          php tests/architecture/robots_symfony_cutover.php
          php tests/architecture/sitemap_symfony_cutover.php
          php tests/architecture/blog_guide_symfony_cutover.php
          php tests/architecture/public_edge_symfony_cutover.php
          php tests/architecture/web_v013_explicit_routing.php
