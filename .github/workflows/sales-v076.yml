name: Sales V0.7.6 Users Teams Authority
on:
  push:
    branches: [COS]
  pull_request:
    branches: [COS]
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: composer install --no-interaction --prefer-dist
      - name: V0.7.1-V0.7.5 regressions
        run: |
          php tests/architecture/sales_v071_configuration.php
          php tests/architecture/sales_v072_pipeline_admin.php
          php tests/architecture/sales_v073_rule_editor.php
          php tests/architecture/sales_v074_agent_admin.php
          php tests/architecture/sales_v075_policy_admin.php
          php tests/unit/sales_v075_policy_engine.php
      - name: V0.7.6 architecture and authority contracts
        run: |
          php tests/architecture/sales_v076_users_teams_authority.php
          php tests/unit/sales_v076_authority.php
      - name: PHP syntax
        run: |
          php -l app/Kernel/Approval/Contract/ApprovalAuthorityInterface.php
          php -l app/Kernel/Approval/Service/ApprovalService.php
          php -l app/Domains/Sales/Application/Contract/SalesAccessControlInterface.php
          php -l app/Domains/Sales/Application/Contract/SalesAssignmentAuthorityInterface.php
          php -l app/Domains/Sales/Application/Contract/SalesTeamAdministrationInterface.php
          php -l app/Domains/Sales/Application/UseCase/AssignDealOwner.php
          php -l app/Domains/Sales/Infrastructure/Persistence/MySql/MysqlSalesAccessControl.php
          php -l app/Domains/Sales/Infrastructure/Persistence/MySql/MysqlSalesAssignmentAuthority.php
          php -l app/Domains/Sales/Infrastructure/Persistence/MySql/MysqlSalesApprovalAuthority.php
          php -l app/Domains/Sales/Infrastructure/Persistence/MySql/MysqlSalesTeamAdministration.php
          php -l app/Interfaces/Api/Controller/SalesAdminTeamController.php
          php -l app/Interfaces/Web/Controller/SalesAdminTeamController.php
          php -l app/Interfaces/Web/Routing/SalesTeamRoutes.php
          php -l app/Interfaces/Web/View/sales_admin/teams.phtml
