name: Platform Integration Foundation

on:
  push:
    branches: [main, migration/symfony, migration/platform-integration]
    paths:
      - 'app/Platform/Integration/**'
      - 'composer.json'
      - 'composer.lock'
      - 'symfony/composer.json'
      - 'symfony/composer.lock'
      - 'docker/symfony/php/Dockerfile'
      - 'tests/unit/platform_integration_foundation.php'
      - 'tests/architecture/platform_integration_boundaries.php'
      - '.github/workflows/platform-integration.yml'
  pull_request:
    branches: [main, migration/symfony]
    paths:
      - 'app/Platform/Integration/**'
      - 'composer.json'
      - 'composer.lock'
      - 'symfony/composer.json'
      - 'symfony/composer.lock'
      - 'docker/symfony/php/Dockerfile'
      - 'tests/unit/platform_integration_foundation.php'
      - 'tests/architecture/platform_integration_boundaries.php'
      - '.github/workflows/platform-integration.yml'
  workflow_dispatch:

jobs:
  pure-php-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php tests/architecture/platform_integration_boundaries.php
      - run: php tests/unit/platform_integration_foundation.php
      - run: find app/Platform/Integration -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - working-directory: symfony
        run: composer install --no-interaction --prefer-dist --no-progress
      - working-directory: symfony
        run: |
          php -r "require 'vendor/autoload.php'; echo class_exists('Platform\\Integration\\Model\\ConnectorDefinition') ? 'Symfony Platform autoload OK'.PHP_EOL : exit(1);"
