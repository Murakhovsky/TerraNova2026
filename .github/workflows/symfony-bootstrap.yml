name: Symfony LTS Parallel Bootstrap

on:
  push:
    branches:
      - main
      - migration/symfony
    paths:
      - 'symfony/**'
      - 'docker/symfony/**'
      - 'docker-compose.symfony.yml'
      - 'deploy/symfony-dev.sh'
      - 'app/Kernel/**'
      - 'app/Platform/**'
      - 'app/Domains/**'
      - 'app/Infrastructure/Platform/ReadModel/MySql/MysqlOperationsReadModel.php'
      - 'app/Infrastructure/Platform/Persistence/MySql/Documents/**'
      - 'app/Interfaces/Web/View/**'
      - 'frontend/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'public/build/**'
      - 'tests/architecture/symfony_sales_ssr_cutover.php'
      - 'app/migrations/20260919_000063_documents_wave10_cutover.sql'
      - 'app/migrations/20260919_000064_service_wave11_cutover.sql'
      - 'tests/architecture/documents_wave10_cutover.php'
      - '.github/workflows/symfony-bootstrap.yml'
  pull_request:
    branches:
      - main
      - migration/symfony
      - 'migration/wave*'
    paths:
      - 'symfony/**'
      - 'docker/symfony/**'
      - 'docker-compose.symfony.yml'
      - 'deploy/symfony-dev.sh'
      - 'app/Kernel/**'
      - 'app/Platform/**'
      - 'app/Domains/**'
      - 'app/Infrastructure/Platform/ReadModel/MySql/MysqlOperationsReadModel.php'
      - 'app/Infrastructure/Platform/Persistence/MySql/Documents/**'
      - 'app/Interfaces/Web/View/**'
      - 'frontend/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'public/build/**'
      - 'tests/architecture/symfony_sales_ssr_cutover.php'
      - 'app/migrations/20260919_000063_documents_wave10_cutover.sql'
      - 'app/migrations/20260919_000064_service_wave11_cutover.sql'
      - 'tests/architecture/documents_wave10_cutover.php'
      - '.github/workflows/symfony-bootstrap.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SYMFONY_APP_SECRET: ci-only-secret
      SYMFONY_DB_ROOT_PASSWORD: ci-root-password
      SYMFONY_DB_PASSWORD: ci-db-password
      SYMFONY_LEGACY_DB_HOST: mysql
      SYMFONY_LEGACY_DB_NAME: cos_symfony
      SYMFONY_LEGACY_DB_USER: cos
      SYMFONY_LEGACY_DB_PASSWORD: ci-db-password
      COS_ORGANIZATION_ID: default
      COS_SALES_AUTOMATION_SCHEDULER_ENABLED: "0"
      COS_AGENT_LLM_MODE: "fixture"
      LLM_ENDPOINT: ""
      LLM_TOKEN: ""
      LLM_MODEL: "wave4-ci"
      LLM_PROVIDER: "fixture"
      WAVE6_CRM_WEBHOOK_SECRET: "wave6-ci-webhook-secret"
      SPATIAL_MAX_UPLOAD_BYTES: "209715200"
      SPATIAL_JWT_SECRET: "ci-spatial-jwt-secret-0123456789abcdef"
      SPATIAL_JWT_TTL: "28800"
      SPATIAL_BLENDER_BINARY: ""
      SPATIAL_GLTF_TRANSFORM_BINARY: ""
      APP_URL: "http://127.0.0.1:8080"
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_BOT_NAME: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend runtime assets
        run: |
          npm ci
          npm run build
          test -f public/build/.vite/manifest.json
          grep -q '"frontend/entrypoints/public-surface.js"' public/build/.vite/manifest.json
          grep -q '"frontend/spatial/spatial-viewer.js"' public/build/.vite/manifest.json

      - name: Install root architecture-test autoload
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Prepare isolated legacy resource contracts
        run: |
          docker network create cos_backend
          docker volume create cos_php_sessions

      - name: Validate compose contract
        run: docker compose -f docker-compose.symfony.yml config --quiet

      - name: Build Symfony runtime
        run: docker compose -f docker-compose.symfony.yml build php nginx

      - name: Boot isolated stack
        run: docker compose -f docker-compose.symfony.yml up -d

      - name: Seed legacy identity fixtures
        run: |
          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony <<'SQL'
          CREATE TABLE tn_users (
            id BIGINT UNSIGNED NOT NULL PRIMARY KEY,
            organization_id VARCHAR(190) NOT NULL,
            email VARCHAR(255) NOT NULL,
            full_name VARCHAR(255) NOT NULL,
            status VARCHAR(32) NOT NULL
          );
          CREATE TABLE cos_organization_memberships (
            organization_id VARCHAR(190) NOT NULL,
            user_id BIGINT UNSIGNED NOT NULL,
            role VARCHAR(64) NOT NULL,
            status VARCHAR(32) NOT NULL,
            created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
            PRIMARY KEY (organization_id, user_id)
          );
          INSERT INTO tn_users (id, organization_id, email, full_name, status) VALUES
            (1001, 'default', 'manager@example.test', 'CI Manager', 'active'),
            (1002, 'default', 'realtor@example.test', 'CI Realtor', 'active'),
            (1003, 'other-org', 'other@example.test', 'Other Manager', 'active');
          INSERT INTO cos_organization_memberships (organization_id, user_id, role, status) VALUES
            ('default', 1001, 'manager', 'ACTIVE'),
            ('default', 1002, 'realtor', 'ACTIVE'),
            ('other-org', 1003, 'manager', 'ACTIVE');

          CREATE TABLE sales_pipelines (
            id BIGINT UNSIGNED NOT NULL PRIMARY KEY,
            organization_id VARCHAR(190) NOT NULL,
            status VARCHAR(32) NOT NULL,
            is_default TINYINT(1) NOT NULL DEFAULT 0
          );
          CREATE TABLE sales_pipeline_stages (
            id BIGINT UNSIGNED NOT NULL PRIMARY KEY,
            pipeline_id BIGINT UNSIGNED NOT NULL,
            organization_id VARCHAR(190) NOT NULL,
            code VARCHAR(64) NOT NULL,
            sort_order INT NOT NULL DEFAULT 0
          );
          CREATE TABLE tn_client_cases (
            id BIGINT UNSIGNED NOT NULL PRIMARY KEY,
            organization_id VARCHAR(190) NOT NULL,
            stage_id BIGINT UNSIGNED NULL,
            stage VARCHAR(64) NOT NULL
          );
          INSERT INTO sales_pipelines (id, organization_id, status, is_default) VALUES
            (1, 'default', 'ACTIVE', 1),
            (2, 'other-org', 'ACTIVE', 1);
          INSERT INTO sales_pipeline_stages (id, pipeline_id, organization_id, code, sort_order) VALUES
            (10, 1, 'default', 'NEW', 10),
            (11, 1, 'default', 'WON', 20),
            (20, 2, 'other-org', 'NEW', 10);
          INSERT INTO tn_client_cases (id, organization_id, stage_id, stage) VALUES
            (101, 'default', 10, 'new'),
            (102, 'default', 11, 'won'),
            (201, 'other-org', 20, 'new');
          SQL
          docker run --rm -v cos_php_sessions:/sessions alpine:3.21 sh -c '
            printf "%s" "tn_auth_user_id|i:1001;cos_organization_id|s:7:\"default\";cos_csrf_token|s:64:\"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef\";" > /sessions/sess_ci-manager-session0001
            printf "%s" "tn_auth_user_id|i:1002;cos_organization_id|s:7:\"default\";cos_csrf_token|s:64:\"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef\";" > /sessions/sess_ci-realtor-session0002
            printf "%s" "tn_auth_user_id|i:1003;cos_organization_id|s:9:\"other-org\";cos_csrf_token|s:64:\"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef\";" > /sessions/sess_ci-other-manager0003
            chmod 644 /sessions/sess_*
          '

      - name: Seed Spatial Web fixture contract
        run: |
          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony <<'SQL'
          CREATE TABLE IF NOT EXISTS tn_media_assets (
            id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
            original_name VARCHAR(255) NULL,
            mime_type VARCHAR(190) NULL,
            public_url VARCHAR(2048) NULL
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
          SQL

          # Exercise the real Spatial schema contract. The migration ledger insert is
          # intentionally omitted because this isolated stack does not own tn_migrations.
          sed '/^INSERT IGNORE INTO tn_migrations/,$d' app/migrations/20260823_000017_spatial_core.sql | \
            docker compose -f docker-compose.symfony.yml exec -T mysql \
              mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony

          # Preflight the exact public-scene join used by MysqlSpatialSceneRepository.
          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT s.id, pm.public_url
             FROM tn_spatial_scenes s
             LEFT JOIN tn_media_assets pm ON pm.id = s.poster_media_id
             WHERE (s.public_id = 'ci-missing-scene' OR s.slug = 'ci-missing-scene')
               AND s.status = 'published' AND s.published_at IS NOT NULL AND s.published_at <= NOW()
             LIMIT 1;"

          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "INSERT INTO tn_spatial_scenes (public_id, slug, title, status, published_at)
             VALUES ('SPS-CI-PUBLIC', 'ci-public-scene', 'CI Public Scene', 'published', NOW());"

      - name: Seed Sales Wave 1 read fixtures
        run: |
          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony < symfony/tests/fixtures/sales_wave1.sql

      - name: Seed Sales Wave 2 write fixtures
        run: |
          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony < symfony/tests/fixtures/sales_wave2.sql

      - name: Seed Sales Wave 3 automation fixtures
        run: |
          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony < symfony/tests/fixtures/sales_wave3.sql

      - name: Seed Runtime cleanup Diagnostic permission fixtures
        run: |
          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony <<'SQL'
          CREATE TABLE IF NOT EXISTS diagnostic_role_permissions (
            role VARCHAR(80) NOT NULL,
            permission VARCHAR(80) NOT NULL,
            PRIMARY KEY (role, permission)
          );

          CREATE TABLE IF NOT EXISTS diagnostic_user_permissions (
            organization_id VARCHAR(190) NOT NULL,
            user_id BIGINT UNSIGNED NOT NULL,
            permission VARCHAR(80) NOT NULL,
            allowed TINYINT(1) NOT NULL,
            PRIMARY KEY (organization_id, user_id, permission)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

          INSERT IGNORE INTO diagnostic_role_permissions(role, permission) VALUES
            ('realtor', 'diagnostic.methodology.view'),
            ('manager', 'diagnostic.methodology.view'),
            ('manager', 'diagnostic.methodology.edit');
          SQL

      - name: Seed Sales Wave 4 Agent Tool fixtures
        run: |
          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony < symfony/tests/fixtures/sales_wave4.sql

      - name: Seed Sales Wave 6 Communications / Integrations fixtures
        run: |
          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony < symfony/tests/fixtures/sales_wave6.sql

      - name: Seed Sales Wave 7 Frontend cutover fixtures
        run: |
          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony < symfony/tests/fixtures/sales_wave7.sql

      - name: Seed Property / RealEstate Wave 9 fixtures
        run: |
          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony < symfony/tests/fixtures/property_real_estate_wave9.sql

      - name: Seed Documents Wave 10 fixtures
        run: |
          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony < symfony/tests/fixtures/documents_wave10.sql

      - name: Apply Service Wave 11 migration
        run: |
          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "CREATE TABLE IF NOT EXISTS tn_migrations (
              id INT UNSIGNED NOT NULL AUTO_INCREMENT,
              migration VARCHAR(160) NOT NULL,
              applied_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
              PRIMARY KEY (id),
              UNIQUE KEY uq_tn_migrations_migration (migration)
            ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;"
          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony < app/migrations/20260919_000064_service_wave11_cutover.sql

      - name: Verify Doctrine MySQL persistence boundary
        run: |
          docker compose -f docker-compose.symfony.yml exec -T php php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          docker compose -f docker-compose.symfony.yml exec -T php php tests/persistence_contract.php
          php tests/architecture/symfony_persistence_boundary.php

      - name: Verify Redis Messenger and Scheduler runtime
        run: |
          docker compose -f docker-compose.symfony.yml exec -T php php bin/console debug:messenger
          docker compose -f docker-compose.symfony.yml exec -T php php bin/console debug:scheduler cos
          docker compose -f docker-compose.symfony.yml exec -T worker rm -f var/runtime/scheduler-heartbeat.json || true
          docker compose -f docker-compose.symfony.yml exec -T php php bin/console cos:async:probe --token=ci
          for attempt in $(seq 1 20); do
            if docker compose -f docker-compose.symfony.yml exec -T worker grep -q '"token":"ci"' var/runtime/scheduler-heartbeat.json 2>/dev/null; then
              echo "Redis async worker processed the probe."
              exit 0
            fi
            sleep 1
          done
          docker compose -f docker-compose.symfony.yml logs --no-color --tail=250 worker scheduler redis
          exit 1

      - name: Verify shared COS autoload contract
        run: |
          docker compose -f docker-compose.symfony.yml exec -T php php -r '
            require "vendor/autoload.php";
            if (!interface_exists("Kernel\\Operations\\Contract\\OperationsReadModelInterface")) { exit(11); }
            if (!class_exists("Infrastructure\\Platform\\ReadModel\\MySql\\MysqlOperationsReadModel")) { exit(12); }
            if (!class_exists("App\\Security\\LegacySessionAuthenticator")) { exit(13); }
            if (!class_exists("Kernel\\Tenant\\Model\\TenantContext")) { exit(14); }
            if (!class_exists("Domains\\Sales\\Domain\\Lead\\LeadId")) { exit(15); }
            echo "canonical COS Kernel, Platform/Infrastructure, Domains and Symfony security bridge classes load\n";
          '

      - name: Verify operations and API v1 application contracts
        run: |
          docker compose -f docker-compose.symfony.yml exec -T php php tests/operations_read_contract.php
          docker compose -f docker-compose.symfony.yml exec -T php php tests/api_v1_contract.php
          docker compose -f docker-compose.symfony.yml exec -T php php tests/api_v1_controller_boundary.php
          docker compose -f docker-compose.symfony.yml exec -T php php tests/api_v1_request_mapper.php
          docker compose -f docker-compose.symfony.yml exec -T php php tests/http_correlation_contract.php
          php tests/architecture/symfony_runtime_hardening.php
          php tests/architecture/runtime_cleanup_third_slice.php
          php tests/architecture/spatial_symfony_cutover.php
          php tests/architecture/symfony_web_surfaces_cutover.php
          php tests/architecture/runtime_retirement_background_slice.php
          php tests/architecture/phalcon_cli_retirement.php
          php tests/architecture/phalcon_script_retirement.php
          php tests/architecture/kernel_v082_module_control.php
          php tests/architecture/kernel_v088_effective_module_context.php
          php tests/architecture/kernel_v0810_module_readiness_diagnostics.php
          php tests/smoke/diagnostic_v053.php
          php tests/smoke/diagnostic_v055.php
          docker compose -f docker-compose.symfony.yml exec -T php sh -c "php bin/console list --raw | grep -q '^cos:kernel:worker'"
          docker compose -f docker-compose.symfony.yml exec -T php sh -c "php bin/console list --raw | grep -q '^cos:legacy-schema:migrate'"
          docker compose -f docker-compose.symfony.yml exec -T php sh -c "php bin/console list --raw | grep -q '^cos:spatial:process'"
          docker compose -f docker-compose.symfony.yml exec -T php sh -c "php bin/console list --raw | grep -q '^cos:integration:n8n:process'"
          docker compose -f docker-compose.symfony.yml exec -T php sh -c "php bin/console list --raw | grep -q '^cos:config:validate'"
          docker compose -f docker-compose.symfony.yml exec -T php sh -c "php bin/console list --raw | grep -q '^cos:config:provision'"
          docker compose -f docker-compose.symfony.yml exec -T php sh -c "php bin/console list --raw | grep -q '^cos:outbox:run'"
          docker compose -f docker-compose.symfony.yml exec -T php sh -c "php bin/console list --raw | grep -q '^cos:outbox:replay'"
          docker compose -f docker-compose.symfony.yml exec -T php sh -c "php bin/console list --raw | grep -q '^cos:queue:run'"
          docker compose -f docker-compose.symfony.yml exec -T php sh -c "php bin/console list --raw | grep -q '^cos:queue:replay-dead'"
          docker compose -f docker-compose.symfony.yml exec -T php sh -c "php bin/console list --raw | grep -q '^cos:agent:purge-inputs'"
          docker compose -f docker-compose.symfony.yml exec -T php sh -c "php bin/console list --raw | grep -q '^cos:sales:monitor'"
          docker compose -f docker-compose.symfony.yml exec -T php sh -c "php bin/console list --raw | grep -q '^cos:sales:history:rebuild'"
          docker compose -f docker-compose.symfony.yml exec -T php sh -c "php bin/console list --raw | grep -q '^cos:sales:history:health'"
          docker compose -f docker-compose.symfony.yml exec -T php sh -c "php bin/console list --raw | grep -q '^cos:kernel:version'"
          docker compose -f docker-compose.symfony.yml exec -T php sh -c "php bin/console list --raw | grep -q '^cos:architecture:smoke'"
          docker compose -f docker-compose.symfony.yml exec -T php sh -c "php bin/console list --raw | grep -q '^cos:diagnostic:sales-methodology:import-v02'"
          docker compose -f docker-compose.symfony.yml exec -T php sh -c "php bin/console list --raw | grep -q '^cos:telegram:process'"
          docker compose -f docker-compose.symfony.yml exec -T php sh -c "php bin/console list --raw | grep -q '^cos:telegram:health'"
          docker compose -f docker-compose.symfony.yml exec -T php php bin/console cos:architecture:smoke

      - name: Verify Sales strangler slice
        run: |
          php tests/architecture/symfony_sales_strangler_boundary.php
          docker compose -f docker-compose.symfony.yml exec -T php php tests/sales_strangler_query_contract.php
          docker compose -f docker-compose.symfony.yml exec -T php php bin/console cos:sales:client-case-stats --organization=default > /tmp/sales-cli.json
          grep -q '"all": 2' /tmp/sales-cli.json
          status=$(curl --silent --show-error --output /tmp/sales-stats.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            http://127.0.0.1:8081/api/v1/sales/client-cases/stats)
          test "$status" = "200"
          grep -q '"organization_id":"default"' /tmp/sales-stats.json
          grep -q '"all":2' /tmp/sales-stats.json
          grep -q '"NEW":1' /tmp/sales-stats.json
          grep -q '"WON":1' /tmp/sales-stats.json

      - name: Verify Sales Wave 1 read cutover
        run: |
          php tests/architecture/symfony_sales_read_wave1_boundary.php
          docker compose -f docker-compose.symfony.yml exec -T php php tests/sales_read_wave1_contract.php
          docker compose -f docker-compose.symfony.yml exec -T php php bin/console lint:container
          docker compose -f docker-compose.symfony.yml exec -T php php bin/console debug:router > /tmp/symfony-routes.txt
          grep -q 'cos_api_v1_sales_dashboard' /tmp/symfony-routes.txt
          grep -q 'cos_api_v1_sales_opportunity' /tmp/symfony-routes.txt

          status=$(curl --silent --show-error --output /tmp/sales-wave1-dashboard.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            http://127.0.0.1:8081/api/v1/sales/dashboard)
          echo "Sales dashboard HTTP $status"
          cat /tmp/sales-wave1-dashboard.json
          echo
          test "$status" = "200"
          grep -q '"active_deals"' /tmp/sales-wave1-dashboard.json
          grep -q '"new_leads"' /tmp/sales-wave1-dashboard.json

          status=$(curl --silent --show-error --output /tmp/sales-wave1-leads.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            'http://127.0.0.1:8081/api/v1/sales/leads?page=1&per_page=1&sort=name&direction=asc')
          echo "Sales leads HTTP $status"
          cat /tmp/sales-wave1-leads.json
          echo
          test "$status" = "200"
          grep -q '"per_page":1' /tmp/sales-wave1-leads.json
          grep -q '"has_more":true' /tmp/sales-wave1-leads.json
          grep -q '"Default Lead"' /tmp/sales-wave1-leads.json

          status=$(curl --silent --show-error --output /tmp/sales-wave1-lead.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            http://127.0.0.1:8081/api/v1/sales/leads/301)
          echo "Sales lead detail HTTP $status"
          cat /tmp/sales-wave1-lead.json
          echo
          test "$status" = "200"
          grep -q '"organization_id":"default"' /tmp/sales-wave1-lead.json
          grep -q '"activities"' /tmp/sales-wave1-lead.json
          grep -q '"opportunity"' /tmp/sales-wave1-lead.json
          grep -q '"communications"' /tmp/sales-wave1-lead.json

          status=$(curl --silent --show-error --output /tmp/sales-wave1-cross-tenant-lead.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            http://127.0.0.1:8081/api/v1/sales/leads/401)
          test "$status" = "404"

          status=$(curl --silent --show-error --output /tmp/sales-wave1-opportunities.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            'http://127.0.0.1:8081/api/v1/sales/opportunities?page=1&per_page=1&sort=value&direction=desc')
          echo "Sales opportunities HTTP $status"
          cat /tmp/sales-wave1-opportunities.json
          echo
          test "$status" = "200"
          grep -q '"per_page":1' /tmp/sales-wave1-opportunities.json
          grep -q '"has_more":true' /tmp/sales-wave1-opportunities.json

          status=$(curl --silent --show-error --output /tmp/sales-wave1-opportunity.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            http://127.0.0.1:8081/api/v1/sales/opportunities/101)
          echo "Sales opportunity detail HTTP $status"
          cat /tmp/sales-wave1-opportunity.json
          echo
          test "$status" = "200"
          grep -q '"opportunity"' /tmp/sales-wave1-opportunity.json
          grep -q '"timeline"' /tmp/sales-wave1-opportunity.json
          grep -q '"CASE-101"' /tmp/sales-wave1-opportunity.json

          status=$(curl --silent --show-error --output /tmp/sales-wave1-cross-tenant-opportunity.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            http://127.0.0.1:8081/api/v1/sales/opportunities/201)
          test "$status" = "404"

          status=$(curl --silent --show-error --output /tmp/sales-wave1-pipelines.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            http://127.0.0.1:8081/api/v1/sales/pipelines)
          echo "Sales pipelines HTTP $status"
