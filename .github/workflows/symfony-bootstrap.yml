name: Symfony LTS Parallel Bootstrap

on:
  push:
    branches:
      - main
      - migration/symfony
    paths:
      - 'symfony/**'
      - 'docker/symfony/**'
      - 'docker-compose.symfony.yml'
      - 'deploy/symfony-dev.sh'
      - 'app/Kernel/**'
      - 'app/Platform/**'
      - 'app/Domains/**'
      - 'app/Infrastructure/Platform/ReadModel/MySql/MysqlOperationsReadModel.php'
      - '.github/workflows/symfony-bootstrap.yml'
  pull_request:
    branches:
      - main
      - migration/symfony
    paths:
      - 'symfony/**'
      - 'docker/symfony/**'
      - 'docker-compose.symfony.yml'
      - 'deploy/symfony-dev.sh'
      - 'app/Kernel/**'
      - 'app/Platform/**'
      - 'app/Domains/**'
      - 'app/Infrastructure/Platform/ReadModel/MySql/MysqlOperationsReadModel.php'
      - '.github/workflows/symfony-bootstrap.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SYMFONY_APP_SECRET: ci-only-secret
      SYMFONY_DB_ROOT_PASSWORD: ci-root-password
      SYMFONY_DB_PASSWORD: ci-db-password
      SYMFONY_LEGACY_DB_HOST: mysql
      SYMFONY_LEGACY_DB_NAME: cos_symfony
      SYMFONY_LEGACY_DB_USER: cos
      SYMFONY_LEGACY_DB_PASSWORD: ci-db-password
      COS_ORGANIZATION_ID: default
      COS_SALES_AUTOMATION_SCHEDULER_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated legacy resource contracts
        run: |
          docker network create cos_backend
          docker volume create cos_php_sessions

      - name: Validate compose contract
        run: docker compose -f docker-compose.symfony.yml config --quiet

      - name: Build Symfony runtime
        run: docker compose -f docker-compose.symfony.yml build php nginx

      - name: Boot isolated stack
        run: docker compose -f docker-compose.symfony.yml up -d

      - name: Seed legacy identity fixtures
        run: |
          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony <<'SQL'
          CREATE TABLE tn_users (
            id BIGINT UNSIGNED NOT NULL PRIMARY KEY,
            organization_id VARCHAR(190) NOT NULL,
            email VARCHAR(255) NOT NULL,
            full_name VARCHAR(255) NOT NULL,
            status VARCHAR(32) NOT NULL
          );
          CREATE TABLE cos_organization_memberships (
            organization_id VARCHAR(190) NOT NULL,
            user_id BIGINT UNSIGNED NOT NULL,
            role VARCHAR(64) NOT NULL,
            status VARCHAR(32) NOT NULL,
            created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
            PRIMARY KEY (organization_id, user_id)
          );
          INSERT INTO tn_users (id, organization_id, email, full_name, status) VALUES
            (1001, 'default', 'manager@example.test', 'CI Manager', 'active'),
            (1002, 'default', 'realtor@example.test', 'CI Realtor', 'active'),
            (1003, 'other-org', 'other@example.test', 'Other Manager', 'active');
          INSERT INTO cos_organization_memberships (organization_id, user_id, role, status) VALUES
            ('default', 1001, 'manager', 'ACTIVE'),
            ('default', 1002, 'realtor', 'ACTIVE'),
            ('other-org', 1003, 'manager', 'ACTIVE');

          CREATE TABLE sales_pipelines (
            id BIGINT UNSIGNED NOT NULL PRIMARY KEY,
            organization_id VARCHAR(190) NOT NULL,
            status VARCHAR(32) NOT NULL,
            is_default TINYINT(1) NOT NULL DEFAULT 0
          );
          CREATE TABLE sales_pipeline_stages (
            id BIGINT UNSIGNED NOT NULL PRIMARY KEY,
            pipeline_id BIGINT UNSIGNED NOT NULL,
            organization_id VARCHAR(190) NOT NULL,
            code VARCHAR(64) NOT NULL,
            sort_order INT NOT NULL DEFAULT 0
          );
          CREATE TABLE tn_client_cases (
            id BIGINT UNSIGNED NOT NULL PRIMARY KEY,
            organization_id VARCHAR(190) NOT NULL,
            stage_id BIGINT UNSIGNED NULL,
            stage VARCHAR(64) NOT NULL
          );
          INSERT INTO sales_pipelines (id, organization_id, status, is_default) VALUES
            (1, 'default', 'ACTIVE', 1),
            (2, 'other-org', 'ACTIVE', 1);
          INSERT INTO sales_pipeline_stages (id, pipeline_id, organization_id, code, sort_order) VALUES
            (10, 1, 'default', 'NEW', 10),
            (11, 1, 'default', 'WON', 20),
            (20, 2, 'other-org', 'NEW', 10);
          INSERT INTO tn_client_cases (id, organization_id, stage_id, stage) VALUES
            (101, 'default', 10, 'new'),
            (102, 'default', 11, 'won'),
            (201, 'other-org', 20, 'new');
          SQL
          docker run --rm -v cos_php_sessions:/sessions alpine:3.21 sh -c '
            printf "%s" "tn_auth_user_id|i:1001;cos_organization_id|s:7:\"default\";cos_csrf_token|s:64:\"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef\";" > /sessions/sess_ci-manager-session0001
            printf "%s" "tn_auth_user_id|i:1002;cos_organization_id|s:7:\"default\";cos_csrf_token|s:64:\"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef\";" > /sessions/sess_ci-realtor-session0002
            printf "%s" "tn_auth_user_id|i:1003;cos_organization_id|s:9:\"other-org\";cos_csrf_token|s:64:\"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef\";" > /sessions/sess_ci-other-manager0003
            chmod 644 /sessions/sess_*
          '

      - name: Seed Sales Wave 1 read fixtures
        run: |
          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony < symfony/tests/fixtures/sales_wave1.sql

      - name: Seed Sales Wave 2 write fixtures
        run: |
          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony < symfony/tests/fixtures/sales_wave2.sql

      - name: Seed Sales Wave 3 automation fixtures
        run: |
          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony < symfony/tests/fixtures/sales_wave3.sql

      - name: Verify Doctrine MySQL persistence boundary
        run: |
          docker compose -f docker-compose.symfony.yml exec -T php php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          docker compose -f docker-compose.symfony.yml exec -T php php tests/persistence_contract.php
          php tests/architecture/symfony_persistence_boundary.php

      - name: Verify Redis Messenger and Scheduler runtime
        run: |
          docker compose -f docker-compose.symfony.yml exec -T php php bin/console debug:messenger
          docker compose -f docker-compose.symfony.yml exec -T php php bin/console debug:scheduler cos
          docker compose -f docker-compose.symfony.yml exec -T worker rm -f var/runtime/scheduler-heartbeat.json || true
          docker compose -f docker-compose.symfony.yml exec -T php php bin/console cos:async:probe --token=ci
          for attempt in $(seq 1 20); do
            if docker compose -f docker-compose.symfony.yml exec -T worker grep -q '"token":"ci"' var/runtime/scheduler-heartbeat.json 2>/dev/null; then
              echo "Redis async worker processed the probe."
              exit 0
            fi
            sleep 1
          done
          docker compose -f docker-compose.symfony.yml logs --no-color --tail=250 worker scheduler redis
          exit 1

      - name: Verify shared COS autoload contract
        run: |
          docker compose -f docker-compose.symfony.yml exec -T php php -r '
            require "vendor/autoload.php";
            if (!interface_exists("Kernel\\Operations\\Contract\\OperationsReadModelInterface")) { exit(11); }
            if (!class_exists("Infrastructure\\Platform\\ReadModel\\MySql\\MysqlOperationsReadModel")) { exit(12); }
            if (!class_exists("App\\Security\\LegacySessionAuthenticator")) { exit(13); }
            if (!class_exists("Kernel\\Tenant\\Model\\TenantContext")) { exit(14); }
            if (!class_exists("Domains\\Sales\\Domain\\Lead\\LeadId")) { exit(15); }
            echo "canonical COS Kernel, Platform/Infrastructure, Domains and Symfony security bridge classes load\n";
          '

      - name: Verify operations and API v1 application contracts
        run: |
          docker compose -f docker-compose.symfony.yml exec -T php php tests/operations_read_contract.php
          docker compose -f docker-compose.symfony.yml exec -T php php tests/api_v1_contract.php
          docker compose -f docker-compose.symfony.yml exec -T php php tests/api_v1_controller_boundary.php
          docker compose -f docker-compose.symfony.yml exec -T php php tests/api_v1_request_mapper.php
          docker compose -f docker-compose.symfony.yml exec -T php php tests/http_correlation_contract.php
          php tests/architecture/symfony_runtime_hardening.php

      - name: Verify Sales strangler slice
        run: |
          php tests/architecture/symfony_sales_strangler_boundary.php
          docker compose -f docker-compose.symfony.yml exec -T php php tests/sales_strangler_query_contract.php
          docker compose -f docker-compose.symfony.yml exec -T php php bin/console cos:sales:client-case-stats --organization=default > /tmp/sales-cli.json
          grep -q '"all": 2' /tmp/sales-cli.json
          status=$(curl --silent --show-error --output /tmp/sales-stats.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            http://127.0.0.1:8081/api/v1/sales/client-cases/stats)
          test "$status" = "200"
          grep -q '"organization_id":"default"' /tmp/sales-stats.json
          grep -q '"all":2' /tmp/sales-stats.json
          grep -q '"NEW":1' /tmp/sales-stats.json
          grep -q '"WON":1' /tmp/sales-stats.json

      - name: Verify Sales Wave 1 read cutover
        run: |
          php tests/architecture/symfony_sales_read_wave1_boundary.php
          docker compose -f docker-compose.symfony.yml exec -T php php tests/sales_read_wave1_contract.php
          docker compose -f docker-compose.symfony.yml exec -T php php bin/console lint:container
          docker compose -f docker-compose.symfony.yml exec -T php php bin/console debug:router > /tmp/symfony-routes.txt
          grep -q 'cos_api_v1_sales_dashboard' /tmp/symfony-routes.txt
          grep -q 'cos_api_v1_sales_opportunity' /tmp/symfony-routes.txt

          status=$(curl --silent --show-error --output /tmp/sales-wave1-dashboard.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            http://127.0.0.1:8081/api/v1/sales/dashboard)
          echo "Sales dashboard HTTP $status"
          cat /tmp/sales-wave1-dashboard.json
          echo
          test "$status" = "200"
          grep -q '"active_deals"' /tmp/sales-wave1-dashboard.json
          grep -q '"new_leads"' /tmp/sales-wave1-dashboard.json

          status=$(curl --silent --show-error --output /tmp/sales-wave1-leads.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            'http://127.0.0.1:8081/api/v1/sales/leads?page=1&per_page=1&sort=name&direction=asc')
          echo "Sales leads HTTP $status"
          cat /tmp/sales-wave1-leads.json
          echo
          test "$status" = "200"
          grep -q '"per_page":1' /tmp/sales-wave1-leads.json
          grep -q '"has_more":true' /tmp/sales-wave1-leads.json
          grep -q '"Default Lead"' /tmp/sales-wave1-leads.json

          status=$(curl --silent --show-error --output /tmp/sales-wave1-lead.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            http://127.0.0.1:8081/api/v1/sales/leads/301)
          echo "Sales lead detail HTTP $status"
          cat /tmp/sales-wave1-lead.json
          echo
          test "$status" = "200"
          grep -q '"organization_id":"default"' /tmp/sales-wave1-lead.json
          grep -q '"activities"' /tmp/sales-wave1-lead.json
          grep -q '"opportunity"' /tmp/sales-wave1-lead.json
          grep -q '"communications"' /tmp/sales-wave1-lead.json

          status=$(curl --silent --show-error --output /tmp/sales-wave1-cross-tenant-lead.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            http://127.0.0.1:8081/api/v1/sales/leads/401)
          test "$status" = "404"

          status=$(curl --silent --show-error --output /tmp/sales-wave1-opportunities.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            'http://127.0.0.1:8081/api/v1/sales/opportunities?page=1&per_page=1&sort=value&direction=desc')
          echo "Sales opportunities HTTP $status"
          cat /tmp/sales-wave1-opportunities.json
          echo
          test "$status" = "200"
          grep -q '"per_page":1' /tmp/sales-wave1-opportunities.json
          grep -q '"has_more":true' /tmp/sales-wave1-opportunities.json

          status=$(curl --silent --show-error --output /tmp/sales-wave1-opportunity.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            http://127.0.0.1:8081/api/v1/sales/opportunities/101)
          echo "Sales opportunity detail HTTP $status"
          cat /tmp/sales-wave1-opportunity.json
          echo
          test "$status" = "200"
          grep -q '"opportunity"' /tmp/sales-wave1-opportunity.json
          grep -q '"timeline"' /tmp/sales-wave1-opportunity.json
          grep -q '"CASE-101"' /tmp/sales-wave1-opportunity.json

          status=$(curl --silent --show-error --output /tmp/sales-wave1-cross-tenant-opportunity.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            http://127.0.0.1:8081/api/v1/sales/opportunities/201)
          test "$status" = "404"

          status=$(curl --silent --show-error --output /tmp/sales-wave1-pipelines.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            http://127.0.0.1:8081/api/v1/sales/pipelines)
          echo "Sales pipelines HTTP $status"
          cat /tmp/sales-wave1-pipelines.json
          echo
          test "$status" = "200"
          grep -q '"Default Sales"' /tmp/sales-wave1-pipelines.json
          if grep -q '"Other Sales"' /tmp/sales-wave1-pipelines.json; then
            echo 'Sales pipelines leaked another tenant'
            exit 1
          fi

          status=$(curl --silent --show-error --output /tmp/sales-wave1-no-session.json --write-out '%{http_code}' \
            http://127.0.0.1:8081/api/v1/sales/leads)
          test "$status" = "403"

      - name: Verify Sales Wave 2 write cutover
        run: |
          php tests/architecture/symfony_sales_write_wave2_boundary.php
          docker compose -f docker-compose.symfony.yml exec -T php php tests/legacy_session_csrf_contract.php
          docker compose -f docker-compose.symfony.yml exec -T php php tests/sales_write_wave2_contract.php
          docker compose -f docker-compose.symfony.yml exec -T php php bin/console lint:container
          docker compose -f docker-compose.symfony.yml exec -T php php bin/console debug:router > /tmp/symfony-wave2-routes.txt
          grep -q 'cos_api_v1_sales_lead_create' /tmp/symfony-wave2-routes.txt
          grep -q 'cos_api_v1_sales_opportunity_next_action' /tmp/symfony-wave2-routes.txt

          csrf='0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'

          status=$(curl --silent --show-error --dump-header /tmp/wave2-create.headers --output /tmp/wave2-create.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            -H "X-CSRF-Token: $csrf" \
            -H 'X-Correlation-ID: wave2-create-lead' \
            -H 'X-Idempotency-Key: wave2-create-001' \
            -H 'Content-Type: application/json' \
            --data '{"full_name":"Wave Two Lead","phone":"+380000000777","email":"wave2@example.test","source":"symfony-wave2","manager_note":"Created by Wave 2","owner_id":1001}' \
            http://127.0.0.1:8081/api/v1/sales/leads)
          echo "Create Lead HTTP $status"; cat /tmp/wave2-create.json; echo
          test "$status" = "201"
          grep -qi '^X-Correlation-ID: wave2-create-lead' /tmp/wave2-create.headers
          lead_id=$(php -r '$j=json_decode(file_get_contents("/tmp/wave2-create.json"),true); echo (int)($j["data"]["lead_id"]??0);')
          test "$lead_id" -gt 0

          status=$(curl --silent --show-error --output /tmp/wave2-create-duplicate.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            -H "X-CSRF-Token: $csrf" \
            -H 'X-Correlation-ID: wave2-create-lead-duplicate' \
            -H 'X-Idempotency-Key: wave2-create-001' \
            -H 'Content-Type: application/json' \
            --data '{"full_name":"Should Not Duplicate","phone":"+380000000778"}' \
            http://127.0.0.1:8081/api/v1/sales/leads)
          echo "Duplicate Lead HTTP $status"; cat /tmp/wave2-create-duplicate.json; echo
          test "$status" = "200"
          duplicate_lead_id=$(php -r '$j=json_decode(file_get_contents("/tmp/wave2-create-duplicate.json"),true); echo (int)($j["data"]["lead_id"]??0);')
          test "$duplicate_lead_id" = "$lead_id"

          status=$(curl --silent --show-error --output /tmp/wave2-update.json --write-out '%{http_code}' \
            --request PATCH \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            -H "X-CSRF-Token: $csrf" \
            -H 'X-Correlation-ID: wave2-update-lead' \
            -H 'Content-Type: application/json' \
            --data '{"status":"contacted","manager_note":"Contact completed","owner_id":1001}' \
            "http://127.0.0.1:8081/api/v1/sales/leads/$lead_id")
          echo "Update Lead HTTP $status"; cat /tmp/wave2-update.json; echo
          test "$status" = "200"
          grep -q '"code":"updated"' /tmp/wave2-update.json

          status=$(curl --silent --show-error --output /tmp/wave2-convert.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            -H "X-CSRF-Token: $csrf" \
            -H 'X-Correlation-ID: wave2-convert-lead' \
            -H 'Content-Type: application/json' \
            --data '{"priority":"high","owner_id":1001}' \
            "http://127.0.0.1:8081/api/v1/sales/leads/$lead_id/opportunity")
          echo "Convert Lead HTTP $status"; cat /tmp/wave2-convert.json; echo
          if [ "$status" != "201" ]; then
            docker compose -f docker-compose.symfony.yml logs --no-color --tail=250 php nginx mysql || true
            docker compose -f docker-compose.symfony.yml exec -T php sh -lc 'test -f var/log/prod.log && tail -n 250 var/log/prod.log || true' || true
            exit 1
          fi
          opportunity_id=$(php -r '$j=json_decode(file_get_contents("/tmp/wave2-convert.json"),true); echo (int)($j["data"]["case_id"]??0);')
          test "$opportunity_id" -gt 0

          status=$(curl --silent --show-error --output /tmp/wave2-convert-duplicate.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            -H "X-CSRF-Token: $csrf" \
            -H 'X-Correlation-ID: wave2-convert-lead-duplicate' \
            -H 'Content-Type: application/json' \
            --data '{"priority":"normal","owner_id":1001}' \
            "http://127.0.0.1:8081/api/v1/sales/leads/$lead_id/opportunity")
          test "$status" = "200"
          grep -q '"code":"already_attached"' /tmp/wave2-convert-duplicate.json

          status=$(curl --silent --show-error --output /tmp/wave2-activity.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            -H "X-CSRF-Token: $csrf" \
            -H 'X-Correlation-ID: wave2-add-activity' \
            -H 'Content-Type: application/json' \
            --data '{"activity_type":"task","title":"Wave 2 activity","body":"Activity through Symfony"}' \
            "http://127.0.0.1:8081/api/v1/sales/opportunities/$opportunity_id/activities")
          echo "Activity HTTP $status"; cat /tmp/wave2-activity.json; echo
          test "$status" = "201"
          grep -q '"activity_id":' /tmp/wave2-activity.json

          status=$(curl --silent --show-error --output /tmp/wave2-stage.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            -H "X-CSRF-Token: $csrf" \
            -H 'X-Correlation-ID: wave2-stage-change' \
            -H 'Content-Type: application/json' \
            --data '{"stage_id":"12"}' \
            "http://127.0.0.1:8081/api/v1/sales/opportunities/$opportunity_id/stage")
          echo "Stage HTTP $status"; cat /tmp/wave2-stage.json; echo
          test "$status" = "200"
          grep -q '"stage_id":"12"' /tmp/wave2-stage.json
          grep -q '"changed":true' /tmp/wave2-stage.json

          due_at=$(date -u -d '+2 days' '+%Y-%m-%dT%H:%M:%S+00:00')
          status=$(curl --silent --show-error --output /tmp/wave2-next.json --write-out '%{http_code}' \
            --request PUT \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            -H "X-CSRF-Token: $csrf" \
            -H 'X-Correlation-ID: wave2-next-action' \
            -H 'X-Idempotency-Key: wave2-next-001' \
            -H 'Content-Type: application/json' \
            --data "{\"title\":\"Wave 2 follow-up\",\"body\":\"Call the client\",\"due_at\":\"$due_at\"}" \
            "http://127.0.0.1:8081/api/v1/sales/opportunities/$opportunity_id/next-action")
          echo "Next Action HTTP $status"; cat /tmp/wave2-next.json; echo
          test "$status" = "201"
          next_id=$(php -r '$j=json_decode(file_get_contents("/tmp/wave2-next.json"),true); echo (int)($j["data"]["activity_id"]??0);')
          test "$next_id" -gt 0

          status=$(curl --silent --show-error --output /tmp/wave2-next-duplicate.json --write-out '%{http_code}' \
            --request PUT \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            -H "X-CSRF-Token: $csrf" \
            -H 'X-Correlation-ID: wave2-next-action-duplicate' \
            -H 'X-Idempotency-Key: wave2-next-001' \
            -H 'Content-Type: application/json' \
            --data "{\"title\":\"Duplicate follow-up\",\"due_at\":\"$due_at\"}" \
            "http://127.0.0.1:8081/api/v1/sales/opportunities/$opportunity_id/next-action")
          test "$status" = "200"
          duplicate_next_id=$(php -r '$j=json_decode(file_get_contents("/tmp/wave2-next-duplicate.json"),true); echo (int)($j["data"]["activity_id"]??0);')
          test "$duplicate_next_id" = "$next_id"
          grep -q '"duplicate":true' /tmp/wave2-next-duplicate.json

          status=$(curl --silent --show-error --output /tmp/wave2-cross-tenant-lead.json --write-out '%{http_code}' \
            --request PATCH \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            -H "X-CSRF-Token: $csrf" \
            -H 'Content-Type: application/json' \
            --data '{"status":"contacted"}' \
            http://127.0.0.1:8081/api/v1/sales/leads/401)
          test "$status" = "404"

          status=$(curl --silent --show-error --output /tmp/wave2-cross-tenant-opportunity.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            -H "X-CSRF-Token: $csrf" \
            -H 'Content-Type: application/json' \
            --data '{"stage_id":"21"}' \
            http://127.0.0.1:8081/api/v1/sales/opportunities/201/stage)
          test "$status" = "404"

          status=$(curl --silent --show-error --output /tmp/wave2-no-csrf.json --write-out '%{http_code}' \
            --request PATCH \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            -H 'Content-Type: application/json' \
            --data '{"status":"qualified"}' \
            "http://127.0.0.1:8081/api/v1/sales/leads/$lead_id")
          test "$status" = "400"
          grep -q '"error":"invalid_csrf_token"' /tmp/wave2-no-csrf.json

          status=$(curl --silent --show-error --output /tmp/wave2-no-session.json --write-out '%{http_code}' \
            -H "X-CSRF-Token: $csrf" \
            -H 'X-Idempotency-Key: unauthenticated' \
            -H 'Content-Type: application/json' \
            --data '{"full_name":"No Session","phone":"+380000000999"}' \
            http://127.0.0.1:8081/api/v1/sales/leads)
          test "$status" = "403"

          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT COUNT(*) FROM tn_leads WHERE organization_id='default' AND email='wave2@example.test';" > /tmp/wave2-lead-count.txt
          test "$(tr -d '[:space:]' < /tmp/wave2-lead-count.txt)" = "1"

          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT COUNT(*) FROM sales_operation_receipts WHERE organization_id='default' AND operation_type='api.lead.create' AND idempotency_key='wave2-create-001';" > /tmp/wave2-receipt-count.txt
          test "$(tr -d '[:space:]' < /tmp/wave2-receipt-count.txt)" = "1"

          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT COUNT(*) FROM cos_external_references WHERE organization_id='default' AND provider='aida' AND entity_type='followup' AND cos_reference='action:wave2-next-001';" > /tmp/wave2-next-ref-count.txt
          test "$(tr -d '[:space:]' < /tmp/wave2-next-ref-count.txt)" = "1"

          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT COUNT(*) FROM cos_events WHERE organization_id='default' AND correlation_id IN ('wave2-create-lead','wave2-update-lead','wave2-convert-lead','wave2-add-activity','wave2-stage-change','wave2-next-action');" > /tmp/wave2-event-count.txt
          test "$(tr -d '[:space:]' < /tmp/wave2-event-count.txt)" -ge "7"

          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT COUNT(*) FROM cos_event_outbox o INNER JOIN cos_events e ON e.id=o.event_id WHERE e.organization_id='default';" > /tmp/wave2-outbox-count.txt
          test "$(tr -d '[:space:]' < /tmp/wave2-outbox-count.txt)" -ge "7"

          echo "Sales Wave 2 create/update/convert/activity/stage/next-action runtime passed."

      - name: Verify Sales Wave 3 deterministic automation cutover
        run: |
          php tests/architecture/symfony_sales_automation_wave3_boundary.php
          php tests/unit/sales_attention_detectors.php
          php tests/unit/sales_wave3_automation.php
          docker compose -f docker-compose.symfony.yml exec -T php php bin/console lint:container

          docker compose -f docker-compose.symfony.yml exec -e COS_SALES_AUTOMATION_SCHEDULER_ENABLED=1 -T php \
            php bin/console debug:scheduler cos > /tmp/wave3-scheduler.txt
          grep -q 'RunSalesAutomationCommand' /tmp/wave3-scheduler.txt
          grep -q 'DrainSalesOutboxCommand' /tmp/wave3-scheduler.txt

          csrf='0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          status=$(curl --silent --show-error --output /tmp/wave3-lead.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            -H "X-CSRF-Token: $csrf" \
            -H 'X-Correlation-ID: wave3-fresh-lead' \
            -H 'X-Idempotency-Key: wave3-fresh-lead-001' \
            -H 'Content-Type: application/json' \
            --data '{"full_name":"Wave Three Fresh Lead","phone":"+380000003333","email":"wave3@example.test","source":"symfony-wave3","owner_id":1001}' \
            http://127.0.0.1:8081/api/v1/sales/leads)
          echo "Wave 3 fresh Lead HTTP $status"; cat /tmp/wave3-lead.json; echo
          test "$status" = "201"
          wave3_lead_id=$(php -r '$j=json_decode(file_get_contents("/tmp/wave3-lead.json"),true); echo (int)($j["data"]["lead_id"]??0);')
          test "$wave3_lead_id" -gt 0

          docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony <<'SQL'
          INSERT INTO cos_events
            (id,organization_id,type,aggregate_type,aggregate_id,payload,metadata,schema_version,
             correlation_id,causation_id,actor_type,actor_id,occurred_at)
          VALUES
            ('wave3-property-event','default','property.test','property','999',
             JSON_OBJECT('fixture',true),JSON_OBJECT('correlation_id','wave3-property-corr'),1,
             'wave3-property-corr',NULL,'SYSTEM','wave3-fixture',NOW(6));
          INSERT INTO cos_event_outbox(event_id,organization_id,status,available_at)
          VALUES('wave3-property-event','default','PENDING',NOW(6));
          SQL

          docker compose -f docker-compose.symfony.yml exec -T php \
            php bin/console cos:sales:automation:enqueue --organization=default --limit=200 --no-activity-hours=48

          wave3_complete=0
          for attempt in $(seq 1 90); do
            completed=$(docker compose -f docker-compose.symfony.yml exec -T mysql \
              mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
              "SELECT COUNT(DISTINCT type) FROM cos_actions WHERE organization_id='default' AND status='COMPLETED' AND type IN ('sales.create_lead_followup_task','sales.escalate_overdue_followup','sales.create_followup','sales.request_manager_review');" | tr -d '[:space:]')
            if [ "$completed" = "4" ]; then
              wave3_complete=1
              break
            fi
            sleep 1
          done
          if [ "$wave3_complete" != "1" ]; then
            echo "Wave 3 actions did not complete."
            docker compose -f docker-compose.symfony.yml exec -T mysql \
              mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
              "SELECT id,type,target_type,target_id,status,last_error FROM cos_actions ORDER BY created_at;"
            docker compose -f docker-compose.symfony.yml exec -T mysql \
              mysql -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
              "SELECT id,type,status,attempts,last_error FROM cos_jobs ORDER BY created_at;"
            docker compose -f docker-compose.symfony.yml logs --no-color --tail=350 worker scheduler php mysql redis || true
            exit 1
          fi

          lead_tasks=$(docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT COUNT(*) FROM tn_lead_activities WHERE lead_id=$wave3_lead_id AND activity_type='task' AND title='First contact with new Lead';" | tr -d '[:space:]')
          test "$lead_tasks" = "1"

          overdue_tasks=$(docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT COUNT(*) FROM tn_client_case_activities WHERE organization_id='default' AND client_case_id=101 AND activity_type='task' AND title='Urgent overdue follow-up';" | tr -d '[:space:]')
          test "$overdue_tasks" -ge "1"

          manager_reviews=$(docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT COUNT(*) FROM tn_client_case_activities WHERE organization_id='default' AND client_case_id=101 AND activity_type='task' AND title='Review stuck Deal';" | tr -d '[:space:]')
          test "$manager_reviews" -ge "1"

          recovery_followups=$(docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT COUNT(*) FROM tn_client_case_activities WHERE organization_id='default' AND client_case_id=101 AND activity_type='followup' AND title='Re-engage customer' AND due_at>NOW();" | tr -d '[:space:]')
          test "$recovery_followups" -ge "1"

          detector_events=$(docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT COUNT(DISTINCT type) FROM cos_events WHERE organization_id='default' AND type IN ('sales.no_activity_detected','sales.followup.overdue','sales.deal.stuck');" | tr -d '[:space:]')
          test "$detector_events" = "3"

          other_detector_events=$(docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT COUNT(*) FROM cos_events WHERE organization_id='other-org' AND type IN ('sales.no_activity_detected','sales.followup.overdue','sales.deal.stuck');" | tr -d '[:space:]')
          test "$other_detector_events" = "0"

          matched_rules=$(docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT COUNT(*) FROM cos_rule_evaluations WHERE organization_id='default' AND matched=1;" | tr -d '[:space:]')
          test "$matched_rules" -ge "4"

          auto_policies=$(docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT COUNT(*) FROM cos_policy_evaluations WHERE organization_id='default' AND decision='AUTO';" | tr -d '[:space:]')
          test "$auto_policies" -ge "4"

          policy_audit=$(docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT COUNT(*) FROM cos_audit_log WHERE organization_id='default' AND category='POLICY_DECISION';" | tr -d '[:space:]')
          test "$policy_audit" -ge "4"

          execution_audit=$(docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT COUNT(*) FROM cos_audit_log WHERE organization_id='default' AND category='ACTION_EXECUTION';" | tr -d '[:space:]')
          test "$execution_audit" -ge "4"

          non_sales_status=$(docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT status FROM cos_event_outbox WHERE event_id='wave3-property-event';" | tr -d '[:space:]')
          test "$non_sales_status" = "PENDING"

          actions_before=$(docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT COUNT(*) FROM cos_actions WHERE organization_id='default' AND type IN ('sales.create_lead_followup_task','sales.escalate_overdue_followup','sales.create_followup','sales.request_manager_review');" | tr -d '[:space:]')

          docker compose -f docker-compose.symfony.yml exec -T php \
            php bin/console cos:sales:automation:enqueue --organization=default --limit=200 --no-activity-hours=48
          sleep 6

          actions_after=$(docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT COUNT(*) FROM cos_actions WHERE organization_id='default' AND type IN ('sales.create_lead_followup_task','sales.escalate_overdue_followup','sales.create_followup','sales.request_manager_review');" | tr -d '[:space:]')
          test "$actions_after" = "$actions_before"

          lead_tasks_after=$(docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT COUNT(*) FROM tn_lead_activities WHERE lead_id=$wave3_lead_id AND activity_type='task' AND title='First contact with new Lead';" | tr -d '[:space:]')
          test "$lead_tasks_after" = "1"

          non_sales_status_after=$(docker compose -f docker-compose.symfony.yml exec -T mysql \
            mysql -N -B -ucos -p"$SYMFONY_DB_PASSWORD" cos_symfony -e \
            "SELECT status FROM cos_event_outbox WHERE event_id='wave3-property-event';" | tr -d '[:space:]')
          test "$non_sales_status_after" = "PENDING"

          echo "Sales Wave 3 deterministic Scheduler/Messenger automation runtime passed."

      - name: Verify tenant voter contract
        run: docker compose -f docker-compose.symfony.yml exec -T php php tests/tenant_voter_contract.php

      - name: Verify Symfony health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8081/health > /tmp/cos-symfony-health.json; then
              cat /tmp/cos-symfony-health.json
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.symfony.yml ps -a
          docker compose -f docker-compose.symfony.yml logs --no-color --tail=250 nginx php worker scheduler mysql redis
          exit 1

      - name: Verify legacy-session security and tenant-context bridge
        run: |
          forbidden='{"ok":false,"error":"Manager authorization required."}'

          status=$(curl --silent --show-error --output /tmp/no-session.json --write-out '%{http_code}' \
            http://127.0.0.1:8081/migration/api/cos/auth-context)
          test "$status" = "403"
          test "$(cat /tmp/no-session.json)" = "$forbidden"

          status=$(curl --silent --show-error --dump-header /tmp/api-v1-no-session.headers --output /tmp/api-v1-no-session.json --write-out '%{http_code}' \
            -H 'X-Correlation-ID: ci-api-v1-no-session' \
            http://127.0.0.1:8081/api/v1/status)
          test "$status" = "403"
          test "$(cat /tmp/api-v1-no-session.json)" = "$forbidden"
          grep -qi '^X-Correlation-ID: ci-api-v1-no-session' /tmp/api-v1-no-session.headers

          status=$(curl --silent --show-error --output /tmp/manager.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            http://127.0.0.1:8081/migration/api/cos/auth-context)
          test "$status" = "200"
          grep -q '"organization_id":"default"' /tmp/manager.json
          grep -q '"organization_role":"manager"' /tmp/manager.json
          grep -q '"cos.tenant.access"' /tmp/manager.json
          grep -q '"cos.tenant.manage"' /tmp/manager.json
          if grep -q '"cos.tenant.admin"' /tmp/manager.json; then
            echo 'manager unexpectedly received tenant admin permission'
            exit 1
          fi

          status=$(curl --silent --show-error --output /tmp/api-v1-manager.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-manager-session0001' \
            http://127.0.0.1:8081/api/v1/status)
          test "$status" = "200"
          grep -q '"api_version":"v1"' /tmp/api-v1-manager.json
          grep -q '"runtime":"symfony"' /tmp/api-v1-manager.json

          status=$(curl --silent --show-error --output /tmp/realtor.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-realtor-session0002' \
            http://127.0.0.1:8081/migration/api/cos/auth-context)
          test "$status" = "403"
          test "$(cat /tmp/realtor.json)" = "$forbidden"

          status=$(curl --silent --show-error --output /tmp/other-manager.json --write-out '%{http_code}' \
            --cookie 'PHPSESSID=ci-other-manager0003' \
            http://127.0.0.1:8081/migration/api/cos/auth-context)
          test "$status" = "403"
          test "$(cat /tmp/other-manager.json)" = "$forbidden"

          echo "legacy session identity, role gate, tenant context and tenant isolation are enforced"

      - name: Verify operations routes are protected
        run: |
          status=$(curl --silent --show-error --output /tmp/cos-operations-response.json --write-out '%{http_code}' \
            http://127.0.0.1:8081/migration/api/cos/events)
          echo "HTTP $status"
          cat /tmp/cos-operations-response.json
          echo
          test "$status" = "403"
          test "$(cat /tmp/cos-operations-response.json)" = '{"ok":false,"error":"Manager authorization required."}'
          echo "operations routes are protected by Symfony Security"

      - name: Stop validation stack
        if: always()
        run: |
          docker compose -f docker-compose.symfony.yml down -v --remove-orphans || true
          docker network rm cos_backend || true
          docker volume rm cos_php_sessions || true

  deploy-dev:
    name: Deploy parallel Symfony stack to AWS dev
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: AWS TN2026
    concurrency:
      group: cos-symfony-dev-deploy
      cancel-in-progress: false
    env:
      DEV_HOST: ${{ secrets.DEV_HOST }}
      DEV_USER: ${{ secrets.DEV_USER }}
      DEV_PORT: ${{ secrets.DEV_PORT }}
      DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
      DEV_PATH: ${{ vars.DEV_PATH }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          : "${DEV_HOST:?DEV_HOST secret is missing}"
          : "${DEV_USER:?DEV_USER secret is missing}"
          : "${DEV_PORT:?DEV_PORT secret is missing}"
          : "${DEV_SSH_KEY:?DEV_SSH_KEY secret is missing}"
          : "${DEV_PATH:?DEV_PATH environment variable is missing}"

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/dev_deploy_key
          chmod 600 ~/.ssh/dev_deploy_key
          ssh-keyscan -p "$DEV_PORT" -H "$DEV_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync Symfony migration slice
        run: |
          REMOTE_PATH=$(printf '%q' "$DEV_PATH")
          ssh -i ~/.ssh/dev_deploy_key -p "$DEV_PORT" "$DEV_USER@$DEV_HOST" "mkdir -p -- $REMOTE_PATH"
          rsync -az --relative \
            -e "ssh -i ~/.ssh/dev_deploy_key -p $DEV_PORT" \
            ./symfony/ \
            ./docker/symfony/ \
            ./docker-compose.symfony.yml \
            ./deploy/symfony-dev.sh \
            ./app/Kernel/ \
            ./app/Platform/ \
            ./app/Domains/ \
            ./app/Infrastructure/ \
            "$DEV_USER@$DEV_HOST:$DEV_PATH/"

      - name: Deploy parallel Symfony runtime
        run: |
          REMOTE_PATH=$(printf '%q' "$DEV_PATH")
          ssh -i ~/.ssh/dev_deploy_key -p "$DEV_PORT" "$DEV_USER@$DEV_HOST" \
            "cd $REMOTE_PATH && bash deploy/symfony-dev.sh"

      - name: Verify server-local endpoints
        run: |
          ssh -i ~/.ssh/dev_deploy_key -p "$DEV_PORT" "$DEV_USER@$DEV_HOST" '
            set -e
            curl --fail --show-error --silent http://127.0.0.1:8081/health
            echo
            curl --fail --show-error --silent http://127.0.0.1:8081/migration/core-health
            echo
            status=$(curl --silent --show-error --dump-header /tmp/cos-symfony-protected.headers --output /tmp/cos-symfony-protected.json --write-out "%{http_code}" -H "X-Correlation-ID: aws-symfony-smoke" http://127.0.0.1:8081/migration/api/cos/events)
            test "$status" = "403"
            grep -qi "^X-Correlation-ID: aws-symfony-smoke" /tmp/cos-symfony-protected.headers
            test "$(cat /tmp/cos-symfony-protected.json)" = "{\"ok\":false,\"error\":\"Manager authorization required.\"}"
            echo security-boundary-ok
          '
