permissions:
  contents: read

jobs:
  canonical-runtime:
    runs-on: ubuntu-24.04
    env:
      MYSQL_DATABASE: cos
      MYSQL_USER: cos
      MYSQL_PASSWORD: ci-cos-password
      MYSQL_ROOT_PASSWORD: ci-root-password
      SYMFONY_APP_SECRET: ci-app-secret-0123456789abcdef
      COS_ORGANIZATION_ID: default
      COS_AGENT_LLM_MODE: fixture
      LLM_PROVIDER: fixture
      LLM_MODEL: ci-fixture
      SPATIAL_JWT_SECRET: ci-spatial-secret-0123456789abcdef
      WAVE6_CRM_WEBHOOK_SECRET: ci-crm-secret
      N8N_WEBHOOK_SECRET: ci-n8n-secret
      MERCURE_JWT_SECRET: ci-mercure-secret-0123456789abcdef
      MERCURE_PUBLIC_URL: http://127.0.0.1:8081/.well-known/mercure
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build

      - name: Zero legacy architecture gate
        run: php tests/architecture/zero_legacy_runtime.php

      - name: Validate canonical compose
        run: docker compose config --quiet

      - name: Build canonical runtime
        run: docker compose build php nginx

      - name: Start dependencies
        run: docker compose up -d --wait mysql redis mercure

      - name: Apply COS schema
        run: docker compose run --rm --no-deps php php bin/console cos:schema:migrate

      - name: Validate canonical schema
        run: |
          for table in tn_users tn_content_items tn_spatial_processing_jobs cos_organization_memberships cos_feature_flags cos_feature_flag_overrides; do
            docker compose exec -T mysql mysql -N -h127.0.0.1 -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "SHOW TABLES LIKE '$table';" | grep -qx "$table"
          done
          docker compose exec -T mysql mysql -N -h127.0.0.1 -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "SHOW COLUMNS FROM cos_audit_log LIKE 'source_type';" | grep -q '^source_type'

      - name: Apply Doctrine migrations
        run: docker compose run --rm --no-deps php php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: Start runtime
        run: docker compose up -d --remove-orphans

      - name: Validate Symfony container and routes
        run: |
          docker compose exec -T php php bin/console lint:container
          docker compose exec -T php php bin/console debug:router > /tmp/routes.txt
          grep -q 'cos_web_auth_login' /tmp/routes.txt
          grep -q 'cos_web_auth_register' /tmp/routes.txt
          grep -q 'cos_web_auth_logout' /tmp/routes.txt
          grep -q 'cos_symfony_home' /tmp/routes.txt
          grep -q 'cos_web_cabinet' /tmp/routes.txt
          grep -q 'cos_web_design_system_catalog' /tmp/routes.txt
          grep -q 'cos_web_visual_stress' /tmp/routes.txt
          grep -q 'cos_web_workspace_shell_preview' /tmp/routes.txt
          grep -q 'cos_web_workspace_platform_preview' /tmp/routes.txt
          grep -q 'cos_web_realtime_platform_preview' /tmp/routes.txt
          grep -q 'cos_web_global_search' /tmp/routes.txt

      - name: Runtime health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8081/health/dependencies >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs --no-color --tail=250 nginx php mysql redis
          exit 1

      - name: Architecture runtime smoke
        run: docker compose exec -T php php bin/console cos:architecture:smoke

      - name: Experience Platform runtime smoke
        run: docker compose exec -T php php bin/console cos:web:experience:smoke

      - name: UI Toolkit runtime smoke
        run: docker compose exec -T php php bin/console cos:web:toolkit:smoke

      - name: Design System runtime smoke
        run: docker compose exec -T php php bin/console cos:web:design-system:smoke

      - name: Visual foundation freeze gate
        run: php tests/architecture/web_experience_visual_foundation.php

      - name: PHASE 2 Style Lab gate
        run: php tests/architecture/web_experience_style_lab.php

      - name: PHASE 3 Typography contract gate
        run: php tests/architecture/web_experience_typography.php

      - name: PHASE 4 Geometry contract gate
        run: php tests/architecture/web_experience_geometry.php

      - name: PHASE 5 Surface hierarchy gate
        run: php tests/architecture/web_experience_surfaces.php

      - name: PHASE 6 Canonical primitives gate
        run: php tests/architecture/web_experience_primitives.php

      - name: PHASE 7 Entity business UX gate
        run: php tests/architecture/web_experience_business_ux.php

      - name: PHASE 8 Stress screens gate
        run: php tests/architecture/web_experience_stress_screens.php

      - name: PHASE 8 Stress screens runtime smoke
        run: docker compose exec -T php php bin/console cos:web:visual-stress:smoke

      - name: PHASE 9 Sales production adoption gate
        run: php tests/architecture/web_experience_production_sales.php

      - name: PHASE 10 Property production adoption gate
        run: php tests/architecture/web_experience_production_property.php

      - name: PHASE 11 Administration production adoption gate
        run: php tests/architecture/web_experience_production_administration.php

      - name: PHASE 12 Client Case production adoption gate
        run: php tests/architecture/web_experience_production_client_case.php

      - name: PHASE 13 residual control surface closure gate
        run: php tests/architecture/web_experience_residual_control_surfaces.php

      - name: PHASE 14 remaining shell closure gate
        run: php tests/architecture/web_experience_remaining_shells.php

      - name: PHASE 15 quality closure gate
        run: php tests/architecture/web_experience_quality_closure.php





      - name: Workspace Shell runtime smoke
        run: docker compose exec -T php php bin/console cos:web:shell:smoke

      - name: Domain UI extension runtime smoke
        run: docker compose exec -T php php bin/console cos:web:extensions:smoke

      - name: Unified UIAction runtime smoke
        run: docker compose exec -T php php bin/console cos:web:actions:smoke

      - name: Runtime-generated UIAction smoke
        run: docker compose exec -T php php bin/console cos:web:runtime-actions:smoke

      - name: Interaction Components runtime smoke
        run: docker compose exec -T php php bin/console cos:web:interactions:smoke

      - name: Forms Platform runtime smoke
        run: docker compose exec -T php php bin/console cos:web:forms:smoke

      - name: Data Platform runtime smoke
        run: docker compose exec -T php php bin/console cos:web:data:smoke

      - name: Workspace Platform runtime smoke
        run: docker compose exec -T php php bin/console cos:web:workspace:smoke

      - name: Realtime Platform runtime smoke
        run: docker compose exec -T php php bin/console cos:web:realtime:smoke

      - name: Async Operations runtime smoke
        run: docker compose exec -T php php bin/console cos:web:async-operations:smoke

      - name: AI UI Platform runtime smoke
        run: docker compose exec -T php php bin/console cos:web:ai-ui:smoke

      - name: Mobile Foundation runtime smoke
        run: docker compose exec -T php php bin/console cos:web:mobile:smoke

      - name: PWA Foundation architecture gate
        run: php tests/architecture/web_experience_wave12_pwa.php

      - name: PWA Foundation runtime smoke
        run: docker compose exec -T php php bin/console cos:web:pwa:smoke

      - name: Native-ready architecture gate
        run: php tests/architecture/web_experience_wave12_native.php

      - name: Native-ready runtime smoke
        run: docker compose exec -T php php bin/console cos:web:native-ready:smoke

      - name: Web Security architecture gate
        run: php tests/architecture/web_experience_wave12_security.php

      - name: Web Security runtime smoke
        run: docker compose exec -T php php bin/console cos:web:security:smoke

      - name: Feature Flags architecture gate
        run: php tests/architecture/web_experience_wave12_feature_flags.php

      - name: Feature Flags runtime smoke
        run: docker compose exec -T php php bin/console cos:platform:feature-flags:smoke

      - name: Audit History architecture gate
        run: php tests/architecture/web_experience_wave12_audit_history.php

      - name: Audit History model unit
        run: php tests/unit/platform_audit_history.php

      - name: Audit History runtime smoke
        run: docker compose exec -T php php bin/console cos:platform:audit-history:smoke

      - name: UI Catalog architecture gate
        run: php tests/architecture/web_experience_wave12_ui_catalog.php

      - name: UI Catalog registry unit
        run: php tests/unit/ui_catalog_registry.php

      - name: UI Catalog runtime smoke
        run: docker compose exec -T php php bin/console cos:web:ui-catalog:smoke

      - name: Wave 12.23 architecture gate
        run: php tests/architecture/web_experience_wave12_testing.php

      - name: Wave 12.23 component contract
        run: php tests/component/web_experience_components.php

      - name: Wave 12.23 Panther suite readiness
        run: php -l symfony/tests/Panther/WebExperiencePantherTest.php

      - name: Wave 12.23 functional contract
        run: bash tests/functional/web_platform_contract.sh http://127.0.0.1:8081

      - name: Wave 12.23 browser quality
        env:
          BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: npm run test:web-quality -- http://127.0.0.1:8081

      - name: Upload Wave 12.23 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-12-23-web-quality
          path: tmp/web-quality
          if-no-files-found: warn

      - name: PHASE 15 WCAG accessibility
        env:
          BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: npm run test:web-accessibility -- http://127.0.0.1:8081

      - name: Upload PHASE 15 accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-15-web-accessibility
          path: tmp/web-accessibility
          if-no-files-found: warn

      - name: Wave 12.24 architecture gate
        run: php tests/architecture/web_experience_wave12_performance_observability.php

      - name: Wave 12.24 HTTP observability contract
        run: docker compose exec -T php php tests/http_correlation_contract.php

      - name: Wave 12.24 browser telemetry contract
        run: docker compose exec -T php php tests/web_telemetry_contract.php

      - name: Wave 12.24 performance budgets
        env:
          BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: npm run test:web-performance -- http://127.0.0.1:8081

      - name: Wave 12.25 Sales reference architecture gate
        run: php tests/architecture/web_experience_wave12_sales_reference.php

      - name: Wave 12.25 Sales production Twig lint
        run: docker compose exec -T php php bin/console lint:twig templates/experience/sales

      - name: Wave 12.26 Sales cutover architecture gate
        run: php tests/architecture/web_experience_wave12_sales_cutover.php

      - name: Wave 12.26 Sales access contract
        run: docker compose exec -T php php tests/sales_cutover_access_contract.php

      - name: Wave 12.26 Sales workspace smoke
        run: php tests/smoke/sales_workspace.php

      - name: Wave 12.26 Sales production routes
        run: |
          docker compose exec -T php php bin/console debug:router cos_web_sales_dashboard >/dev/null
          docker compose exec -T php php bin/console debug:router cos_web_sales_leads >/dev/null
          docker compose exec -T php php bin/console debug:router cos_web_sales_lead >/dev/null

      - name: Web Platform v1 freeze change-control
        env:
          COS_WEB_PLATFORM_FREEZE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$COS_WEB_PLATFORM_FREEZE_BASE_SHA" ] && ! printf '%s' "$COS_WEB_PLATFORM_FREEZE_BASE_SHA" | grep -Eq '^0{40}$'; then
            git fetch --no-tags --depth=1 origin "$COS_WEB_PLATFORM_FREEZE_BASE_SHA"
          fi
          php tests/architecture/web_platform_v1_freeze.php

      - name: Web Security response headers smoke
        run: |
          curl --fail --silent --head http://127.0.0.1:8081/ | grep -qi '^content-security-policy:'
          curl --fail --silent --head http://127.0.0.1:8081/ | grep -qi '^x-content-type-options: nosniff'

      - name: PWA static delivery smoke
        run: |
          curl --fail --silent http://127.0.0.1:8081/manifest.webmanifest | grep -q 'COS — Company Operating System'
          curl --fail --silent http://127.0.0.1:8081/offline.html | grep -q 'data-cos-offline-fallback'
          curl --fail --silent --head http://127.0.0.1:8081/sw.js | grep -qi '^service-worker-allowed: /'

      - name: Global Search runtime smoke
        run: docker compose exec -T php php bin/console cos:web:search:smoke

      - name: Native web cutover smoke
        run: |
          curl --fail --silent http://127.0.0.1:8081/ | grep -q 'Company Operating System'
          curl --fail --silent http://127.0.0.1:8081/auth/login | grep -q 'Вхід'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/cabinet)" = "302"
          curl --silent --head http://127.0.0.1:8081/cabinet | grep -qi '^location: /auth/login'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/dev/ui)" = "302"
          curl --silent --head http://127.0.0.1:8081/dev/ui | grep -qi '^location: /auth/login'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/dev/stress)" = "302"
          curl --silent --head http://127.0.0.1:8081/dev/stress | grep -qi '^location: /auth/login'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/dev/shell)" = "302"
          curl --silent --head http://127.0.0.1:8081/dev/shell | grep -qi '^location: /auth/login'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/dev/realtime)" = "302"
          curl --silent --head http://127.0.0.1:8081/dev/realtime | grep -qi '^location: /auth/login'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/workspace/ai)" = "302"
          curl --silent --head http://127.0.0.1:8081/workspace/ai | grep -qi '^location: /auth/login'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/workspace/search)" = "302"
          curl --silent --head http://127.0.0.1:8081/workspace/search | grep -qi '^location: /auth/login'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300 || true

      - name: Shutdown
        if: always()
        run: docker compose down -v --remove-orphans
