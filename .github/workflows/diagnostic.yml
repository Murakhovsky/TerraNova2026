name: COS Runtime Checks
on:
  push:
    branches: [COS]
  pull_request:
    branches: [COS]
jobs:
  runtime-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci

      - name: Frontend interface architecture
        run: |
          npm run build
          php tests/architecture/frontend_assets.php
          php tests/architecture/frontend_interface.php

      - name: Diagnostic checks
        run: |
          php tests/smoke/diagnostic_domain.php
          php tests/smoke/diagnostic_methodology_contract.php
          php tests/smoke/diagnostic_methodology.php
          php tests/smoke/diagnostic_phase_1_3.php
          php tests/smoke/diagnostic_phase_4_6.php
          php tests/smoke/diagnostic_methodology_studio.php
          php tests/smoke/diagnostic_v053.php
          php tests/smoke/diagnostic_v054.php
          php -r "require 'vendor/autoload.php'; (new Domains\\Diagnostic\\Methodology\\PackCompiler())->compile('resources/diagnostic/sales/0.1.0/sales-diagnostic-pack.json');"

      - name: Sales architecture and runtime checks
        run: |
          php tests/architecture/sales_readiness.php
          php tests/smoke/sales_composition_root.php
          php tests/smoke/client_case_commands.php
          php tests/smoke/deterministic_sales_processes.php
          php tests/smoke/crm_routing.php
          php tests/smoke/crm_webhook.php
          php tests/smoke/public_lead.php
          php tests/unit/sales_attention_detectors.php
          php tests/unit/sales_runtime_contract.php
          php tests/unit/sales_v03.php
          php tests/unit/sales_v04.php
          php tests/unit/sales_manager_operations.php

      - name: Property submission check
        run: php tests/smoke/property_submission.php

      - name: Property workflow check
        run: php tests/smoke/property_workflow.php

      - name: Telegram isolation check
        run: php tests/architecture/telegram_migration.php

  deploy-dev:
    name: Deploy COS to AWS dev
    needs: runtime-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/COS'
    runs-on: ubuntu-latest
    environment: AWS TN2026
    concurrency:
      group: cos-dev-deploy
      cancel-in-progress: false
    env:
      DEV_HOST: ${{ secrets.DEV_HOST }}
      DEV_USER: ${{ secrets.DEV_USER }}
      DEV_PORT: ${{ secrets.DEV_PORT }}
      DEV_PATH: ${{ vars.DEV_PATH }}
      DEV_HEALTHCHECK_URL: ${{ vars.DEV_HEALTHCHECK_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Validate deployment configuration
        run: |
          : "${DEV_HOST:?DEV_HOST secret is missing}"
          : "${DEV_USER:?DEV_USER secret is missing}"
          : "${DEV_PORT:?DEV_PORT secret is missing}"
          : "${DEV_PATH:?DEV_PATH environment variable is missing}"
          test -n "${{ secrets.DEV_SSH_KEY }}" || { echo "DEV_SSH_KEY secret is missing" >&2; exit 1; }

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' '${{ secrets.DEV_SSH_KEY }}' > ~/.ssh/dev_deploy_key
          chmod 600 ~/.ssh/dev_deploy_key
          ssh-keyscan -p "$DEV_PORT" -H "$DEV_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare server directory
        run: |
          REMOTE_PATH=$(printf '%q' "$DEV_PATH")
          ssh -i ~/.ssh/dev_deploy_key -p "$DEV_PORT" "$DEV_USER@$DEV_HOST" "mkdir -p -- $REMOTE_PATH"

      - name: Sync repository to dev server
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.docker' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='tmp/' \
            --exclude='public/uploads/' \
            -e "ssh -i ~/.ssh/dev_deploy_key -p $DEV_PORT" \
            ./ "$DEV_USER@$DEV_HOST:$DEV_PATH/"

      - name: Deploy containers and database migrations
        run: |
          REMOTE_PATH=$(printf '%q' "$DEV_PATH")
          ssh -i ~/.ssh/dev_deploy_key -p "$DEV_PORT" "$DEV_USER@$DEV_HOST" "cd $REMOTE_PATH && bash deploy/dev.sh"

      - name: Configure HTTPS reverse proxy
        if: env.DEV_HEALTHCHECK_URL != ''
        run: |
          DEV_DOMAIN="${DEV_HEALTHCHECK_URL#*://}"
          DEV_DOMAIN="${DEV_DOMAIN%%/*}"
          REMOTE_PATH=$(printf '%q' "$DEV_PATH")
          REMOTE_DOMAIN=$(printf '%q' "$DEV_DOMAIN")
          ssh -i ~/.ssh/dev_deploy_key -p "$DEV_PORT" "$DEV_USER@$DEV_HOST" \
            "cd $REMOTE_PATH && bash deploy/configure-dev-tls.sh $REMOTE_DOMAIN 127.0.0.1:8080"

      # Public checks are diagnostics only. The blocking application and TLS
      # checks run on the dev server, where CDN/WAF issues cannot cause a false
      # deployment failure.
      - name: External application health diagnostic
        if: env.DEV_HEALTHCHECK_URL != ''
        continue-on-error: true
        run: |
          curl --insecure --fail --show-error --silent --location \
            --retry 2 --retry-delay 2 --retry-connrefused \
            "$DEV_HEALTHCHECK_URL" > /dev/null

      - name: External TLS certificate diagnostic
        if: env.DEV_HEALTHCHECK_URL != ''
        continue-on-error: true
        run: |
          curl --fail --show-error --silent --location \
            --retry 2 --retry-delay 2 --retry-connrefused \
            "$DEV_HEALTHCHECK_URL" > /dev/null
