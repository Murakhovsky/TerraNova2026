name: COS Runtime Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  runtime-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci

      - name: Kernel and domain architecture gate
        run: |
          php tests/architecture/layer_dependencies.php
          php tests/architecture/domain_boundaries.php
          php tests/architecture/persistence_boundaries.php
          php tests/architecture/table_ownership.php
          php tests/architecture/domain_module_contract.php

      - name: Final frontend architecture
        run: |
          npm run build
          php tests/architecture/frontend_assets.php
          php tests/architecture/frontend_interface.php
          php tests/architecture/frontend_routes.php
          php tests/architecture/web_v012_production_closure.php

      - name: Zero legacy production gate
        run: php tests/architecture/zero_legacy_runtime.php

      - name: Canonical Symfony syntax
        run: |
          find symfony/src app/Kernel app/Platform app/Domains app/Infrastructure -type f -name '*.php' -print0 | xargs -0 -n1 php -l
