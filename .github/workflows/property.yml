name: Property Domain Checks
on:
  push:
    branches: [main]
    paths:
      - 'app/Domains/Property/**'
      - 'app/Domains/RealEstate/**'
      - 'app/Domains/Sales/**'
      - 'app/Bootstrap/PropertyServices.php'
      - 'app/Bootstrap/RealEstateServices.php'
      - 'app/Bootstrap/PropertyIdentityServices.php'
      - 'app/Bootstrap/PropertyAnalyticsServices.php'
      - 'app/Bootstrap/PropertyIntelligenceServices.php'
      - 'app/Bootstrap/PropertyNetworkServices.php'
      - 'app/Bootstrap/SalesServices.php'
      - 'app/Bootstrap/WebApplicationServices.php'
      - 'app/Bootstrap/SpatialModule.php'
      - 'app/Infrastructure/Platform/Analytics/Property*.php'
      - 'app/Infrastructure/Platform/Persistence/TableOwnership.php'
      - 'app/config/services_kernel.php'
      - 'app/Interfaces/Web/Routing/PropertyModuleRouteContributor.php'
      - 'app/migrations/*property*.sql'
      - 'app/migrations/*real_estate*.sql'
      - 'docs/04-domains/property/**'
      - 'docs/04-domains/real_estate/**'
      - 'symfony/src/Application/Property/**'
      - 'symfony/src/Application/RealEstate/**'
      - 'symfony/src/Http/Api/V1/Controller/PropertyController.php'
      - 'symfony/src/Http/Api/V1/Controller/RealEstateController.php'
      - 'symfony/src/Infrastructure/Persistence/Legacy/LegacyPropertyLocationReferenceAdapter.php'
      - 'symfony/src/Infrastructure/Persistence/Property/**'
      - 'symfony/config/routes.yaml'
      - 'symfony/config/services.yaml'
      - 'tests/architecture/property_*.php'
      - 'tests/unit/property_*.php'
      - 'tests/smoke/property_*.php'
      - '.github/workflows/property.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/Domains/Property/**'
      - 'app/Domains/RealEstate/**'
      - 'app/Domains/Sales/**'
      - 'app/Bootstrap/PropertyServices.php'
      - 'app/Bootstrap/RealEstateServices.php'
      - 'app/Bootstrap/PropertyIdentityServices.php'
      - 'app/Bootstrap/PropertyAnalyticsServices.php'
      - 'app/Bootstrap/PropertyIntelligenceServices.php'
      - 'app/Bootstrap/PropertyNetworkServices.php'
      - 'app/Bootstrap/SalesServices.php'
      - 'app/Bootstrap/WebApplicationServices.php'
      - 'app/Bootstrap/SpatialModule.php'
      - 'app/Infrastructure/Platform/Analytics/Property*.php'
      - 'app/Infrastructure/Platform/Persistence/TableOwnership.php'
      - 'app/config/services_kernel.php'
      - 'app/Interfaces/Web/Routing/PropertyModuleRouteContributor.php'
      - 'app/migrations/*property*.sql'
      - 'app/migrations/*real_estate*.sql'
      - 'docs/04-domains/property/**'
      - 'docs/04-domains/real_estate/**'
      - 'symfony/src/Application/Property/**'
      - 'symfony/src/Application/RealEstate/**'
      - 'symfony/src/Http/Api/V1/Controller/PropertyController.php'
      - 'symfony/src/Http/Api/V1/Controller/RealEstateController.php'
      - 'symfony/src/Infrastructure/Persistence/Legacy/LegacyPropertyLocationReferenceAdapter.php'
      - 'symfony/src/Infrastructure/Persistence/Property/**'
      - 'symfony/config/routes.yaml'
      - 'symfony/config/services.yaml'
      - 'tests/architecture/property_*.php'
      - 'tests/unit/property_*.php'
      - 'tests/smoke/property_*.php'
      - '.github/workflows/property.yml'

jobs:
  property-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: composer install --no-interaction --prefer-dist

      - name: Property architecture
        run: |
          php tests/architecture/property_domain_definition.php
          php tests/architecture/property_v021_runtime.php
          php tests/architecture/property_v022_tenant_boundary.php
          php tests/architecture/property_v030_registry_schema.php
          php tests/architecture/property_v040_identity_schema.php
          php tests/architecture/property_v050_inventory_schema.php
          php tests/architecture/property_v060_listing_schema.php
          php tests/architecture/property_v070_history_contracts_schema.php
          php tests/architecture/property_v071_sales_boundary.php
          php tests/architecture/property_v080_analytics.php
          php tests/architecture/property_v090_intelligence.php
          php tests/architecture/property_v0100_external_network.php
          php tests/architecture/property_v0110_hardening.php
          php tests/architecture/property_v0120_runtime_cutover.php
          php tests/architecture/property_v0130_real_estate_wave9_cutover.php

      - name: Property core model
        run: php tests/unit/property_v023_core_model.php

      - name: Property commands and events
        run: php tests/unit/property_v024_commands_events.php

      - name: Property asset registry and structure
        run: php tests/unit/property_v030_asset_registry_structure.php

      - name: Property identity provenance and relations
        run: php tests/unit/property_v040_identity_provenance.php

      - name: Property commercial inventory
        run: php tests/unit/property_v050_inventory.php

      - name: Property listings and publication
        run: php tests/unit/property_v060_listing_publication.php

      - name: Property history and cross-domain contracts
        run: php tests/unit/property_v070_history_contracts.php

      - name: Property V0.8 market analytics
        run: php tests/unit/property_v080_market_analytics.php

      - name: Property V0.9 intelligence
        run: php tests/unit/property_v090_intelligence.php

      - name: Property V0.10 external network
        run: php tests/unit/property_v0100_external_network.php

      - name: Property V0.11 canonical hardening and RESO interoperability
        run: php tests/unit/property_v0110_identity_reso.php

      - name: Property V0.12 canonical runtime cutover
        run: php tests/unit/property_v0120_runtime_cutover.php

      - name: Property / RealEstate Wave 9 cutover
        run: php tests/unit/property_v0130_real_estate_wave9.php

      - name: Property compatibility smoke
        run: |
          php tests/smoke/property_submission.php
          php tests/smoke/property_workflow.php

      - name: Property PHP lint
        run: |
          find app/Domains/Property -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find app/Domains/RealEstate -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l app/Bootstrap/RealEstateServices.php
          find symfony/src/Application/Property -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find symfony/src/Application/RealEstate -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l symfony/src/Http/Api/V1/Controller/PropertyController.php
          php -l symfony/src/Http/Api/V1/Controller/RealEstateController.php
          php -l symfony/src/Infrastructure/Persistence/Legacy/LegacyPropertyLocationReferenceAdapter.php
          find symfony/src/Infrastructure/Persistence/Property -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l app/Domains/Sales/Application/Contract/SalesDemandReadModelInterface.php
          php -l app/Domains/Sales/Infrastructure/ReadModel/MySql/MysqlSalesDemandReadModel.php
          php -l app/Domains/Sales/Infrastructure/Property/SalesPropertyReference.php
          php -l app/Domains/Sales/Infrastructure/ReadModel/MySql/MysqlClientCaseReadModel.php
          php -l app/Domains/Sales/Infrastructure/Persistence/MySql/MysqlClientCaseCommandRepository.php
          php -l app/Domains/Sales/Infrastructure/Persistence/MySql/MysqlSalesAgentContextBuilder.php
          php -l app/Infrastructure/Platform/Analytics/PropertyMarketAnalyticsService.php
          php -l app/Infrastructure/Platform/Analytics/PropertyIntelligenceCoordinator.php
          php -l app/Infrastructure/Platform/Persistence/TableOwnership.php
          php -l app/Bootstrap/PropertyServices.php
          php -l app/Bootstrap/PropertyIdentityServices.php
          php -l app/Bootstrap/PropertyAnalyticsServices.php
          php -l app/Bootstrap/PropertyIntelligenceServices.php
          php -l app/Bootstrap/PropertyNetworkServices.php
          php -l app/Bootstrap/SalesServices.php
          php -l app/Bootstrap/WebApplicationServices.php
          php -l app/Bootstrap/SpatialModule.php
          php -l app/config/services_kernel.php
          php -l app/Interfaces/Web/Routing/PropertyModuleRouteContributor.php
          find tests/architecture -maxdepth 1 -name 'property_*.php' -print0 | xargs -0 -n1 php -l
          find tests/unit -maxdepth 1 -name 'property_*.php' -print0 | xargs -0 -n1 php -l
