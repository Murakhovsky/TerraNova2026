name: Generate Symfony Composer Lock

on:
  push:
    branches:
      - infra/symfony-composer-lock
    paths:
      - 'symfony/composer.json'
      - '.github/workflows/symfony-lock-generate.yml'
  workflow_dispatch:

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Symfony dependencies
        run: |
          docker run --rm \
            -v "$PWD/symfony:/app" \
            -w /app \
            composer:2 \
            composer update --no-dev --no-install --no-interaction --prefer-dist --no-progress --no-scripts
          test -s symfony/composer.lock

      - name: Upload composer lock
        uses: actions/upload-artifact@v4
        with:
          name: symfony-composer-lock
          path: symfony/composer.lock
          if-no-files-found: error
          retention-days: 1
