name: Sales V0.7.1 Contract
on:
  push:
    branches: [COS]
  pull_request:
    branches: [COS]
jobs:
  sales-v071:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist
      - name: Domain module architecture
        run: |
          php tests/architecture/domain_module_contract.php
          php tests/architecture/sales_v071_configuration.php
      - name: Sales runtime and UX contracts
        run: |
          php tests/unit/sales_v062.php
          php tests/unit/sales_v063.php
          php tests/unit/sales_v065.php
          node --check frontend/features/sales/workspace.js
