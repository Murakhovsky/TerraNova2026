name: Domain Milestone Docs Refresh

on:
  push:
    branches: [migration/domain-milestone-closure]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm run docs:generate
      - uses: actions/upload-artifact@v4
        with:
          name: domain-milestone-generated-reference
          path: docs/12-reference
          if-no-files-found: error
