name: V1 Domain Skeletons

on:
  push:
    branches: [main, migration/symfony, migration/domain-skeletons]
    paths:
      - 'app/Domains/Service/**'
      - 'app/Domains/Finance/**'
      - 'app/Domains/Procurement/**'
      - 'app/Domains/HR/**'
      - 'app/Domains/Construction/**'
      - 'app/Domains/RealEstate/**'
      - 'tests/unit/domain_skeletons.php'
      - 'tests/architecture/domain_skeleton_boundaries.php'
      - 'docs/architecture/DOMAIN_SKELETONS.md'
      - '.github/workflows/domain-skeletons.yml'
  pull_request:
    branches: [main, migration/symfony]
    paths:
      - 'app/Domains/Service/**'
      - 'app/Domains/Finance/**'
      - 'app/Domains/Procurement/**'
      - 'app/Domains/HR/**'
      - 'app/Domains/Construction/**'
      - 'app/Domains/RealEstate/**'
      - 'tests/unit/domain_skeletons.php'
      - 'tests/architecture/domain_skeleton_boundaries.php'
      - 'docs/architecture/DOMAIN_SKELETONS.md'
      - '.github/workflows/domain-skeletons.yml'
  workflow_dispatch:

jobs:
  skeleton-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php tests/architecture/domain_skeleton_boundaries.php
      - run: php tests/unit/domain_skeletons.php
      - run: find app/Domains/Service app/Domains/Finance app/Domains/Procurement app/Domains/HR app/Domains/Construction app/Domains/RealEstate -type f -name '*.php' -print0 | xargs -0 -n1 php -l
