name: COS Documentation

on:
  push:
    branches: [COS]
    paths:
      - 'docs/**'
      - 'app/Domains/*/module.php'
      - 'app/Kernel/Module/KernelVersion.php'
      - 'app/Kernel/Module/ModuleContributions.php'
      - 'app/Kernel/Module/ModuleExtensionRegistry.php'
      - 'app/Kernel/Module/ModuleManifest.php'
      - 'package.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'app/Domains/*/module.php'
      - 'app/Kernel/Module/KernelVersion.php'
      - 'app/Kernel/Module/ModuleContributions.php'
      - 'app/Kernel/Module/ModuleExtensionRegistry.php'
      - 'app/Kernel/Module/ModuleManifest.php'
      - 'package.json'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Check generated reference
        run: npm run docs:generate:check

      - name: Check documentation integrity
        run: npm run docs:check

      - name: Build documentation
        run: npm run docs:build

      - name: Upload generated site
        uses: actions/upload-artifact@v4
        with:
          name: cos-documentation
          path: public/docs
          if-no-files-found: error
