name: COS Documentation

on:
  push:
    branches: [COS]
    paths:
      - 'docs/**'
      - 'docker/nginx/default.conf'
      - 'deploy/configure-dev-tls.sh'
      - 'app/Domains/*/module.php'
      - 'app/Domains/*/Application/UseCase/**'
      - 'app/Domains/*/Automation/Event/**'
      - 'app/Domains/*/Bootstrap/*DomainModule.php'
      - 'app/Interfaces/Web/Routing/**'
      - 'app/Kernel/Module/KernelVersion.php'
      - 'app/Kernel/Module/ModuleContributions.php'
      - 'app/Kernel/Module/ModuleExtensionRegistry.php'
      - 'app/Kernel/Module/ModuleManifest.php'
      - 'package.json'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [COS]
    paths:
      - 'docs/**'
      - 'docker/nginx/default.conf'
      - 'deploy/configure-dev-tls.sh'
      - 'app/Domains/*/module.php'
      - 'app/Domains/*/Application/UseCase/**'
      - 'app/Domains/*/Automation/Event/**'
      - 'app/Domains/*/Bootstrap/*DomainModule.php'
      - 'app/Interfaces/Web/Routing/**'
      - 'app/Kernel/Module/KernelVersion.php'
      - 'app/Kernel/Module/ModuleContributions.php'
      - 'app/Kernel/Module/ModuleExtensionRegistry.php'
      - 'app/Kernel/Module/ModuleManifest.php'
      - 'package.json'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: cos-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Check generated reference
        run: npm run docs:generate:check

      - name: Check documentation integrity
        run: npm run docs:check

      - name: Build documentation
        run: COS_DOCS_BASE='/docs/' npm run docs:build

      - name: Upload generated documentation
        uses: actions/upload-artifact@v4
        with:
          name: cos-documentation
          path: public/docs
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy docs to AWS dev
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/COS'
    runs-on: ubuntu-latest
    environment: AWS TN2026
    env:
      DEV_HOST: ${{ secrets.DEV_HOST }}
      DEV_USER: ${{ secrets.DEV_USER }}
      DEV_PORT: ${{ secrets.DEV_PORT }}
      DEV_PATH: ${{ vars.DEV_PATH }}
      DEV_HEALTHCHECK_URL: ${{ vars.DEV_HEALTHCHECK_URL }}
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4

      - name: Download generated documentation
        uses: actions/download-artifact@v4
        with:
          name: cos-documentation
          path: public/docs

      - name: Validate deployment configuration
        run: |
          : "${DEV_HOST:?DEV_HOST secret is missing}"
          : "${DEV_USER:?DEV_USER secret is missing}"
          : "${DEV_PORT:?DEV_PORT secret is missing}"
          : "${DEV_PATH:?DEV_PATH environment variable is missing}"
          test -n "${{ secrets.DEV_SSH_KEY }}" || { echo "DEV_SSH_KEY secret is missing" >&2; exit 1; }

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' '${{ secrets.DEV_SSH_KEY }}' > ~/.ssh/dev_deploy_key
          chmod 600 ~/.ssh/dev_deploy_key
          ssh-keyscan -p "$DEV_PORT" -H "$DEV_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Publish documentation
        run: |
          REMOTE_DOCS="$DEV_PATH/public/docs"
          REMOTE_DOCS_ESCAPED=$(printf '%q' "$REMOTE_DOCS")
          ssh -i ~/.ssh/dev_deploy_key -p "$DEV_PORT" "$DEV_USER@$DEV_HOST" "mkdir -p -- $REMOTE_DOCS_ESCAPED"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/dev_deploy_key -p $DEV_PORT" \
            public/docs/ "$DEV_USER@$DEV_HOST:$REMOTE_DOCS/"

      - name: Enable static documentation index
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/dev_deploy_key -p $DEV_PORT" \
            docker/nginx/default.conf "$DEV_USER@$DEV_HOST:/tmp/cos-docs-nginx.conf"
          DEV_PATH_ESCAPED=$(printf '%q' "$DEV_PATH")
          ssh -i ~/.ssh/dev_deploy_key -p "$DEV_PORT" "$DEV_USER@$DEV_HOST" "DEV_PATH=$DEV_PATH_ESCAPED bash -s" <<'REMOTE'
          set -euo pipefail
          cat /tmp/cos-docs-nginx.conf > "$DEV_PATH/docker/nginx/default.conf"
          rm -f /tmp/cos-docs-nginx.conf
          cd "$DEV_PATH"

          if docker info >/dev/null 2>&1; then
            DOCKER=(docker)
          elif command -v sudo >/dev/null 2>&1 && sudo -n docker info >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "Deploy user cannot access Docker directly or through passwordless sudo." >&2
            exit 21
          fi

          "${DOCKER[@]}" compose exec -T nginx nginx -t
          "${DOCKER[@]}" compose exec -T nginx nginx -s reload

          NGINX_ID="$("${DOCKER[@]}" compose ps -q nginx)"
          test -n "$NGINX_ID"
          "${DOCKER[@]}" exec "$NGINX_ID" wget -q -T 5 -O /dev/null http://127.0.0.1/docs/
          echo "Container documentation check passed: /docs/"
          REMOTE

      - name: Configure host HTTPS documentation route
        if: env.DEV_HEALTHCHECK_URL != ''
        run: |
          DEV_DOMAIN="${DEV_HEALTHCHECK_URL#*://}"
          DEV_DOMAIN="${DEV_DOMAIN%%/*}"
          REMOTE_PATH=$(printf '%q' "$DEV_PATH")
          REMOTE_DOMAIN=$(printf '%q' "$DEV_DOMAIN")
          rsync -az \
            -e "ssh -i ~/.ssh/dev_deploy_key -p $DEV_PORT" \
            deploy/configure-dev-tls.sh "$DEV_USER@$DEV_HOST:/tmp/cos-configure-dev-tls.sh"
          ssh -i ~/.ssh/dev_deploy_key -p "$DEV_PORT" "$DEV_USER@$DEV_HOST" \
            "install -m 755 /tmp/cos-configure-dev-tls.sh $REMOTE_PATH/deploy/configure-dev-tls.sh && rm -f /tmp/cos-configure-dev-tls.sh && cd $REMOTE_PATH && bash deploy/configure-dev-tls.sh $REMOTE_DOMAIN 127.0.0.1:8080"

      - name: Verify documentation through server HTTPS
        if: env.DEV_HEALTHCHECK_URL != ''
        run: |
          DEV_DOMAIN="${DEV_HEALTHCHECK_URL#*://}"
          DEV_DOMAIN="${DEV_DOMAIN%%/*}"
          REMOTE_DOMAIN=$(printf '%q' "$DEV_DOMAIN")
          ssh -i ~/.ssh/dev_deploy_key -p "$DEV_PORT" "$DEV_USER@$DEV_HOST" "DEV_DOMAIN=$REMOTE_DOMAIN bash -s" <<'REMOTE'
          set -euo pipefail
          curl --fail --show-error --silent --location \
            --resolve "$DEV_DOMAIN:443:127.0.0.1" \
            "https://$DEV_DOMAIN/docs/" > /dev/null
          echo "Server HTTPS documentation check passed: https://$DEV_DOMAIN/docs/"
          REMOTE

      - name: External documentation diagnostic
        if: env.DEV_HEALTHCHECK_URL != ''
        continue-on-error: true
        run: |
          DOCS_ORIGIN=$(printf '%s' "$DEV_HEALTHCHECK_URL" | sed -E 's#(https?://[^/]+).*#\1#')
          curl --fail --show-error --silent --location \
            --retry 2 --retry-delay 2 --retry-connrefused \
            "$DOCS_ORIGIN/docs/" > /dev/null
          echo "External documentation check passed: $DOCS_ORIGIN/docs/"
