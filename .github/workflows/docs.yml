name: COS Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'resources/processes/**'
      - 'app/Domains/**'
      - 'app/Kernel/Module/**'
      - 'app/Kernel/Process/**'
      - 'app/Kernel/Execution/**'
      - 'app/Infrastructure/Process/**'
      - 'app/Infrastructure/Visualization/Architecture/**'
      - 'app/migrations/**'
      - 'symfony/config/routes.yaml'
      - 'deploy/configure-company-os-http.sh'
      - 'deploy/configure-dev-tls.sh'
      - 'package.json'
      - '.github/workflows/docs.yml'
      - '.github/workflows/diagnostic.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'resources/processes/**'
      - 'app/Domains/**'
      - 'app/Kernel/Module/**'
      - 'app/Kernel/Process/**'
      - 'app/Kernel/Execution/**'
      - 'app/Infrastructure/Process/**'
      - 'app/Infrastructure/Visualization/Architecture/**'
      - 'app/migrations/**'
      - 'symfony/config/routes.yaml'
      - 'deploy/configure-company-os-http.sh'
      - 'deploy/configure-dev-tls.sh'
      - 'package.json'
      - '.github/workflows/docs.yml'
      - '.github/workflows/diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cos-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Generate reference from current checkout
        run: npm run docs:generate

      - name: Verify committed generated reference drift
        run: |
          DRIFT=$(git status --porcelain -- docs/12-reference)
          if [ -n "$DRIFT" ]; then
            echo "::group::Generated reference drift summary"
            git status --short -- docs/12-reference
            git diff -- docs/12-reference
            echo "::endgroup::"

            for FILE in docs/12-reference/*.md; do
              if ! git diff --quiet -- "$FILE" || ! git ls-files --error-unmatch "$FILE" >/dev/null 2>&1; then
                echo "::group::Generated file: $FILE"
                printf '%s\n' "---BEGIN-GENERATED-FILE:$FILE---"
                cat "$FILE"
                printf '%s\n' "---END-GENERATED-FILE:$FILE---"
                echo "::endgroup::"
              fi
            done

            echo "::error::Committed docs/12-reference is stale. Run npm run docs:generate and commit the generated reference changes."
            exit 1
          fi
          echo "Committed generated reference matches current checkout."

      - name: Verify generated reference
        run: npm run docs:generate:check

      - name: Check documentation integrity
        run: npm run docs:check

      - name: Build documentation
        run: COS_DOCS_BASE='/docs/' npm run docs:build

      - name: Upload generated documentation
        uses: actions/upload-artifact@v4
        with:
          name: cos-documentation
          path: public/docs
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy docs to AWS dev
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: AWS TN2026
    concurrency:
      group: cos-dev-deploy
      cancel-in-progress: false
    env:
      DEV_HOST: ${{ secrets.DEV_HOST }}
      DEV_USER: ${{ secrets.DEV_USER }}
      DEV_PORT: ${{ secrets.DEV_PORT }}
      DEV_PATH: ${{ vars.DEV_PATH }}
      COMPANY_OS_DOMAIN: company-os.shop
      COMPANY_OS_DOCS_URL: https://company-os.shop/docs/
      COS_PUBLIC_STATIC_ROOT: /var/www/company-os
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4

      - name: Download generated documentation
        uses: actions/download-artifact@v4
        with:
          name: cos-documentation
          path: public/docs

      - name: Validate deployment configuration
        run: |
          : "${DEV_HOST:?DEV_HOST secret is missing}"
          : "${DEV_USER:?DEV_USER secret is missing}"
          : "${DEV_PORT:?DEV_PORT secret is missing}"
          : "${DEV_PATH:?DEV_PATH environment variable is missing}"
          : "${COMPANY_OS_DOMAIN:?COMPANY_OS_DOMAIN is missing}"
          : "${COMPANY_OS_DOCS_URL:?COMPANY_OS_DOCS_URL is missing}"
          : "${COS_PUBLIC_STATIC_ROOT:?COS_PUBLIC_STATIC_ROOT is missing}"
          test -n "${{ secrets.DEV_SSH_KEY }}" || { echo "DEV_SSH_KEY secret is missing" >&2; exit 1; }

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' '${{ secrets.DEV_SSH_KEY }}' > ~/.ssh/dev_deploy_key
          chmod 600 ~/.ssh/dev_deploy_key
          ssh-keyscan -p "$DEV_PORT" -H "$DEV_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Publish documentation outside application runtime
        run: |
          REMOTE_STAGE="/tmp/cos-docs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/dev_deploy_key -p "$DEV_PORT" "$DEV_USER@$DEV_HOST" \
            "rm -rf -- '$REMOTE_STAGE' && mkdir -p -- '$REMOTE_STAGE'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/dev_deploy_key -p $DEV_PORT" \
            public/docs/ "$DEV_USER@$DEV_HOST:$REMOTE_STAGE/"
          ssh -i ~/.ssh/dev_deploy_key -p "$DEV_PORT" "$DEV_USER@$DEV_HOST" \
            "sudo -n install -d -m 755 '$COS_PUBLIC_STATIC_ROOT/docs' && \
             sudo -n rsync -a --delete '$REMOTE_STAGE/' '$COS_PUBLIC_STATIC_ROOT/docs/' && \
             sudo -n chmod -R a+rX '$COS_PUBLIC_STATIC_ROOT/docs' && \
             rm -rf -- '$REMOTE_STAGE'"

      - name: Configure company-os.shop HTTPS documentation route
        run: |
          REMOTE_PATH=$(printf '%q' "$DEV_PATH")
          REMOTE_DOMAIN=$(printf '%q' "$COMPANY_OS_DOMAIN")
          rsync -az -e "ssh -i ~/.ssh/dev_deploy_key -p $DEV_PORT" deploy/configure-dev-tls.sh "$DEV_USER@$DEV_HOST:/tmp/cos-configure-dev-tls.sh"
          ssh -i ~/.ssh/dev_deploy_key -p "$DEV_PORT" "$DEV_USER@$DEV_HOST" \
            "install -m 755 /tmp/cos-configure-dev-tls.sh $REMOTE_PATH/deploy/configure-dev-tls.sh && \
             rm -f /tmp/cos-configure-dev-tls.sh && \
             cd $REMOTE_PATH && \
             COS_PUBLIC_STATIC_ROOT='$COS_PUBLIC_STATIC_ROOT' bash deploy/configure-dev-tls.sh $REMOTE_DOMAIN 127.0.0.1:8081"

      - name: Origin documentation diagnostic
        run: |
          ssh -i ~/.ssh/dev_deploy_key -p "$DEV_PORT" "$DEV_USER@$DEV_HOST" \
            "sudo -n test -s '$COS_PUBLIC_STATIC_ROOT/docs/index.html' && \
             curl --fail --show-error --silent \
               --resolve '$COMPANY_OS_DOMAIN:443:127.0.0.1' \
               'https://$COMPANY_OS_DOMAIN/docs/' > /dev/null"

      - name: Public documentation DNS preflight
        run: |
          getent ahostsv4 "$COMPANY_OS_DOMAIN"
          python3 - <<'PY'
          import json
          import urllib.request

          domain = 'company-os.shop'
          checks = [
              ('Google', f'https://dns.google/resolve?name={domain}&type=A', {}),
              ('Cloudflare', f'https://cloudflare-dns.com/dns-query?name={domain}&type=A', {'Accept': 'application/dns-json'}),
          ]
          for provider, url, headers in checks:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=10) as response:
                  payload = json.load(response)
              answers = [item.get('data') for item in payload.get('Answer', []) if item.get('type') == 1]
              if payload.get('Status') != 0 or not answers:
                  raise SystemExit(f'{provider} cannot resolve {domain} to an IPv4 address: {payload}')
              print(f'{provider}: {domain} -> {", ".join(answers)}')
          PY

      - name: External company-os.shop documentation diagnostic
        run: |
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 --retry-all-errors "$COMPANY_OS_DOCS_URL" > /tmp/cos-docs-index.html
          test -s /tmp/cos-docs-index.html
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 --retry-all-errors "https://$COMPANY_OS_DOMAIN/docs" > /dev/null
          echo "Public documentation is healthy: $COMPANY_OS_DOCS_URL"
