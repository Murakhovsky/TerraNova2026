name: Live Cutover Recheck

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-cutover-recheck.yml'

permissions:
  contents: read

jobs:
  live-recheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify deployed COS public routes
        run: |
          set -euo pipefail
          for path in /cos /cos/en /cos/en/domains/sales; do
            code="$(curl --silent --show-error --output /tmp/body --write-out '%{http_code}' --max-time 20 "https://company-os.shop$path")"
            echo "$path -> $code"
            test "$code" = "200"
            test -s /tmp/body
          done
