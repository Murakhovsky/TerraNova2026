name: Refresh Symfony Security Lock

on:
  push:
    branches:
      - migration/symfony-security-bridge
    paths:
      - '.github/workflows/symfony-security-lock-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lock Symfony Security dependencies for PHP 8.3 runtime
        run: |
          docker run --rm \
            -v "$PWD/symfony:/app" \
            -w /app \
            composer:2 \
            composer update symfony/security-bundle --with-all-dependencies --no-install --no-interaction --no-progress --no-scripts
          test -s symfony/composer.lock

      - name: Commit refreshed lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add symfony/composer.lock
          git diff --cached --quiet && exit 0
          git commit -m "MIGRATION — lock Symfony Security dependencies"
          git push origin HEAD:migration/symfony-security-bridge
