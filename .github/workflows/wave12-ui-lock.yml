name: Wave 12.2 Composer Lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Resolve Wave 12.2 Symfony UX dependencies
        run: >
          composer update
          symfony/form
          symfony/translation
          symfony/ux-autocomplete
          symfony/ux-chartjs
          symfony/ux-dropzone
          symfony/ux-icons
          symfony/ux-map
          symfony/ux-toolkit
          symfony/ux-translator
          --working-dir=symfony
          --with-all-dependencies
          --no-interaction
          --prefer-dist
          --no-progress
          --no-scripts
          --no-plugins
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add symfony/composer.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Wave 12.2: lock Symfony UX toolkit dependencies"
          git push origin HEAD:${{ github.head_ref }}
