name: Runtime

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'symfony/**'
      - 'resources/experience/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'deploy/**'
      - 'tests/**'
      - 'resources/contracts/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'bin/verify'
      - 'bin/ci/**'
      - '.github/workflows/runtime.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  federation-mysql:
    name: Federation MySQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Host PHP + MySQL, not the whole Docker/Nginx/frontend image.
    # Mirrors real schema migrations and real MySQL-backed test repositories.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cos
          MYSQL_USER: cos
          MYSQL_PASSWORD: ci-cos-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      APP_ENV: prod
      APP_DEBUG: '0'
      APP_SECRET: ci-app-secret-0123456789abcdef
      SYMFONY_APP_SECRET: ci-app-secret-0123456789abcdef
      COS_ORGANIZATION_ID: default
      COS_AGENT_LLM_MODE: fixture
      LLM_PROVIDER: fixture
      LLM_MODEL: ci-fixture
      SPATIAL_JWT_SECRET: ci-spatial-secret-0123456789abcdef
      N8N_WEBHOOK_SECRET: ci-n8n-secret
      MERCURE_JWT_SECRET: ci-mercure-secret-0123456789abcdef
      MERCURE_PUBLIC_URL: http://127.0.0.1:8081/.well-known/mercure
      DATABASE_URL: mysql://cos:ci-cos-password@127.0.0.1:3306/cos?serverVersion=8.4.0&charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379
      MESSENGER_TRANSPORT_DSN: redis://127.0.0.1:6379/cos_async
      MESSENGER_FAILED_TRANSPORT_DSN: redis://127.0.0.1:6379/cos_failed
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: cos
      DB_USERNAME: cos
      DB_PASSWORD: ci-cos-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_mysql, curl, zip, redis, pcntl
          coverage: none
      - name: Cache Symfony Composer archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: symfony-composer-${{ runner.os }}-php83-${{ hashFiles('symfony/composer.lock') }}
          restore-keys: |
            symfony-composer-${{ runner.os }}-php83-
      - name: Install Symfony dependencies
        working-directory: symfony
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Apply real MySQL schemas
        run: |
          php symfony/bin/console cos:schema:migrate
          php symfony/bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
      - name: Federation single-writer architecture gate
        run: php tests/architecture/federation_canonical_goal_cutover.php
      - name: Federation core MySQL admission/receipt/Goal E2E
        env:
          COS_TEST_AUTOLOAD: ${{ github.workspace }}/symfony/vendor/autoload.php
        run: |
          set -euo pipefail
          php tests/integration/workflow_federation_plan_evidence_mysql.php
          php tests/integration/workflow_action_claim_admission_mysql.php
          php tests/integration/workflow_action_receipt_mysql.php
          php tests/integration/federation_canonical_goal_e2e_mysql.php
      - name: Federation historical cutover and non-Action MySQL
        env:
          COS_TEST_AUTOLOAD: ${{ github.workspace }}/symfony/vendor/autoload.php
        run: |
          set -euo pipefail
          php tests/integration/federation_historical_cutover_mysql.php
          php tests/integration/federation_non_action_goal_mysql.php
      - name: Publish per-step timings
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_TIMING_JOB: Federation MySQL
        run: python3 bin/ci/step_timings.py
      - name: Upload timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timings-federation
          path: ${{ runner.temp }}/cos-ci-timings.json
          if-no-files-found: ignore
          retention-days: 14

  capital-markets-unit:
    name: Capital Markets Pack
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Cache root Composer archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: root-composer-${{ runner.os }}-php83-${{ hashFiles('composer.lock') }}
          restore-keys: |
            root-composer-${{ runner.os }}-php83-
      - name: Install root dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Build frontend dependencies for parity
        run: npm ci && npm run build
      - name: Capital Markets Capital Risk and Decision Workspace acceptance
        run: |
          php tests/unit/capital_markets_cross_venue_discovery.php
          php tests/integration/capital_markets_cross_venue_operator.php
          php tests/unit/realtime_hub_origin.php
          php tests/unit/capital_markets_realized_pnl_windows.php
          php tests/unit/capital_markets_historical_basis.php
          php tests/unit/capital_markets_portfolio_nav_windows.php
          php tests/unit/capital_markets_nav_snapshot_producer.php
          php tests/unit/capital_markets_nav_independent_reconciliation.php
          php tests/unit/capital_markets_paper_nav.php
          php tests/unit/capital_markets_nav_source_freshness.php
          php tests/unit/capital_markets_nav_spot_mark_evidence.php
          php tests/unit/capital_markets_nav_financial_evidence.php
          php tests/unit/capital_markets_nav_source_document.php
          php tests/unit/capital_markets_nav_statement_reconciliation.php
          php tests/unit/capital_markets_nav_remediation_planner.php
          php tests/unit/capital_markets_ledger_integrity_audit.php
          php tests/integration/capital_markets_capital_risk_acceptance.php
          php tests/integration/capital_markets_capital_risk_manager_acceptance.php
          php tests/unit/capital_markets_decision_workspace_projection.php
          php tests/unit/capital_markets_decision_workspace_visibility.php
          php tests/unit/capital_markets_decision_workspace_freshness.php
          php tests/integration/capital_markets_decision_workspace_acceptance.php
          php tests/integration/capital_markets_decision_workspace_manager_acceptance.php
      - name: Publish per-step timings
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_TIMING_JOB: Capital Markets Pack
        run: python3 bin/ci/step_timings.py
      - name: Upload timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timings-capital-markets
          path: ${{ runner.temp }}/cos-ci-timings.json
          if-no-files-found: ignore
          retention-days: 14

  runtime:
    name: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MYSQL_DATABASE: cos
      MYSQL_USER: cos
      MYSQL_PASSWORD: ci-cos-password
      MYSQL_ROOT_PASSWORD: ci-root-password
      SYMFONY_APP_SECRET: ci-app-secret-0123456789abcdef
      COS_ORGANIZATION_ID: default
      COS_AGENT_LLM_MODE: fixture
      LLM_PROVIDER: fixture
      LLM_MODEL: ci-fixture
      SPATIAL_JWT_SECRET: ci-spatial-secret-0123456789abcdef
      N8N_WEBHOOK_SECRET: ci-n8n-secret
      MERCURE_JWT_SECRET: ci-mercure-secret-0123456789abcdef
      MERCURE_PUBLIC_URL: http://127.0.0.1:8081/.well-known/mercure
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Cache root Composer archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: root-composer-${{ runner.os }}-php83-${{ hashFiles('composer.lock') }}
          restore-keys: |
            root-composer-${{ runner.os }}-php83-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: npm run build
      - name: Current verification
        run: bash bin/verify fast
      - name: Compose validation
        run: docker compose config --quiet
      # Load cache-backed production images into the runner's Docker engine.
      # Subsequent "docker compose up" uses these exact local tags without
      # an implicit rebuild. Each service has its own mutable GHA cache scope.
      - name: Initialize BuildKit
        uses: docker/setup-buildx-action@v3
      - name: Build PHP runtime (BuildKit GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/symfony/php/Dockerfile
          load: true
          tags: cos-symfony-php:local
          cache-from: type=gha,scope=cos-runtime-php-v1
          cache-to: type=gha,scope=cos-runtime-php-v1,mode=max,ignore-error=true
      - name: Build Nginx runtime (BuildKit GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/symfony/nginx/Dockerfile
          load: true
          tags: cos-nginx:latest
          cache-from: type=gha,scope=cos-runtime-nginx-v1
          cache-to: type=gha,scope=cos-runtime-nginx-v1,mode=max,ignore-error=true
      - name: Verify runtime image tags
        run: |
          docker image inspect cos-symfony-php:local >/dev/null
          docker image inspect cos-nginx:latest >/dev/null
      - name: Start dependencies
        run: docker compose up -d --wait mysql redis mercure
      - name: Apply schema
        run: |
          docker compose run --rm --no-deps php php bin/console cos:schema:migrate
          docker compose run --rm --no-deps php php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
      - name: Verify Capital Markets universe in production image
        run: |
          docker compose run --rm --no-deps php sh -c 'test -r /var/www/html/resources/capital-markets/universes/binance-bstocks-2026-09-27.csv && test "$(wc -l < /var/www/html/resources/capital-markets/universes/binance-bstocks-2026-09-27.csv)" -eq 81'
      - name: Start runtime
        run: docker compose up -d --remove-orphans
      - name: Federation retired executor source gate
        run: php tests/architecture/federation_canonical_goal_cutover.php
      - name: Canonical Workflow durable store MySQL acceptance
        run: |
          docker compose cp tests/integration/workflow_durable_store_mysql.php php:/tmp/workflow_durable_store_mysql.php
          docker compose exec -T \
            -e COS_TEST_AUTOLOAD=/var/www/html/symfony/vendor/autoload.php \
            -e DB_HOST=mysql \
            -e DB_PORT=3306 \
            -e DB_DATABASE="$MYSQL_DATABASE" \
            -e DB_USERNAME="$MYSQL_USER" \
            -e DB_PASSWORD="$MYSQL_PASSWORD" \
            php php /tmp/workflow_durable_store_mysql.php
      - name: Safe Workflow uncertain-effect recovery MySQL acceptance
        run: |
          docker compose cp tests/integration/workflow_safe_recovery_mysql.php php:/tmp/workflow_safe_recovery_mysql.php
          docker compose exec -T \
            -e COS_TEST_AUTOLOAD=/var/www/html/symfony/vendor/autoload.php \
            -e DB_HOST=mysql \
            -e DB_PORT=3306 \
            -e DB_DATABASE="$MYSQL_DATABASE" \
            -e DB_USERNAME="$MYSQL_USER" \
            -e DB_PASSWORD="$MYSQL_PASSWORD" \
            php php /tmp/workflow_safe_recovery_mysql.php
      - name: Canonical Action receipt read-only MySQL acceptance
        run: |
          docker compose cp tests/integration/workflow_action_receipt_mysql.php php:/tmp/workflow_action_receipt_mysql.php
          docker compose exec -T \
            -e COS_TEST_AUTOLOAD=/var/www/html/symfony/vendor/autoload.php \
            -e DB_HOST=mysql \
            -e DB_PORT=3306 \
            -e DB_DATABASE="$MYSQL_DATABASE" \
            -e DB_USERNAME="$MYSQL_USER" \
            -e DB_PASSWORD="$MYSQL_PASSWORD" \
            php php /tmp/workflow_action_receipt_mysql.php
      - name: Federation approved Plan adapter MySQL acceptance
        run: |
          docker compose cp tests/integration/workflow_federation_plan_evidence_mysql.php php:/tmp/workflow_federation_plan_evidence_mysql.php
          docker compose exec -T \
            -e COS_TEST_AUTOLOAD=/var/www/html/symfony/vendor/autoload.php \
            -e DB_HOST=mysql \
            -e DB_PORT=3306 \
            -e DB_DATABASE="$MYSQL_DATABASE" \
            -e DB_USERNAME="$MYSQL_USER" \
            -e DB_PASSWORD="$MYSQL_PASSWORD" \
            php php /tmp/workflow_federation_plan_evidence_mysql.php
      - name: Canonical Action claim admission MySQL acceptance
        run: |
          docker compose cp tests/integration/workflow_action_claim_admission_mysql.php php:/tmp/workflow_action_claim_admission_mysql.php
          docker compose exec -T \
            -e COS_TEST_AUTOLOAD=/var/www/html/symfony/vendor/autoload.php \
            -e DB_HOST=mysql \
            -e DB_PORT=3306 \
            -e DB_DATABASE="$MYSQL_DATABASE" \
            -e DB_USERNAME="$MYSQL_USER" \
            -e DB_PASSWORD="$MYSQL_PASSWORD" \
            php php /tmp/workflow_action_claim_admission_mysql.php
      - name: Federation canonical Goal-to-Outcome MySQL E2E acceptance
        run: |
          docker compose cp tests/integration/federation_canonical_goal_e2e_mysql.php php:/tmp/federation_canonical_goal_e2e_mysql.php
          docker compose exec -T \
            -e COS_TEST_AUTOLOAD=/var/www/html/symfony/vendor/autoload.php \
            -e DB_HOST=mysql \
            -e DB_PORT=3306 \
            -e DB_DATABASE="$MYSQL_DATABASE" \
            -e DB_USERNAME="$MYSQL_USER" \
            -e DB_PASSWORD="$MYSQL_PASSWORD" \
            php php /tmp/federation_canonical_goal_e2e_mysql.php
      - name: Federation historical no-replay cutover MySQL acceptance
        run: |
          docker compose cp tests/integration/federation_historical_cutover_mysql.php php:/tmp/federation_historical_cutover_mysql.php
          docker compose exec -T \
            -e COS_TEST_AUTOLOAD=/var/www/html/symfony/vendor/autoload.php \
            -e DB_HOST=mysql \
            -e DB_PORT=3306 \
            -e DB_DATABASE="$MYSQL_DATABASE" \
            -e DB_USERNAME="$MYSQL_USER" \
            -e DB_PASSWORD="$MYSQL_PASSWORD" \
            php php /tmp/federation_historical_cutover_mysql.php
      - name: Federation evidence-only non-Action MySQL acceptance
        run: |
          docker compose cp tests/integration/federation_non_action_goal_mysql.php php:/tmp/federation_non_action_goal_mysql.php
          docker compose exec -T \
            -e COS_TEST_AUTOLOAD=/var/www/html/symfony/vendor/autoload.php \
            -e DB_HOST=mysql \
            -e DB_PORT=3306 \
            -e DB_DATABASE="$MYSQL_DATABASE" \
            -e DB_USERNAME="$MYSQL_USER" \
            -e DB_PASSWORD="$MYSQL_PASSWORD" \
            php php /tmp/federation_non_action_goal_mysql.php
      - name: Workflow DAG worker predecessor receipts MySQL acceptance
        run: |
          docker compose cp tests/integration/workflow_worker_predecessor_receipts_mysql.php php:/tmp/workflow_worker_predecessor_receipts_mysql.php
          docker compose exec -T \
            -e COS_TEST_AUTOLOAD=/var/www/html/symfony/vendor/autoload.php \
            -e DB_HOST=mysql \
            -e DB_PORT=3306 \
            -e DB_DATABASE="$MYSQL_DATABASE" \
            -e DB_USERNAME="$MYSQL_USER" \
            -e DB_PASSWORD="$MYSQL_PASSWORD" \
            php php /tmp/workflow_worker_predecessor_receipts_mysql.php
      - name: Domain-owned Workflow receipt verifiers MySQL acceptance
        run: |
          docker compose cp tests/integration/workflow_domain_non_action_receipts_mysql.php php:/tmp/workflow_domain_non_action_receipts_mysql.php
          docker compose exec -T \
            -e COS_TEST_AUTOLOAD=/var/www/html/symfony/vendor/autoload.php \
            -e DB_HOST=mysql \
            -e DB_PORT=3306 \
            -e DB_DATABASE="$MYSQL_DATABASE" \
            -e DB_USERNAME="$MYSQL_USER" \
            -e DB_PASSWORD="$MYSQL_PASSWORD" \
            php php /tmp/workflow_domain_non_action_receipts_mysql.php
      - name: Sales Growth Engineering receipts MySQL acceptance
        run: |
          docker compose cp tests/integration/workflow_business_domain_receipts_mysql.php php:/tmp/workflow_business_domain_receipts_mysql.php
          docker compose exec -T \
            -e COS_TEST_AUTOLOAD=/var/www/html/symfony/vendor/autoload.php \
            -e DB_HOST=mysql \
            -e DB_PORT=3306 \
            -e DB_DATABASE="$MYSQL_DATABASE" \
            -e DB_USERNAME="$MYSQL_USER" \
            -e DB_PASSWORD="$MYSQL_PASSWORD" \
            php php /tmp/workflow_business_domain_receipts_mysql.php
      - name: Property reviewed identity Workflow receipt MySQL acceptance
        run: |
          docker compose cp tests/integration/workflow_property_identity_receipts_mysql.php php:/tmp/workflow_property_identity_receipts_mysql.php
          docker compose exec -T \
            -e COS_TEST_AUTOLOAD=/var/www/html/symfony/vendor/autoload.php \
            -e DB_HOST=mysql \
            -e DB_PORT=3306 \
            -e DB_DATABASE="$MYSQL_DATABASE" \
            -e DB_USERNAME="$MYSQL_USER" \
            -e DB_PASSWORD="$MYSQL_PASSWORD" \
            php php /tmp/workflow_property_identity_receipts_mysql.php
      - name: Engineering canonical technical execution and real SQL shadow MySQL acceptance
        run: |
          docker compose cp tests/integration/workflow_engineering_technical_shadow_mysql.php php:/tmp/workflow_engineering_technical_shadow_mysql.php
          docker compose exec -T \
            -e COS_TEST_AUTOLOAD=/var/www/html/symfony/vendor/autoload.php \
            -e DB_HOST=mysql \
            -e DB_PORT=3306 \
            -e DB_DATABASE="$MYSQL_DATABASE" \
            -e DB_USERNAME="$MYSQL_USER" \
            -e DB_PASSWORD="$MYSQL_PASSWORD" \
            php php /tmp/workflow_engineering_technical_shadow_mysql.php
      - name: Capital Markets paper NAV persistence integration
        run: |
          docker compose exec -T mysql mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "
            INSERT INTO tn_capital_market_paper_portfolios
              (organization_id,currency,initial_capital,available_capital,reserved_capital,realized_pnl)
            VALUES ('paper-nav-ci','USD',10000,10000,0,0);
          "
          docker compose exec -T php php bin/console cos:capital-markets:paper:nav:snapshot \
            --organization=paper-nav-ci --portfolio=paper-master > /tmp/cm-paper-nav.json
          grep -q '"status":"SIMULATED"' /tmp/cm-paper-nav.json
          grep -q '"equity":"10000"' /tmp/cm-paper-nav.json
          grep -q '"certified":false' /tmp/cm-paper-nav.json
          test "$(docker compose exec -T mysql mysql -N -B -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" \
            -e "SELECT COUNT(*) FROM tn_capital_market_paper_nav_snapshots WHERE organization_id='paper-nav-ci'")" = "1"
          test "$(docker compose exec -T mysql mysql -N -B -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" \
            -e "SELECT COUNT(*) FROM tn_capital_market_portfolio_valuation_snapshots WHERE organization_id='paper-nav-ci'")" = "0"
      - name: Capital Markets NAV financial evidence import integration
        run: |
          docker compose cp tests/fixtures/capital_markets_nav_external_flow.json php:/tmp/nav-external-flow.json
          docker compose cp tests/fixtures/capital_markets_nav_external_flow_source.txt php:/tmp/nav-source.txt
          docker compose exec -T php sh -c 'printf tampered > /tmp/nav-source-corrupt.txt'
          if docker compose exec -T php php bin/console cos:capital-markets:nav:evidence:import \
            --organization=default --portfolio=paper-master --file=/tmp/nav-external-flow.json --source-file=/tmp/nav-source-corrupt.txt \
            > /tmp/nav-source-rejected.json; then
            echo 'Source-document checksum mismatch was incorrectly accepted.'
            exit 1
          fi
          grep -q '"status":"REJECTED"' /tmp/nav-source-rejected.json
          docker compose exec -T php php bin/console cos:capital-markets:nav:evidence:import \
            --organization=default --portfolio=paper-master --file=/tmp/nav-external-flow.json --source-file=/tmp/nav-source.txt \
            > /tmp/nav-import.json
          grep -q 'RECORDED_PENDING_RECONCILIATION' /tmp/nav-import.json
          grep -q '"approved":false' /tmp/nav-import.json
          if docker compose exec -T php php bin/console cos:capital-markets:nav:evidence:import \
            --organization=default --portfolio=paper-master --file=/tmp/nav-external-flow.json --source-file=/tmp/nav-source.txt \
            > /tmp/nav-duplicate.json; then
            echo 'Duplicate source evidence was incorrectly accepted.'
            exit 1
          fi
          grep -q '"status":"REJECTED"' /tmp/nav-duplicate.json
          if docker compose exec -T php php bin/console cos:capital-markets:nav:collect \
            --organization=default --portfolio=paper-master > /tmp/nav-preflight.json; then
            echo 'Unreconciled NAV preflight was incorrectly accepted.'
            exit 1
          fi
          grep -q '"status":"BLOCKED"' /tmp/nav-preflight.json
          grep -q 'EXTERNAL_FLOW_RECONCILIATION_PENDING' /tmp/nav-preflight.json
          test "$(docker compose exec -T mysql mysql -N -B -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" \
            -e "SELECT COUNT(*) FROM tn_capital_market_nav_financial_evidence WHERE organization_id='default' AND evidence_id='ci-external-flow-20261007'")" = "1"
      - name: Engineering AgentRun FK integration
        run: |
          docker compose cp tests/integration/engineering_agent_run_fk.php php:/tmp/engineering_agent_run_fk.php
          docker compose exec -T \
            -e COS_TEST_AUTOLOAD=/var/www/html/symfony/vendor/autoload.php \
            -e DB_HOST=mysql \
            -e DB_PORT=3306 \
            -e DB_DATABASE="$MYSQL_DATABASE" \
            -e DB_USERNAME="$MYSQL_USER" \
            -e DB_PASSWORD="$MYSQL_PASSWORD" \
            php php /tmp/engineering_agent_run_fk.php
      - name: Engineering V0.1 operational acceptance
        run: |
          docker compose exec -T \
            -e APP_ENV=test \
            -e APP_DEBUG=1 \
            -e COS_ENGINEERING_FIXTURE_REPOSITORY_STATE=/tmp/cos-engineering-v01-fixture-repository.json \
            php php tests/integration/engineering_v01_operational.php
      - name: Sales governance remediation integration
        run: |
          docker compose cp tests/integration/sales_qualification_governance_repair.php php:/tmp/sales_qualification_governance_repair.php
          docker compose exec -T \
            -e COS_TEST_AUTOLOAD=/var/www/html/symfony/vendor/autoload.php \
            -e COS_TEST_MIGRATIONS=/var/www/html/app/migrations \
            -e DB_HOST=mysql \
            -e DB_PORT=3306 \
            -e DB_DATABASE="$MYSQL_DATABASE" \
            -e DB_USERNAME="$MYSQL_USER" \
            -e DB_PASSWORD="$MYSQL_PASSWORD" \
            php php /tmp/sales_qualification_governance_repair.php
      - name: Container and routes
        run: |
          docker compose exec -T php php bin/console lint:container
          docker compose exec -T php php bin/console debug:router > /tmp/routes.txt
          grep -q 'cos_symfony_home' /tmp/routes.txt
          docker compose exec -T php php bin/console cos:experience:inventory --strict --compile --no-interaction
          docker compose exec -T php php bin/console cos:experience:coverage --no-interaction
          docker compose exec -T php php bin/console cos:experience:design-system:audit --strict --no-interaction
          docker compose exec -T php php bin/console cos:experience:golden --no-interaction
          docker compose exec -T php php bin/console cos:experience:golden:decisions --no-interaction
          docker compose exec -T php php bin/console cos:experience:golden:structure --strict --no-interaction
      - name: Health
        run: |
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8081/health/dependencies && exit 0
            sleep 2
          done
          docker compose ps -a
          docker compose logs --no-color --tail=250 nginx php mysql redis
          exit 1
      - name: Runtime contracts
        run: |
          docker compose exec -T php php bin/console cos:architecture:smoke
          docker compose exec -T php php bin/console cos:web:experience:smoke
          docker compose exec -T php php bin/console cos:web:toolkit:smoke
          docker compose exec -T php php bin/console cos:web:design-system:smoke
          docker compose exec -T php php bin/console cos:experience:delivery growth.overview > /tmp/experience-delivery.json
          grep -q '"context_package"' /tmp/experience-delivery.json
          grep -q '"evidence_contract"' /tmp/experience-delivery.json
          grep -q '"pull_request_template"' /tmp/experience-delivery.json
          grep -q '"autonomy": "L2"' /tmp/experience-delivery.json
          grep -q '"auto_merge": false' /tmp/experience-delivery.json
          docker compose exec -T php php bin/console cos:experience:delivery global.search > /tmp/experience-delivery-l3.json
          grep -q '"autonomy": "L3"' /tmp/experience-delivery-l3.json
          docker compose exec -T php php bin/console cos:experience:migrate --no-interaction > /tmp/experience-migration.txt
          grep -q 'Workspace Migration' /tmp/experience-migration.txt
          grep -q 'BLOCKED' /tmp/experience-migration.txt
          docker compose exec -T php php bin/console cos:experience:external --json --no-interaction > /tmp/experience-external.json
          grep -q '"pages"' /tmp/experience-external.json
          grep -q '"public"' /tmp/experience-external.json
          grep -q '"portal"' /tmp/experience-external.json
          docker compose exec -T php php bin/console cos:experience:external:reference --strict --no-interaction
          docker compose exec -T php php bin/console cos:experience:release --json --no-interaction > /tmp/experience-release.json
          grep -q '"status"' /tmp/experience-release.json
          grep -q '"BLOCKED"' /tmp/experience-release.json
          docker compose exec -T php php bin/console cos:experience:assets --strict --no-interaction
          docker compose exec -T php php bin/console cos:experience:routes:debt --strict --no-interaction
      - name: Smoke vertical slices
        run: bash bin/verify smoke
      - name: Capital Markets Decision Workspace Twig lint
        run: docker compose exec -T php php bin/console lint:twig templates/experience/capital_markets/decision_workspace.html.twig

      - name: Production cutover Web routes
        env:
          COS_WEB_SMOKE_BASE_URL: http://127.0.0.1:8081
          COS_WEB_SMOKE_EMAIL: production-cutover-web@example.test
          COS_WEB_SMOKE_PASSWORD: Production-Cutover-Web-CI-Ab9!
          COS_WEB_FOREIGN_USER_EMAIL: foreign-tenant-user@example.test
          COS_CM_RESTRICTED_EMAIL: cm-limited-acceptance@example.test
          COS_CM_RESTRICTED_PASSWORD: CM-Limited-Acceptance-CI-Ab9!
        run: |
          WEB_HASH="$(php -r 'echo password_hash(getenv("COS_WEB_SMOKE_PASSWORD"), PASSWORD_DEFAULT);')"
          docker compose exec -T mysql mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "
            INSERT INTO tn_users (organization_id,email,password_hash,full_name,role,status)
            VALUES ('default','$COS_WEB_SMOKE_EMAIL','$WEB_HASH','Production Cutover Web','admin','active')
            ON DUPLICATE KEY UPDATE password_hash=VALUES(password_hash),role='admin',status='active';
            INSERT INTO cos_organization_memberships (organization_id,user_id,role,status)
            SELECT 'default',id,'admin','ACTIVE' FROM tn_users WHERE email='$COS_WEB_SMOKE_EMAIL'
            ON DUPLICATE KEY UPDATE role='admin',status='ACTIVE';
          "
          docker compose exec -T mysql mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "
            INSERT INTO cos_organizations (id,name,status)
            VALUES ('foreign-tenant','Foreign Tenant','ACTIVE')
            ON DUPLICATE KEY UPDATE name='Foreign Tenant',status='ACTIVE';
            INSERT INTO tn_users (organization_id,email,password_hash,full_name,role,status)
            VALUES ('foreign-tenant','$COS_WEB_FOREIGN_USER_EMAIL','$WEB_HASH','Foreign Tenant User','manager','active')
            ON DUPLICATE KEY UPDATE organization_id='foreign-tenant',full_name='Foreign Tenant User',role='manager',status='active';
          "
          WEB_USER_ID="$(docker compose exec -T mysql mysql -N -s -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "SELECT id FROM tn_users WHERE email='$COS_WEB_SMOKE_EMAIL' LIMIT 1;")"
          FOREIGN_USER_ID="$(docker compose exec -T mysql mysql -N -s -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "SELECT id FROM tn_users WHERE email='$COS_WEB_FOREIGN_USER_EMAIL' LIMIT 1;")"
          test -n "$WEB_USER_ID"
          test -n "$FOREIGN_USER_ID"
          docker compose exec -T php php bin/console cos:capital-markets:cutover enable \
            --organization=default \
            --actor="$WEB_USER_ID" \
            --confirm=ENABLE_CAPITAL_MARKETS \
            --reason="Crypto Spot/Perpetual browser acceptance"
          docker compose exec -T php php bin/console cos:growth:cutover enable \
            --organization=default \
            --actor="$WEB_USER_ID" \
            --confirm=ENABLE_GROWTH \
            --reason="UI cutover browser acceptance"
          {
            printf "SET @web_user_id=%s;\n" "$WEB_USER_ID"
            cat tests/fixtures/ui/dynamic_detail_acceptance.sql
          } | docker compose exec -T mysql mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE"
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_PATH="$CHROME_BIN" node tests/browser/production_cutover_routes.mjs
          COS_WEB_FOREIGN_USER_ID="$FOREIGN_USER_ID" CHROME_PATH="$CHROME_BIN" node tests/browser/production_cutover_functional.mjs
          test "$(docker compose exec -T mysql mysql -N -B -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "SELECT full_name FROM tn_users WHERE id=$FOREIGN_USER_ID AND organization_id='foreign-tenant' LIMIT 1")" = "Foreign Tenant User"
          if ! CHROME_PATH="$CHROME_BIN" node tests/browser/production_cutover_dynamic_details.mjs; then
            docker compose logs --no-color --tail=250 php nginx
            exit 1
          fi
          if ! CHROME_PATH="$CHROME_BIN" node tests/browser/capital_markets_decision_workspace.mjs; then
            docker compose logs --no-color --tail=300 php nginx
            exit 1
          fi
          # A real non-admin principal must not see portfolio/risk/audit data
          # through shared HTML projections or Opportunity JSON/CSV exports.
          RESTRICTED_HASH="$(php -r 'echo password_hash(getenv("COS_CM_RESTRICTED_PASSWORD"), PASSWORD_DEFAULT);')"
          docker compose exec -T mysql mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "
            INSERT INTO tn_users (organization_id,email,password_hash,full_name,role,status)
            VALUES ('default','$COS_CM_RESTRICTED_EMAIL','$RESTRICTED_HASH','Capital Markets Limited QA','manager','active')
            ON DUPLICATE KEY UPDATE password_hash=VALUES(password_hash),role='manager',status='active';
            INSERT INTO cos_organization_memberships (organization_id,user_id,role,status)
            SELECT 'default',id,'manager','ACTIVE' FROM tn_users WHERE email='$COS_CM_RESTRICTED_EMAIL'
            ON DUPLICATE KEY UPDATE role='manager',status='ACTIVE';
            INSERT INTO capital_market_user_capabilities (organization_id,user_id,capability,status,granted_by)
            SELECT 'default',id,'capital_markets.view','ACTIVE','cm-decision-workspace-ci'
            FROM tn_users WHERE email='$COS_CM_RESTRICTED_EMAIL'
            ON DUPLICATE KEY UPDATE status='ACTIVE';
            INSERT INTO capital_market_user_capabilities (organization_id,user_id,capability,status,granted_by)
            SELECT 'default',id,'capital_markets.opportunity.view','ACTIVE','cm-decision-workspace-ci'
            FROM tn_users WHERE email='$COS_CM_RESTRICTED_EMAIL'
            ON DUPLICATE KEY UPDATE status='ACTIVE';
          "
          if ! CHROME_PATH="$CHROME_BIN" node tests/browser/capital_markets_decision_workspace_visibility.mjs; then
            docker compose logs --no-color --tail=300 php nginx
            exit 1
          fi
      - name: Seed Sales functional acceptance
        env:
          SALES_E2E_EMAIL: sales-functional-acceptance@example.test
          SALES_E2E_PASSWORD: Sales-Functional-Acceptance-CI-Ab9!
        run: |
          SALES_HASH="$(php -r 'echo password_hash(getenv("SALES_E2E_PASSWORD"), PASSWORD_DEFAULT);')"
          docker compose exec -T mysql mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "
            INSERT INTO tn_users (organization_id,email,password_hash,full_name,role,status)
            VALUES ('default','$SALES_E2E_EMAIL','$SALES_HASH','Sales Functional Acceptance','admin','active')
            ON DUPLICATE KEY UPDATE password_hash=VALUES(password_hash),role='admin',status='active';
            INSERT INTO cos_organization_memberships (organization_id,user_id,role,status)
            SELECT 'default',id,'admin','ACTIVE' FROM tn_users WHERE email='$SALES_E2E_EMAIL'
            ON DUPLICATE KEY UPDATE role='admin',status='ACTIVE';
          "
          {
            printf "SET @e2e_email='%s';\n" "$SALES_E2E_EMAIL"
            cat tests/fixtures/ui/sales_functional_acceptance.sql
          } | docker compose exec -T mysql mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE"
      - name: Sales functional browser acceptance
        env:
          SALES_E2E_BASE_URL: http://127.0.0.1:8081
          SALES_E2E_EMAIL: sales-functional-acceptance@example.test
          SALES_E2E_PASSWORD: Sales-Functional-Acceptance-CI-Ab9!
          SALES_E2E_MUTATION_SAFE: '1'
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_PATH="$CHROME_BIN" node tests/browser/sales_workspace.mjs

      - name: Golden Eight browser QA
        env:
          GOLDEN_EIGHT_BASE_URL: http://127.0.0.1:8081
          GOLDEN_EIGHT_EMAIL: sales-functional-acceptance@example.test
          GOLDEN_EIGHT_PASSWORD: Sales-Functional-Acceptance-CI-Ab9!
          GOLDEN_EIGHT_OUTPUT_DIR: tmp/golden-eight
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_PATH="$CHROME_BIN" npm run test:golden-eight-quality

      - name: Upload Golden Eight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-eight-evidence
          path: tmp/golden-eight
          if-no-files-found: ignore
          retention-days: 14

      - name: External reference browser QA
        env:
          EXTERNAL_REFERENCE_BASE_URL: http://127.0.0.1:8081
          EXTERNAL_REFERENCE_EMAIL: sales-functional-acceptance@example.test
          EXTERNAL_REFERENCE_PASSWORD: Sales-Functional-Acceptance-CI-Ab9!
          EXTERNAL_REFERENCE_OUTPUT_DIR: tmp/external-reference
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_PATH="$CHROME_BIN" npm run test:external-reference-quality

      - name: Upload external reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-reference-evidence
          path: tmp/external-reference
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish per-step timings
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_TIMING_JOB: runtime
        run: python3 bin/ci/step_timings.py
      - name: Upload timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timings-runtime
          path: ${{ runner.temp }}/cos-ci-timings.json
          if-no-files-found: ignore
          retention-days: 14

  deploy-dev:
    name: Deploy main to AWS dev
    needs: [runtime, federation-mysql, capital-markets-unit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: AWS TN2026
    concurrency:
      group: cos-dev-deploy
      cancel-in-progress: false
    env:
      DEV_HOST: ${{ secrets.DEV_HOST }}
      DEV_USER: ${{ secrets.DEV_USER }}
      DEV_PORT: ${{ secrets.DEV_PORT }}
      DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
      DEV_PATH: ${{ vars.DEV_PATH }}
      COMPANY_OS_DOMAIN: company-os.shop
      COMPANY_OS_HEALTHCHECK_URL: https://company-os.shop/health/dependencies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build
      - name: Configure SSH
        run: |
          test -n "$DEV_HOST" && test -n "$DEV_USER" && test -n "$DEV_PORT" && test -n "$DEV_SSH_KEY" && test -n "$DEV_PATH"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/dev_deploy_key
          chmod 600 ~/.ssh/dev_deploy_key
          ssh-keyscan -p "$DEV_PORT" -H "$DEV_HOST" >> ~/.ssh/known_hosts
      - name: Sync repository
        run: |
          ssh -i ~/.ssh/dev_deploy_key -p "$DEV_PORT" "$DEV_USER@$DEV_HOST" "mkdir -p -- '$DEV_PATH'"
          rsync -az --delete \
            --exclude='.git/' --exclude='.env' --exclude='.env.docker' \
            --exclude='vendor/' --exclude='node_modules/' --exclude='tmp/' \
            --exclude='public/uploads/' --exclude='public/docs/' \
            -e "ssh -i ~/.ssh/dev_deploy_key -p $DEV_PORT" \
            ./ "$DEV_USER@$DEV_HOST:$DEV_PATH/"
      - name: Deploy
        run: |
          ssh -i ~/.ssh/dev_deploy_key -p "$DEV_PORT" "$DEV_USER@$DEV_HOST" \
            "cd '$DEV_PATH' && bash deploy/dev.sh && bash deploy/configure-company-os-http.sh '$COMPANY_OS_DOMAIN' 127.0.0.1:8081 && bash deploy/configure-dev-tls.sh '$COMPANY_OS_DOMAIN' 127.0.0.1:8081"
      - name: External health
        run: curl --fail --show-error --silent --location --retry 3 --retry-delay 2 --retry-connrefused "$COMPANY_OS_HEALTHCHECK_URL" > /dev/null
