name: Runtime

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'symfony/**'
      - 'resources/experience/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'deploy/**'
      - 'tests/smoke/**'
      - 'bin/verify'
      - '.github/workflows/runtime.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    env:
      MYSQL_DATABASE: cos
      MYSQL_USER: cos
      MYSQL_PASSWORD: ci-cos-password
      MYSQL_ROOT_PASSWORD: ci-root-password
      SYMFONY_APP_SECRET: ci-app-secret-0123456789abcdef
      COS_ORGANIZATION_ID: default
      COS_AGENT_LLM_MODE: fixture
      LLM_PROVIDER: fixture
      LLM_MODEL: ci-fixture
      SPATIAL_JWT_SECRET: ci-spatial-secret-0123456789abcdef
      N8N_WEBHOOK_SECRET: ci-n8n-secret
      MERCURE_JWT_SECRET: ci-mercure-secret-0123456789abcdef
      MERCURE_PUBLIC_URL: http://127.0.0.1:8081/.well-known/mercure
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: npm run build
      - name: Current verification
        run: bash bin/verify fast
      - name: Compose validation
        run: docker compose config --quiet
      - name: Build runtime
        run: docker compose build php nginx
      - name: Start dependencies
        run: docker compose up -d --wait mysql redis mercure
      - name: Apply schema
        run: |
          docker compose run --rm --no-deps php php bin/console cos:schema:migrate
          docker compose run --rm --no-deps php php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
      - name: Start runtime
        run: docker compose up -d --remove-orphans
      - name: Sales governance remediation integration
        run: |
          docker compose cp tests/integration/sales_qualification_governance_repair.php php:/tmp/sales_qualification_governance_repair.php
          docker compose exec -T \
            -e COS_TEST_AUTOLOAD=/var/www/html/symfony/vendor/autoload.php \
            -e COS_TEST_MIGRATIONS=/var/www/html/app/migrations \
            -e DB_HOST=mysql \
            -e DB_PORT=3306 \
            -e DB_DATABASE="$MYSQL_DATABASE" \
            -e DB_USERNAME="$MYSQL_USER" \
            -e DB_PASSWORD="$MYSQL_PASSWORD" \
            php php /tmp/sales_qualification_governance_repair.php
      - name: Container and routes
        run: |
          docker compose exec -T php php bin/console lint:container
          docker compose exec -T php php bin/console debug:router > /tmp/routes.txt
          grep -q 'cos_symfony_home' /tmp/routes.txt
          docker compose exec -T php php bin/console cos:experience:inventory --strict --compile --no-interaction
          docker compose exec -T php php bin/console cos:experience:coverage --no-interaction
          docker compose exec -T php php bin/console cos:experience:design-system:audit --strict --no-interaction
          docker compose exec -T php php bin/console cos:experience:golden --no-interaction
          docker compose exec -T php php bin/console cos:experience:golden:structure --strict --no-interaction
      - name: Health
        run: |
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8081/health/dependencies && exit 0
            sleep 2
          done
          docker compose ps -a
          docker compose logs --no-color --tail=250 nginx php mysql redis
          exit 1
      - name: Runtime contracts
        run: |
          docker compose exec -T php php bin/console cos:architecture:smoke
          docker compose exec -T php php bin/console cos:web:experience:smoke
          docker compose exec -T php php bin/console cos:web:toolkit:smoke
          docker compose exec -T php php bin/console cos:web:design-system:smoke
          docker compose exec -T php php bin/console cos:experience:delivery growth.overview > /tmp/experience-delivery.json
          grep -q '"context_package"' /tmp/experience-delivery.json
          grep -q '"evidence_contract"' /tmp/experience-delivery.json
          grep -q '"pull_request_template"' /tmp/experience-delivery.json
          docker compose exec -T php php bin/console cos:experience:migrate --no-interaction > /tmp/experience-migration.txt
          grep -q 'Workspace Migration' /tmp/experience-migration.txt
          grep -q 'BLOCKED' /tmp/experience-migration.txt
          docker compose exec -T php php bin/console cos:experience:external --json --no-interaction > /tmp/experience-external.json
          grep -q '"pages"' /tmp/experience-external.json
          grep -q '"public"' /tmp/experience-external.json
          grep -q '"portal"' /tmp/experience-external.json
          docker compose exec -T php php bin/console cos:experience:external:reference --strict --no-interaction
          docker compose exec -T php php bin/console cos:experience:release --json --no-interaction > /tmp/experience-release.json
          grep -q '"status"' /tmp/experience-release.json
          grep -q '"BLOCKED"' /tmp/experience-release.json
          docker compose exec -T php php bin/console cos:experience:assets --strict --no-interaction
      - name: Smoke vertical slices
        run: bash bin/verify smoke
      - name: Production cutover Web routes
        env:
          COS_WEB_SMOKE_BASE_URL: http://127.0.0.1:8081
          COS_WEB_SMOKE_EMAIL: production-cutover-web@example.test
          COS_WEB_SMOKE_PASSWORD: Production-Cutover-Web-CI-Ab9!
        run: |
          WEB_HASH="$(php -r 'echo password_hash(getenv("COS_WEB_SMOKE_PASSWORD"), PASSWORD_DEFAULT);')"
          docker compose exec -T mysql mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "
            INSERT INTO tn_users (organization_id,email,password_hash,full_name,role,status)
            VALUES ('default','$COS_WEB_SMOKE_EMAIL','$WEB_HASH','Production Cutover Web','admin','active')
            ON DUPLICATE KEY UPDATE password_hash=VALUES(password_hash),role='admin',status='active';
            INSERT INTO cos_organization_memberships (organization_id,user_id,role,status)
            SELECT 'default',id,'admin','ACTIVE' FROM tn_users WHERE email='$COS_WEB_SMOKE_EMAIL'
            ON DUPLICATE KEY UPDATE role='admin',status='ACTIVE';
          "
          WEB_USER_ID="$(docker compose exec -T mysql mysql -N -s -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "SELECT id FROM tn_users WHERE email='$COS_WEB_SMOKE_EMAIL' LIMIT 1;")"
          test -n "$WEB_USER_ID"
          docker compose exec -T php php bin/console cos:growth:cutover enable \
            --organization=default \
            --actor="$WEB_USER_ID" \
            --confirm=ENABLE_GROWTH \
            --reason="UI cutover browser acceptance"
          {
            printf "SET @web_user_id=%s;\n" "$WEB_USER_ID"
            cat tests/fixtures/ui/dynamic_detail_acceptance.sql
          } | docker compose exec -T mysql mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE"
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_PATH="$CHROME_BIN" node tests/browser/production_cutover_routes.mjs
          CHROME_PATH="$CHROME_BIN" node tests/browser/production_cutover_functional.mjs
          if ! CHROME_PATH="$CHROME_BIN" node tests/browser/production_cutover_dynamic_details.mjs; then
            docker compose logs --no-color --tail=250 php nginx
            exit 1
          fi
      - name: Seed Sales functional acceptance
        env:
          SALES_E2E_EMAIL: sales-functional-acceptance@example.test
          SALES_E2E_PASSWORD: Sales-Functional-Acceptance-CI-Ab9!
        run: |
          SALES_HASH="$(php -r 'echo password_hash(getenv("SALES_E2E_PASSWORD"), PASSWORD_DEFAULT);')"
          docker compose exec -T mysql mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "
            INSERT INTO tn_users (organization_id,email,password_hash,full_name,role,status)
            VALUES ('default','$SALES_E2E_EMAIL','$SALES_HASH','Sales Functional Acceptance','admin','active')
            ON DUPLICATE KEY UPDATE password_hash=VALUES(password_hash),role='admin',status='active';
            INSERT INTO cos_organization_memberships (organization_id,user_id,role,status)
            SELECT 'default',id,'admin','ACTIVE' FROM tn_users WHERE email='$SALES_E2E_EMAIL'
            ON DUPLICATE KEY UPDATE role='admin',status='ACTIVE';
          "
          {
            printf "SET @e2e_email='%s';\n" "$SALES_E2E_EMAIL"
            cat tests/fixtures/ui/sales_functional_acceptance.sql
          } | docker compose exec -T mysql mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE"
      - name: Sales functional browser acceptance
        env:
          SALES_E2E_BASE_URL: http://127.0.0.1:8081
          SALES_E2E_EMAIL: sales-functional-acceptance@example.test
          SALES_E2E_PASSWORD: Sales-Functional-Acceptance-CI-Ab9!
          SALES_E2E_MUTATION_SAFE: '1'
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_PATH="$CHROME_BIN" node tests/browser/sales_workspace.mjs

      - name: Golden Eight browser QA
        env:
          GOLDEN_EIGHT_BASE_URL: http://127.0.0.1:8081
          GOLDEN_EIGHT_EMAIL: sales-functional-acceptance@example.test
          GOLDEN_EIGHT_PASSWORD: Sales-Functional-Acceptance-CI-Ab9!
          GOLDEN_EIGHT_OUTPUT_DIR: tmp/golden-eight
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_PATH="$CHROME_BIN" npm run test:golden-eight-quality

      - name: Upload Golden Eight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-eight-evidence
          path: tmp/golden-eight
          if-no-files-found: warn
          retention-days: 14

      - name: External reference browser QA
        env:
          EXTERNAL_REFERENCE_BASE_URL: http://127.0.0.1:8081
          EXTERNAL_REFERENCE_EMAIL: sales-functional-acceptance@example.test
          EXTERNAL_REFERENCE_PASSWORD: Sales-Functional-Acceptance-CI-Ab9!
          EXTERNAL_REFERENCE_OUTPUT_DIR: tmp/external-reference
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_PATH="$CHROME_BIN" npm run test:external-reference-quality

      - name: Upload external reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-reference-evidence
          path: tmp/external-reference
          if-no-files-found: warn
          retention-days: 14

  deploy-dev:
    name: Deploy main to AWS dev
    needs: runtime
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: AWS TN2026
    concurrency:
      group: cos-dev-deploy
      cancel-in-progress: false
    env:
      DEV_HOST: ${{ secrets.DEV_HOST }}
      DEV_USER: ${{ secrets.DEV_USER }}
      DEV_PORT: ${{ secrets.DEV_PORT }}
      DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
      DEV_PATH: ${{ vars.DEV_PATH }}
      COMPANY_OS_DOMAIN: company-os.shop
      COMPANY_OS_HEALTHCHECK_URL: https://company-os.shop/health/dependencies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build
      - name: Configure SSH
        run: |
          test -n "$DEV_HOST" && test -n "$DEV_USER" && test -n "$DEV_PORT" && test -n "$DEV_SSH_KEY" && test -n "$DEV_PATH"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/dev_deploy_key
          chmod 600 ~/.ssh/dev_deploy_key
          ssh-keyscan -p "$DEV_PORT" -H "$DEV_HOST" >> ~/.ssh/known_hosts
      - name: Sync repository
        run: |
          ssh -i ~/.ssh/dev_deploy_key -p "$DEV_PORT" "$DEV_USER@$DEV_HOST" "mkdir -p -- '$DEV_PATH'"
          rsync -az --delete \
            --exclude='.git/' --exclude='.env' --exclude='.env.docker' \
            --exclude='vendor/' --exclude='node_modules/' --exclude='tmp/' \
            --exclude='public/uploads/' --exclude='public/docs/' \
            -e "ssh -i ~/.ssh/dev_deploy_key -p $DEV_PORT" \
            ./ "$DEV_USER@$DEV_HOST:$DEV_PATH/"
      - name: Deploy
        run: |
          ssh -i ~/.ssh/dev_deploy_key -p "$DEV_PORT" "$DEV_USER@$DEV_HOST" \
            "cd '$DEV_PATH' && bash deploy/dev.sh && bash deploy/configure-company-os-http.sh '$COMPANY_OS_DOMAIN' 127.0.0.1:8081 && bash deploy/configure-dev-tls.sh '$COMPANY_OS_DOMAIN' 127.0.0.1:8081"
      - name: External health
        run: curl --fail --show-error --silent --location --retry 3 --retry-delay 2 --retry-connrefused "$COMPANY_OS_HEALTHCHECK_URL" > /dev/null
