name: Debug cabinet 500

on:
  push:
    branches: ['debug/cabinet-500']

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: AWS TN2026
    env:
      DEV_HOST: ${{ secrets.DEV_HOST }}
      DEV_USER: ${{ secrets.DEV_USER }}
      DEV_PORT: ${{ secrets.DEV_PORT }}
      DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
      DEV_PATH: ${{ vars.DEV_PATH }}
    steps:
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/dev_deploy_key
          chmod 600 ~/.ssh/dev_deploy_key
          ssh-keyscan -p "$DEV_PORT" -H "$DEV_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect cabinet failure by request id
        run: |
          REMOTE_PATH=$(printf '%q' "$DEV_PATH")
          ssh -i ~/.ssh/dev_deploy_key -p "$DEV_PORT" "$DEV_USER@$DEV_HOST" "cd $REMOTE_PATH && \
            if docker info >/dev/null 2>&1; then D='docker'; C='docker compose'; \
            elif sudo -n docker info >/dev/null 2>&1; then D='sudo -n docker'; C='sudo -n docker compose'; \
            else echo 'docker unavailable'; exit 21; fi; \
            PHP_ID=\$(\$C ps -q php); \
            test -n \"\$PHP_ID\"; \
            \$D exec \"\$PHP_ID\" sh -lc \"grep -F 'TN-A1A6130C0E' /var/www/html/tmp/logs/cos.jsonl | tail -n 1\""
