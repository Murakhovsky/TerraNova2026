name: UX-00 Cross-PR Integration Preflight
on:
  pull_request:
    paths:
      - '.github/workflows/ux00-integration-preflight.yml'
      - 'tests/ux00/integration_preflight.sh'
      - 'tests/ux00/integration-snapshot.env'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merge-preflight:
    name: Pinned merge conflict matrix (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dry-run combined branch merge without remote writes
        env:
          UX00_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          UX00_REPORT_DIR: tmp/ux00-integration-preflight
        run: bash tests/ux00/integration_preflight.sh
      - name: Upload preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux00-cross-pr-merge-matrix
          path: tmp/ux00-integration-preflight/
          if-no-files-found: warn
          retention-days: 14
