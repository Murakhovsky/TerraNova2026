name: WEB V0.11 Design System and Legacy Extraction

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: WEB V0.11 architecture
        run: |
          php -l app/Interfaces/Web/View/index.phtml
          php -l tests/architecture/frontend_assets.php
          php -l tests/architecture/web_v011_design_system.php
          php tests/architecture/web_v011_design_system.php
          php tests/architecture/frontend_assets.php
          node --check frontend/entrypoints/public-surface.js
          node --check frontend/entrypoints/portal-cabinet.js
          node --check frontend/entrypoints/terranova-interface.js
          node --check frontend/features/public/interactions.js
          node --check frontend/features/public/surface.js
