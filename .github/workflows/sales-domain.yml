name: Sales Domain Foundation

on:
  push:
    branches: [main, migration/symfony, migration/sales-domain-foundation]
    paths:
      - 'app/Domains/Sales/Domain/**'
      - 'app/Domains/Sales/Application/Compatibility/**'
      - 'tests/unit/sales_domain_foundation.php'
      - 'tests/architecture/sales_domain_boundaries.php'
      - 'docs/architecture/SALES_DOMAIN.md'
      - '.github/workflows/sales-domain.yml'
  pull_request:
    branches: [main, migration/symfony]
    paths:
      - 'app/Domains/Sales/Domain/**'
      - 'app/Domains/Sales/Application/Compatibility/**'
      - 'tests/unit/sales_domain_foundation.php'
      - 'tests/architecture/sales_domain_boundaries.php'
      - 'docs/architecture/SALES_DOMAIN.md'
      - '.github/workflows/sales-domain.yml'
  workflow_dispatch:

jobs:
  pure-php-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php tests/architecture/sales_domain_boundaries.php
      - run: php tests/unit/sales_domain_foundation.php
      - run: find app/Domains/Sales/Domain app/Domains/Sales/Application/Compatibility -type f -name '*.php' -print0 | xargs -0 -n1 php -l
