name: WEB V0.17 Workspace Canonicalization

on:
  push:
    branches: [main]
    paths:
      - 'symfony/templates/experience/property/submissions.html.twig'
      - 'symfony/src/Web/Property/PropertySubmissionsController.php'
      - 'symfony/templates/experience/admin/analytics.html.twig'
      - 'symfony/src/Web/Workspace/AnalyticsDashboardController.php'
      - 'symfony/src/Application/Experience/Query/GetWorkspaceAnalyticsQueryHandler.php'
      - 'app/Interfaces/Web/View/diagnostic_report/show.phtml'
      - 'symfony/templates/experience/operations/control_center.html.twig'
      - 'symfony/src/Web/Operations/ControlCenterPageController.php'
      - 'symfony/src/Web/Operations/ControlCenterPresenter.php'
      - 'symfony/src/Application/Operations/Query/GetControlCenterOverviewQueryHandler.php'
      - 'app/Interfaces/Web/View/components/ui/kpi_card.phtml'
      - 'symfony/templates/experience/client_case/**'
      - 'symfony/templates/components/client_case/**'
      - 'symfony/src/Web/Sales/ClientCase*'
      - 'symfony/src/Application/Sales/Query/GetClientCase*'
      - 'symfony/assets/styles/domains/client-case.css'
      - 'tests/architecture/web_experience_production_client_case.php'
      - 'docs/03-architecture/cos-production-client-case-adoption.md'
      - 'frontend/styles/components.css'
      - 'tests/architecture/web_v017_workspace_canonicalization.php'
      - 'docs/architecture/web-v0.17.md'
      - '.github/workflows/web-v017.yml'
  pull_request:
    branches: [main]
    paths:
      - 'symfony/templates/experience/property/submissions.html.twig'
      - 'symfony/src/Web/Property/PropertySubmissionsController.php'
      - 'symfony/templates/experience/admin/analytics.html.twig'
      - 'symfony/src/Web/Workspace/AnalyticsDashboardController.php'
      - 'symfony/src/Application/Experience/Query/GetWorkspaceAnalyticsQueryHandler.php'
      - 'app/Interfaces/Web/View/diagnostic_report/show.phtml'
      - 'symfony/templates/experience/operations/control_center.html.twig'
      - 'symfony/src/Web/Operations/ControlCenterPageController.php'
      - 'symfony/src/Web/Operations/ControlCenterPresenter.php'
      - 'symfony/src/Application/Operations/Query/GetControlCenterOverviewQueryHandler.php'
      - 'app/Interfaces/Web/View/components/ui/kpi_card.phtml'
      - 'symfony/templates/experience/client_case/**'
      - 'symfony/templates/components/client_case/**'
      - 'symfony/src/Web/Sales/ClientCase*'
      - 'symfony/src/Application/Sales/Query/GetClientCase*'
      - 'symfony/assets/styles/domains/client-case.css'
      - 'tests/architecture/web_experience_production_client_case.php'
      - 'docs/03-architecture/cos-production-client-case-adoption.md'
      - 'frontend/styles/components.css'
      - 'tests/architecture/web_v017_workspace_canonicalization.php'
      - 'docs/architecture/web-v0.17.md'
      - '.github/workflows/web-v017.yml'

jobs:
  workspace-canonicalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - name: Build frontend assets
        run: npm run build
      - name: Validate migrated surfaces
        run: |
          php -l symfony/src/Web/Property/PropertySubmissionsController.php
          php -l symfony/src/Web/Property/PropertySubmissionsPresenter.php
          php -l symfony/src/Application/Property/Query/GetPropertySubmissionsQueueQueryHandler.php
          php -l symfony/src/Web/Workspace/AnalyticsDashboardController.php
          php -l symfony/src/Web/Workspace/AnalyticsDashboardPresenter.php
          php -l symfony/src/Application/Experience/Query/GetWorkspaceAnalyticsQueryHandler.php
          php -l app/Interfaces/Web/View/diagnostic_report/show.phtml
          php -l symfony/src/Web/Operations/ControlCenterPageController.php
          php -l symfony/src/Web/Operations/ControlCenterPresenter.php
          php -l symfony/src/Application/Operations/Query/GetControlCenterOverviewQueryHandler.php
          php -l symfony/src/Web/Sales/ClientCaseInboxController.php
          php -l symfony/src/Web/Sales/ClientCaseCollectionController.php
          php -l symfony/src/Web/Sales/ClientCaseWorkspaceController.php
          php -l symfony/src/Web/Sales/ClientCaseMutationController.php
          php -l symfony/src/Application/Sales/Query/GetClientCaseWorkspaceQueryHandler.php
          php -l app/Interfaces/Web/View/components/ui/kpi_card.phtml
      - name: Workspace canonicalization gates
        run: |
          php -l tests/architecture/web_v017_workspace_canonicalization.php
          php tests/architecture/web_v017_workspace_canonicalization.php
          php tests/architecture/web_experience_production_client_case.php
          php tests/architecture/web_v016_canonical_components.php
          php tests/architecture/web_v015_visual_language.php
          php tests/architecture/web_v08_analytics_workspace.php
          php tests/architecture/web_v07_property_workspace.php
          php tests/architecture/web_v06_clients_workspace.php
          php tests/architecture/frontend_assets.php
          php tests/architecture/web_v012_production_closure.php
