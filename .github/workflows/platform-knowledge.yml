name: Platform Knowledge Context

on:
  push:
    branches: [main, migration/symfony, migration/platform-knowledge]
    paths:
      - 'app/Platform/Knowledge/**'
      - 'app/Infrastructure/Knowledge/**'
      - 'tests/unit/platform_knowledge_context.php'
      - 'tests/architecture/platform_knowledge_boundaries.php'
      - '.github/workflows/platform-knowledge.yml'
  pull_request:
    branches: [main, migration/symfony, migration/platform-integration]
    paths:
      - 'app/Platform/Knowledge/**'
      - 'app/Infrastructure/Knowledge/**'
      - 'tests/unit/platform_knowledge_context.php'
      - 'tests/architecture/platform_knowledge_boundaries.php'
      - '.github/workflows/platform-knowledge.yml'
  workflow_dispatch:

jobs:
  pure-php-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php tests/architecture/platform_knowledge_boundaries.php
      - run: php tests/unit/platform_knowledge_context.php
      - run: find app/Platform/Knowledge app/Infrastructure/Knowledge -type f -name '*.php' -print0 | xargs -0 -n1 php -l
