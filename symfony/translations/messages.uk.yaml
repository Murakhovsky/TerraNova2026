"Агент уже запускався, але облік токенів не зв’язаний із цим процесом. Це проблема correlation/ledger, а не нульове використання.": "Агент уже запускався, але облік токенів не пов’язаний із цим процесом. Це проблема кореляції та журналу використання, а не нульове використання."
"Зараз система готує контекст для першого агента. Токени й вартість з’являться після першого виклику LLM.": "Система готує контекст для першого агента. Токени й вартість з’являться після першого виклику LLM."
"Провайдер не повернув вартість, а для цієї моделі немає налаштованої ставки. Кількість токенів показана фактично.": "Провайдер не повернув вартість, а для цієї моделі не налаштовано тариф. Кількість токенів показано за фактичними даними."
"No governed actions are available for this context.": "Для цього контексту немає доступних керованих дій."
"No workspace context selected. The latest organization Agent runs are shown below.": "Контекст робочого простору не вибрано. Нижче показано останні запуски агентів організації."
"No Agent runs for this context yet.": "Для цього контексту ще немає запусків агентів."
"What to analyze": "Що аналізуємо"
"Load context": "Завантажити контекст"
"This surface shows context, available governed actions and agent results. It does not pretend to be a universal chat when no such workflow exists.": "Ця панель показує контекст, доступні керовані дії та результати агентів. Вона не видає себе за універсальний чат, якщо відповідного процесу ще немає."
"If the workflow completed analysis without saving a task plan, the plan was not created.": "Якщо процес завершив аналіз без збереженого плану завдань, план не було створено."
"Permanent deletion is available only for drafts or cancelled/failed workflows without a pull request.": "Повне видалення доступне лише для чернетки або скасованого/невдалого процесу без pull request."
"No LLM usage records were found for this workflow.": "Журнал використання LLM для цього процесу не знайдено."
"No execution plan was created.": "План виконання не створено."
"No artifacts have been created yet.": "Артефакти ще не створені."
