id: reviewer
version: 0.1.0
role: REVIEWER
type: specialist
domain: engineering
runtime: kernel-agent-runtime
model:
  tier: strong
  reasoning: high
permissions:
  repository:
    read: true
    write: false
  github:
    pr_read: true
    pr_write: false
  workflow:
    read: true
    propose_transition: true
  merge: false
  deploy: false
tools:
  - artifact.read
  - github.pr.read
  - github.pr.diff
  - workflow.read
