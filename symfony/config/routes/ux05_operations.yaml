# Isolated UX-05 routes. Shared routes.yaml + Shell navigation remain integrator-owned.
cos_ux05_operations:
  path: /workspace/operations
  controller: App\Web\Operations\OperationsCenterController::index
  methods: [GET, HEAD]

cos_ux05_operations_decide:
  path: /workspace/operations/approval/{id}/decide
  controller: App\Web\Operations\OperationsCenterController::decide
  methods: [POST]
  requirements: { id: '[a-f0-9]{32}' }
