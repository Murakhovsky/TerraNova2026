parameters:
  env(N8N_WEBHOOK_SECRET): ''

services:
  _defaults:
    autowire: true
    autoconfigure: true

  _instanceof:
    Kernel\Application\Command\CommandHandlerInterface:
      tags:
        - { name: 'messenger.message_handler', bus: 'command.bus' }
    Kernel\Application\Query\QueryHandlerInterface:
      tags:
        - { name: 'messenger.message_handler', bus: 'query.bus' }
    Kernel\Application\Event\EventHandlerInterface:
      tags:
        - { name: 'messenger.message_handler', bus: 'event.bus' }
    App\Web\Experience\Extension\Contract\WebExtensionProviderInterface:
      tags:
        - { name: 'cos.web.extension.provider' }
    App\Web\Experience\Action\UIActionPermissionCheckerInterface:
      tags:
        - { name: 'cos.web.action.permission_checker' }

  App\:
    resource: '../src/'

  App\Controller\:
    resource: '../src/Controller/'
    tags: ['controller.service_arguments']

  App\Http\Api\V1\Controller\:
    resource: '../src/Http/Api/V1/Controller/'
    public: true
    tags: ['controller.service_arguments']

  App\Application\Identity\Service\AccountAuthenticationService:
