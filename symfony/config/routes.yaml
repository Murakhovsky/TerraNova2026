cos_symfony_home:
  path: /
  controller: App\Controller\HealthController::index
  methods: [GET]

cos_symfony_health:
  path: /health
  controller: App\Controller\HealthController::health
  methods: [GET]

cos_symfony_core_health:
  path: /migration/core-health
  controller: App\Controller\CoreHealthController
  methods: [GET]

cos_symfony_migration_auth_context:
  path: /migration/api/cos/auth-context
  controller: App\Controller\SecurityContextController
  methods: [GET]

cos_symfony_migration_actions:
  path: /migration/api/cos/actions
  controller: App\Controller\OperationsReadController::actions
  methods: [GET]

cos_symfony_migration_action:
  path: /migration/api/cos/actions/{id}
  controller: App\Controller\OperationsReadController::action
  methods: [GET]
  requirements:
    id: '[a-f0-9]{32}'

cos_symfony_migration_approvals:
  path: /migration/api/cos/approvals
  controller: App\Controller\OperationsReadController::approvals
  methods: [GET]

cos_symfony_migration_agents:
  path: /migration/api/cos/agents
  controller: App\Controller\OperationsReadController::agents
  methods: [GET]

cos_symfony_migration_rules:
  path: /migration/api/cos/rules
  controller: App\Controller\OperationsReadController::rules
  methods: [GET]

cos_symfony_migration_events:
  path: /migration/api/cos/events
  controller: App\Controller\OperationsReadController::events
  methods: [GET]

cos_symfony_migration_audit:
  path: /migration/api/cos/audit
  controller: App\Controller\OperationsReadController::audit
  methods: [GET]

cos_api_v1_status:
  path: /api/v1/status
  controller: App\Http\Api\V1\Controller\ApiStatusController
  methods: [GET]

cos_api_v1_sales_client_case_stats:
  path: /api/v1/sales/client-cases/stats
  controller: App\Http\Api\V1\Controller\SalesClientCaseStatsController
  methods: [GET]

cos_api_v1_sales_dashboard:
  path: /api/v1/sales/dashboard
  controller: App\Http\Api\V1\Controller\SalesReadController::dashboard
  methods: [GET]

cos_api_v1_sales_leads:
  path: /api/v1/sales/leads
  controller: App\Http\Api\V1\Controller\SalesReadController::leads
  methods: [GET]

cos_api_v1_sales_lead:
  path: /api/v1/sales/leads/{id}
  controller: App\Http\Api\V1\Controller\SalesReadController::lead
  methods: [GET]
  requirements:
    id: '[1-9][0-9]*'

cos_api_v1_sales_opportunities:
  path: /api/v1/sales/opportunities
  controller: App\Http\Api\V1\Controller\SalesReadController::opportunities
  methods: [GET]

cos_api_v1_sales_opportunity:
  path: /api/v1/sales/opportunities/{id}
  controller: App\Http\Api\V1\Controller\SalesReadController::opportunity
  methods: [GET]
  requirements:
    id: '[1-9][0-9]*'

cos_api_v1_sales_pipelines:
  path: /api/v1/sales/pipelines
  controller: App\Http\Api\V1\Controller\SalesReadController::pipelines
  methods: [GET]

cos_api_v1_sales_lead_create:
  path: /api/v1/sales/leads
  controller: App\Http\Api\V1\Controller\SalesWriteController::createLead
  methods: [POST]

cos_api_v1_sales_lead_update:
  path: /api/v1/sales/leads/{id}
  controller: App\Http\Api\V1\Controller\SalesWriteController::updateLead
  methods: [PATCH]
  requirements:
    id: '[1-9][0-9]*'

cos_api_v1_sales_lead_convert:
  path: /api/v1/sales/leads/{id}/opportunity
  controller: App\Http\Api\V1\Controller\SalesWriteController::convertLead
  methods: [POST]
  requirements:
    id: '[1-9][0-9]*'

cos_api_v1_sales_opportunity_activity_create:
  path: /api/v1/sales/opportunities/{id}/activities
  controller: App\Http\Api\V1\Controller\SalesWriteController::addActivity
  methods: [POST]
  requirements:
    id: '[1-9][0-9]*'

cos_api_v1_sales_opportunity_stage:
  path: /api/v1/sales/opportunities/{id}/stage
  controller: App\Http\Api\V1\Controller\SalesWriteController::changeStage
  methods: [POST]
  requirements:
    id: '[1-9][0-9]*'

cos_api_v1_sales_opportunity_next_action:
  path: /api/v1/sales/opportunities/{id}/next-action
  controller: App\Http\Api\V1\Controller\SalesWriteController::setNextAction
  methods: [PUT]
  requirements:
    id: '[1-9][0-9]*'

