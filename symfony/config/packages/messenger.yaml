framework:
  messenger:
    default_bus: command.bus
    buses:
      command.bus:
        default_middleware:
          enabled: true
          allow_no_handlers: false
          allow_no_senders: true
      query.bus:
        default_middleware:
          enabled: true
          allow_no_handlers: false
          allow_no_senders: true
      event.bus:
        default_middleware:
          enabled: true
          allow_no_handlers: true
          allow_no_senders: true
