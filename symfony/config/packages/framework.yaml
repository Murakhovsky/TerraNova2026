framework:
  secret: '%env(APP_SECRET)%'
  router:
    utf8: true
  serializer:
    enabled: true
    default_context:
      allow_extra_attributes: false
  validation:
    enabled: true
    enable_attributes: true
  php_errors:
    log: true
  cache:
    app: cache.adapter.filesystem
    prefix_seed: cos/symfony
