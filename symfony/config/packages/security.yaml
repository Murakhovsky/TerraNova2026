security:
  providers:
    cos_users:
      id: App\Security\CosIdentityLoader

  firewalls:
    cos_api:
      pattern: '^/(?:api/v1|api/spatial|sales|cos/architecture|admin/(?:diagnostics|content)|diagnostics|spatial)(?:/|$)'
      stateless: true
      provider: cos_users
      custom_authenticators:
        - App\Security\SessionAuthenticator
        - App\Security\SpatialBearerAuthenticator
      entry_point: App\Security\SessionAuthenticator
      access_denied_handler: App\Security\JsonAccessDeniedHandler

  access_control:
    - { path: '^/api/v1/health$', roles: PUBLIC_ACCESS }
    - { path: '^/api/v1/public/properties(?:/|$)', roles: PUBLIC_ACCESS, methods: [GET, HEAD] }
    - { path: '^/api/v1/integrations/crm/[1-9][0-9]*/webhook$', roles: PUBLIC_ACCESS }
    - { path: '^/api/spatial/auth/token$', roles: PUBLIC_ACCESS }
    - { path: '^/api/spatial/scenes/[A-Za-z0-9-]+$', roles: PUBLIC_ACCESS, methods: [GET, HEAD] }
    - { path: '^/api/spatial/events$', roles: PUBLIC_ACCESS, methods: [POST] }
    - { path: '^/api/v1/admin/diagnostics(?:/|$)', roles: IS_AUTHENTICATED_FULLY }
    - { path: '^/sales(?:/|$)', roles: IS_AUTHENTICATED_FULLY }
    - { path: '^/cos/architecture(?:/|$)', roles: IS_AUTHENTICATED_FULLY }
    - { path: '^/admin/diagnostics(?:/|$)', roles: IS_AUTHENTICATED_FULLY }
    - { path: '^/admin/content(?:/|$)', roles: IS_AUTHENTICATED_FULLY }
    - { path: '^/diagnostics(?:/|$)', roles: IS_AUTHENTICATED_FULLY }
    - { path: '^/spatial/scene/[A-Za-z0-9_-]+$', roles: PUBLIC_ACCESS, methods: [GET, HEAD] }
    - { path: '^/spatial(?:/|$)', roles: IS_AUTHENTICATED_FULLY }
    - { path: '^/api/spatial(?:/|$)', roles: IS_AUTHENTICATED_FULLY }
    - { path: '^/api/v1(?:/|$)', roles: ROLE_MANAGER }
