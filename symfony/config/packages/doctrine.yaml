doctrine:
  dbal:
    driver: pdo_mysql
    host: '%env(DB_HOST)%'
    port: '%env(int:DB_PORT)%'
    dbname: '%env(DB_DATABASE)%'
    user: '%env(DB_USERNAME)%'
    password: '%env(DB_PASSWORD)%'
    server_version: '8.4.0'
    charset: utf8mb4
    use_savepoints: true

  orm:
    auto_generate_proxy_classes: true
    naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
    auto_mapping: false
    mappings:
      AppPersistence:
        type: attribute
        is_bundle: false
        dir: '%kernel.project_dir%/src/Persistence/Doctrine/Entity'
        prefix: 'App\Persistence\Doctrine\Entity'
        alias: AppPersistence
