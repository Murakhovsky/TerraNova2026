doctrine:
  dbal:
    url: '%env(resolve:DATABASE_URL)%'
    use_savepoints: true

  orm:
    auto_generate_proxy_classes: true
    naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
    auto_mapping: false
    mappings:
      AppPersistence:
        type: attribute
        is_bundle: false
        dir: '%kernel.project_dir%/src/Persistence/Doctrine/Entity'
        prefix: 'App\Persistence\Doctrine\Entity'
        alias: AppPersistence
