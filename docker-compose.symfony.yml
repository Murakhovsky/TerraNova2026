name: cos-symfony

services:
  nginx:
    build:
      context: .
      dockerfile: docker/symfony/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - frontend

  php:
    build:
      context: .
      dockerfile: docker/symfony/php/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${SYMFONY_APP_SECRET}
      COS_ORGANIZATION_ID: ${COS_ORGANIZATION_ID:-default}
      DATABASE_URL: "mysql://cos:${SYMFONY_DB_PASSWORD}@mysql:3306/cos_symfony?serverVersion=8.4.0&charset=utf8mb4"
      REDIS_URL: redis://redis:6379
      LEGACY_DB_HOST: ${SYMFONY_LEGACY_DB_HOST:-cos-mysql-1}
      LEGACY_DB_PORT: 3306
      LEGACY_DB_NAME: ${SYMFONY_LEGACY_DB_NAME:-cos}
      LEGACY_DB_USER: cos_symfony_ro
      LEGACY_DB_PASSWORD: ${SYMFONY_LEGACY_DB_PASSWORD:-ci-readonly-password}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - frontend
      - backend
      - legacy_backend

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cos_symfony
      MYSQL_USER: cos
      MYSQL_PASSWORD: ${SYMFONY_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${SYMFONY_DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - symfony_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - symfony_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

volumes:
  symfony_mysql_data:
  symfony_redis_data:

networks:
  frontend:
  backend:
    internal: true
  legacy_backend:
    external: true
    name: cos_backend
