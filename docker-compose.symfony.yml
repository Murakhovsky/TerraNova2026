name: cos-symfony

x-symfony-environment: &symfony-environment
  APP_ENV: prod
  APP_DEBUG: "0"
  APP_SECRET: ${SYMFONY_APP_SECRET}
  COS_ORGANIZATION_ID: ${COS_ORGANIZATION_ID:-default}
  COS_SALES_AUTOMATION_SCHEDULER_ENABLED: ${COS_SALES_AUTOMATION_SCHEDULER_ENABLED:-1}
  COS_AGENT_LLM_MODE: ${COS_AGENT_LLM_MODE:-http}
  LLM_ENDPOINT: ${LLM_ENDPOINT:-}
  LLM_TOKEN: ${LLM_TOKEN:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-http}
  DATABASE_URL: "mysql://cos:${SYMFONY_DB_PASSWORD}@mysql:3306/cos_symfony?serverVersion=8.4.0&charset=utf8mb4"
  REDIS_URL: redis://redis:6379
  MESSENGER_TRANSPORT_DSN: redis://redis:6379/cos_async
  MESSENGER_FAILED_TRANSPORT_DSN: redis://redis:6379/cos_failed
  LEGACY_DB_HOST: ${SYMFONY_LEGACY_DB_HOST:-cos-mysql-1}
  LEGACY_DB_PORT: 3306
  LEGACY_DB_NAME: ${SYMFONY_LEGACY_DB_NAME:-cos}
  LEGACY_DB_USER: ${SYMFONY_LEGACY_DB_USER:-cos_symfony_app}
  LEGACY_DB_PASSWORD: ${SYMFONY_LEGACY_DB_PASSWORD:-ci-readonly-password}
  LEGACY_SESSION_SAVE_PATH: /var/www/html/legacy-sessions
  LEGACY_SESSION_COOKIE_NAME: ${SYMFONY_LEGACY_SESSION_COOKIE_NAME:-PHPSESSID}
  WAVE6_CRM_WEBHOOK_SECRET: ${WAVE6_CRM_WEBHOOK_SECRET:-}

services:
  nginx:
    build:
      context: .
      dockerfile: docker/symfony/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [frontend]

  php:
    image: cos-symfony-php:local
    build:
      context: .
      dockerfile: docker/symfony/php/Dockerfile
    restart: unless-stopped
    environment:
      <<: *symfony-environment
      MESSENGER_CONSUMER_NAME: http
    volumes:
      - legacy_php_sessions:/var/www/html/legacy-sessions:ro
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [frontend, backend, legacy_backend]

  worker:
    image: cos-symfony-php:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["php", "bin/console", "messenger:consume", "async", "--keepalive=5", "--time-limit=3600", "--memory-limit=256M", "--failure-limit=1"]
    environment:
      <<: *symfony-environment
      MESSENGER_CONSUMER_NAME: ${SYMFONY_MESSENGER_CONSUMER_NAME:-worker-1}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [backend, legacy_backend]

  scheduler:
    image: cos-symfony-php:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["php", "bin/console", "messenger:consume", "scheduler_cos", "--time-limit=3600", "--memory-limit=128M", "--failure-limit=1"]
    environment:
      <<: *symfony-environment
      MESSENGER_CONSUMER_NAME: scheduler-1
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [backend, legacy_backend]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cos_symfony
      MYSQL_USER: cos
      MYSQL_PASSWORD: ${SYMFONY_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${SYMFONY_DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - symfony_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - symfony_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

volumes:
  symfony_mysql_data:
  symfony_redis_data:
  legacy_php_sessions:
    external: true
    name: cos_php_sessions

networks:
  frontend:
  backend:
    internal: true
  legacy_backend:
    external: true
    name: cos_backend
