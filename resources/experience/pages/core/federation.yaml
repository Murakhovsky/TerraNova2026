# COS Federation: contracted draft Goal workspace; implementation quality must be accepted separately.
pages:
  - id: federation.goals.workspace
    route: { name: cos_federation_goals_index, path: "/workspace/goals", methods: [GET, HEAD] }
    surface: workspace
    domain: Core
    capability: federation.goals.view
    owner: COS Experience Platform
    priority: P0
    status: CONTRACTED
    personas: [manager, administrator]
    product:
      primary_goal: "Створити вимірювану бізнес-ціль та побачити її стан у режимах Результат, Процес і Експерт."
      page_purpose: "Підготовка бізнес-цілей без запуску непогоджених дій."
    archetype: portal
    patterns:
      required: [PageHeader]
      optional: []
    primary_action: federation.goals.create
    states: [normal]
    responsive: { desktop: canonical, tablet: canonical, mobile: canonical }
    qa: { functional: false, visual: false, responsive: false, accessibility: false, human_acceptance: false }
    quality: { functionality: 0, ux: 0, visual: 0, responsive: 0, accessibility: 0, content: 0 }

  - id: core.capabilities.library
    route: { name: cos_capabilities_workspace, path: "/workspace/capabilities", methods: [GET] }
    surface: workspace
    domain: Core
    capability: core.capabilities.view
    owner: COS Experience Platform
    priority: P0
    status: CONTRACTED
    personas: [manager, administrator]
    product:
      primary_goal: "Переглянути наявні команди та відрізнити безпечні операції від тих, що потребують Workflow."
      page_purpose: "Канонічна бібліотека Domain capabilities без автоматичного запуску операцій."
    archetype: portal
    patterns:
      required: [PageHeader]
      optional: []
    primary_action: core.capabilities.inspect
    states: [normal]
    responsive: { desktop: canonical, tablet: canonical, mobile: canonical }
    qa: { functional: false, visual: false, responsive: false, accessibility: false, human_acceptance: false }
    quality: { functionality: 0, ux: 0, visual: 0, responsive: 0, accessibility: 0, content: 0 }

  - id: property.bulk.workspace
    route: { name: cos_property_bulk_workspace, path: "/workspace/property/bulk", methods: [GET] }
    surface: workspace
    domain: Property
    capability: property.bulk.create
    owner: COS Experience Platform
    priority: P0
    status: CONTRACTED
    personas: [manager, administrator]
    product:
      primary_goal: "Підготувати до десяти об'єктів Property до незалежного погодження перед внесенням до каталогу."
      page_purpose: "Ручна перевірка незмінного пакета, формування Goal/Plan і перегляд native результатів."
    archetype: portal
    patterns:
      required: [PageHeader]
      optional: []
    primary_action: property.bulk.plan.propose
    states: [normal]
    responsive: { desktop: canonical, tablet: canonical, mobile: canonical }
    qa: { functional: false, visual: false, responsive: false, accessibility: false, human_acceptance: false }
    quality: { functionality: 0, ux: 0, visual: 0, responsive: 0, accessibility: 0, content: 0 }
