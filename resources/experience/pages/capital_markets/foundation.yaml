pages:
  - id: capital_markets.overview
    route: { name: capital_markets_overview, path: /capital-markets, methods: [GET] }
    surface: workspace
    domain: Capital Markets
    capability: capital_markets.view
    owner: Capital Markets
    priority: P1
    status: IMPLEMENTED
    personas: [capital_markets_user, administrator]
    product:
      primary_goal: "Understand the structural state of the Capital Markets foundation and open the relevant registry."
      page_purpose: "Foundation overview for instruments, economic relationships and venues without market-data or execution surfaces."
    archetype: domain_dashboard
    patterns:
      required: [PageHeader, KpiStrip]
      optional: [EntityList, EmptyState, ErrorState]
    primary_action: capital_markets.instrument.create
    states: [normal, empty, error, permission_denied]
    responsive: { desktop: dashboard, tablet: dashboard, mobile: stacked_dashboard }
    qa: { functional: true, visual: false, responsive: false, accessibility: false, human_acceptance: false }
    quality: { functionality: 2, ux: 1, visual: 1, responsive: 1, accessibility: 1, content: 2 }

