# Marketing M0/M1 Experience contracts. CONTRACTED is not UX acceptance.
pages:
  - id: marketing.overview
    route: { name: cos_marketing_overview, path: /marketing, methods: [GET] }
    surface: workspace
    domain: Marketing
    capability: marketing.overview.view
    owner: Marketing
    priority: P0
    status: CONTRACTED
    personas: [marketing_manager]
    product:
      primary_goal: "Review campaign drafts, paid accounts and the current implementation gates."
      page_purpose: "Marketing domain overview for planning and read-only paid media."
    archetype: domain_dashboard
    patterns:
      required: [PageHeader, KpiStrip]
      optional: [EntityList, EmptyState, ErrorState]
    primary_action: marketing.open_campaigns
    states: [normal]
    responsive: { desktop: dashboard, tablet: dashboard, mobile: stacked_dashboard }
    qa: { functional: false, visual: false, responsive: false, accessibility: false, human_acceptance: false }
    quality: { functionality: 0, ux: 0, visual: 0, responsive: 0, accessibility: 0, content: 0 }

