    priority: P0
    status: CONTRACTED
    personas: [marketing_manager]
    product:
      primary_goal: "Inspect marketing drafts and add a new versioned draft."
      page_purpose: "Tenant-scoped campaign draft collection and create entrypoint."
    archetype: collection
    patterns:
      required: [PageHeader, EntityList, FilterBar]
      optional: [EmptyState, ErrorState]
    primary_action: marketing.campaign.create
    states: [normal]
    responsive: { desktop: canonical, tablet: canonical, mobile: canonical }
    qa: { functional: false, visual: false, responsive: false, accessibility: false, human_acceptance: false }
    quality: { functionality: 0, ux: 0, visual: 0, responsive: 0, accessibility: 0, content: 0 }

