    capability: sales.lead.list
    owner: Sales
    priority: P0
    status: IMPLEMENTED
    personas: [sales_manager, sales_agent]
    product:
      primary_goal: "Find leads that require attention and open the next useful action."
      page_purpose: "Searchable and filterable Sales lead collection."
      success_condition: "The user can locate a lead and start the create-lead workflow or open an existing lead."
    archetype: collection
