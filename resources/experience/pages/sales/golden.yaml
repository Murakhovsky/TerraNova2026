pages:
  - id: sales.dashboard
    route: { name: cos_web_sales_dashboard, path: /sales/dashboard, methods: [GET] }
    surface: workspace
    domain: Sales
    capability: sales.dashboard.view
    owner: Sales
    priority: P0
    status: IMPLEMENTED
    personas: [sales_manager, sales_agent]
    product:
      primary_goal: "Understand Sales performance and attention areas."
      page_purpose: "Sales domain overview with KPIs and actionable operational context."
      success_condition: "The user can inspect Sales KPIs and open the actionable Today queue."
    archetype: domain_dashboard
    patterns:
      required: [PageHeader, KpiStrip]
      optional: [EntityList, EmptyState, ErrorState]
    primary_action: sales.open_today
    states: [normal, error]
    responsive: { desktop: dashboard, tablet: dashboard, mobile: stacked_dashboard }
    qa: { functional: true, visual: true, responsive: true, accessibility: true, human_acceptance: false }
    quality: { functionality: 3, ux: 3, visual: 3, responsive: 3, accessibility: 3, content: 3 }

  - id: sales.today
    route: { name: cos_web_sales_today, path: /sales/today, methods: [GET] }
    surface: workspace
    domain: Sales
    capability: sales.today.view
    owner: Sales
    priority: P0
    status: IMPLEMENTED
    personas: [sales_manager, sales_agent]
    product:
      primary_goal: "See the work that needs attention now."
      page_purpose: "Operational queue for today's Sales work."
      success_condition: "The user can identify a pending Sales task and open its next governed action."
    archetype: operational_queue
    patterns:
      required: [PageHeader, EntityList]
      optional: [KpiStrip, FilterBar, ActionBar, EmptyState, ErrorState]
    primary_action: sales.execute_next_action
    states: [normal, loading, empty, error, permission_denied]
    responsive: { desktop: queue, tablet: queue, mobile: entity_list }
    qa: { functional: true, visual: true, responsive: true, accessibility: true, human_acceptance: false }
    quality: { functionality: 3, ux: 3, visual: 3, responsive: 3, accessibility: 3, content: 3 }

