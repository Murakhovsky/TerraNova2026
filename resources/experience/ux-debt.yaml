version: 1
status: active
items:
  - id: UXD-001
    title: "Validate route-specific goals and complete action/state/success criteria"
    severity: critical
    status: open
    affected: [resources/experience/pages/inventory.yaml]
    user_cost: "Goals are now route-specific, but generated primary actions and normal-only states still leave many contracts short of an implementable, testable user outcome."
    evidence: "This pass replaces 85 generic goals in the 89-route inventory; primary_action identifiers and state coverage still require validation against implemented workflows."
    closure: "Every active P0/P1 contract has a route-specific goal, an action that names the user outcome, meaningful loading/empty/error/permission states where applicable, and a success condition validated against the actual route."
  - id: UXD-002
    title: "Reduce priority inflation"
    severity: high
    status: open
    affected: [resources/experience/pages]
    user_cost: "Criticality becomes meaningless when nearly every route is P0/P1; delivery cannot focus on user-critical paths."
    evidence: "Inventory priorities are heavily concentrated in P0/P1; reliable route-level usage, impact, and failure-cost evidence is not yet attached to every contract."
    closure: "Priority policy is documented and active routes are reclassified using impact, frequency, and failure cost; no priority is changed automatically without reviewable evidence."
  - id: UXD-003
    title: "Synchronize automated QA evidence into page contracts"
    severity: high
    status: open
    affected: [resources/experience/pages, tests]
    user_cost: "Dashboards under-report verified checks or confuse automated verification with human acceptance."
    evidence: "Golden Eight browser artifacts now record source commit, tested checkout, workflow run/attempt, timestamp, and per-page screenshot/accessibility artifact paths; Page Contract QA fields are still not linked to those artifacts."
    closure: "Automated QA results carry run/source/timestamp provenance; human acceptance remains a separate decision."
