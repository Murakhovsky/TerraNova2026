version: 1
status: draft
journeys:
  sales_lead_to_next_action:
    persona: sales_manager
    trigger: "A new lead arrives or an existing lead requires attention."
    goal: "Determine the next useful action and preserve ownership."
    steps: [review_context, assess_fit, assign_owner, choose_next_action, record_outcome]
    decision_points:
      - id: qualification
        after: assess_fit
        question: "Is there enough current evidence and reachable contact information to pursue this lead?"
        outcomes:
          proceed: "Assign an owner and create a dated next action."
          disqualify: "Record a reason and close the lead as disqualified."
          recover: "Request missing details or schedule a requalification task."
        default_outcome: recover
      - id: next_action
        after: choose_next_action
        question: "Can the next action be completed by a named owner within a meaningful timeframe?"
        outcomes:
          proceed: "Save the owner, action, and due date."
          recover: "Keep the lead open and request an owner or due date."
        default_outcome: recover
    success: "Lead has an owner, a meaningful state, and a dated next action or a documented disqualification."
    failure_recovery: [validation_error, duplicate_lead, missing_contact_data, permission_denied]
  growth_signal_to_opportunity:
    persona: growth_manager
    trigger: "A new market signal is detected."
    goal: "Decide whether the signal justifies outreach."
    steps: [inspect_source_evidence, assess_relevance, understand_why_now, create_or_reject_opportunity, select_outreach]
    decision_points:
      - id: signal_quality
        after: assess_relevance
        question: "Is the source evidence current, attributable, and relevant to a target account?"
        outcomes:
          qualify: "Continue to why-now analysis and opportunity creation."
          reject: "Record the reason and retain the signal as rejected."
          defer: "Keep the signal in review until evidence is refreshed."
        default_outcome: defer
      - id: outreach_readiness
        after: select_outreach
        question: "Is there a supported reason to contact a named account now?"
        outcomes:
          proceed: "Create a traceable outreach action with an owner."
          defer: "Record the missing evidence or timing dependency."
        default_outcome: defer
    success: "Decision is traceable to evidence and has an explicit next step."
    failure_recovery: [stale_evidence, low_confidence, duplicate_account, provider_failure]
  property_to_publication:
    persona: property_operator
    trigger: "A property is imported, created, or materially changed."
    goal: "Publish correct and complete property information."
    steps: [review_identity, validate_required_fields, attach_media, resolve_quality_issues, preview_publication, publish]
    decision_points:
      - id: completeness
        after: validate_required_fields
        question: "Are identity, required facts, and required media complete and valid?"
        outcomes:
          proceed: "Continue to media and quality review."
          recover: "Return field-level validation errors and keep the submission unpublished."
          reject: "Flag an irreconcilable duplicate or invalid record for review."
        default_outcome: recover
      - id: publication_readiness
        after: preview_publication
        question: "Does the preview match the canonical record and meet publication requirements?"
        outcomes:
          publish: "Publish and expose the resulting publication status."
          revise: "Return to editing with specific issues to correct."
          block: "Keep unpublished and record the blocking reason."
        default_outcome: revise
    success: "Published read model matches the canonical property state and publication status is visible."
    failure_recovery: [missing_required_data, invalid_media, permission_denied, publication_failure]
  executive_exception_review:
    persona: executive
    trigger: "A material KPI changes or a critical exception is raised."
    goal: "Understand impact and decide who acts next."
    steps: [review_summary, inspect_variance, inspect_evidence, assign_accountability, record_decision]
    decision_points:
      - id: materiality
        after: inspect_variance
        question: "Is the variance material enough to require a business decision?"
        outcomes:
          investigate: "Inspect supporting evidence and likely causes."
          monitor: "Record a monitoring threshold and review date."
          dismiss: "Record why the variance is not actionable."
        default_outcome: investigate
      - id: evidence_quality
        after: inspect_evidence
        question: "Is the evidence current and sufficiently traceable to support a decision?"
        outcomes:
          decide: "Assign accountability and record the decision."
          data_issue: "Flag the metric or source for correction before deciding."
        default_outcome: data_issue
    success: "Decision, owner, and follow-up are explicit."
    failure_recovery: [stale_metrics, missing_provenance, unavailable_drill_down]
